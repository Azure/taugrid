apiVersion: tau.azure.com/v1alpha1
kind: TopologyPolicy
metadata:
  name: azure-default
spec:
  description: "Azure AKS GPU presets for the GitOps-owned test-cluster shared ClusterQueue mode. Presets describe workload shape; Kueue admission goes through each team namespace's jobqueue LocalQueue and the shared taugrid ClusterQueue."
  presets:
    azure.research.training.l:
      description: "Shared GPU training, one full GPU. Default safe lane for finetune/smoke training."
      profile: null
      team: research
      lane: training
      mode: fixed
      placement: independent
      shape: 1xgpu
      gpuClass: any
      queue: jobqueue
      clusterQueue: tau-cq
      topologyName: default-node-topology
      namespace: taugrid-default
      workloadPriorityClassName: taugrid-default
      podPriorityClassName: taugrid-default
      explain: "Runs through the shared GPU queue. Kueue can admit it against any available GPU flavor instead of pinning the preset to one SKU."
    azure.research.training.2x:
      description: "Shared GPU training, 2 full GPUs."
      profile: null
      team: research
      lane: training
      mode: fixed
      placement: independent
      shape: 2xgpu
      gpuClass: any
      queue: jobqueue
      clusterQueue: tau-cq
      topologyName: default-node-topology
      namespace: taugrid-default
      workloadPriorityClassName: taugrid-default
      podPriorityClassName: taugrid-default
      explain: "Requests two standard GPUs in the shared queue. The preset records shape intent without forcing A100/H100/H200 selection."
    azure.research.training.4x:
      description: "Shared GPU training, 4 full GPUs."
      profile: null
      team: research
      lane: training
      mode: fixed
      placement: independent
      shape: 4xgpu
      gpuClass: any
      queue: jobqueue
      clusterQueue: tau-cq
      topologyName: default-node-topology
      namespace: taugrid-default
      workloadPriorityClassName: taugrid-default
      podPriorityClassName: taugrid-default
      explain: "Requests four standard GPUs in the shared queue. Kueue sees one shared queue and can pick from the pool's available GPU flavors."
    azure.research.training.xl:
      description: "Shared GPU training, 8 full GPUs."
      profile: null
      team: research
      lane: training
      mode: fixed
      placement: independent
      shape: 8xgpu
      gpuClass: any
      queue: jobqueue
      clusterQueue: tau-cq
      topologyName: default-node-topology
      namespace: taugrid-default
      workloadPriorityClassName: taugrid-default
      podPriorityClassName: taugrid-default
      explain: "Requests eight standard GPUs in the shared queue. The platform keeps topology explainability while avoiding per-SKU queues for one-team operation."
    azure.research.eval.gpu:
      description: "Shared GPU evaluation on one full GPU."
      profile: null
      team: research
      lane: eval
      mode: fixed
      placement: independent
      shape: 1xgpu
      gpuClass: any
      queue: jobqueue
      clusterQueue: tau-cq
      topologyName: default-node-topology
      namespace: taugrid-default
      workloadPriorityClassName: taugrid-default
      podPriorityClassName: taugrid-default
      explain: "Uses the shared GPU queue with eval priority metadata instead of a separate eval LocalQueue."
    azure.research.elastic.gpu:
      description: "Shared checkpointable backfill on any available GPU capacity."
      profile: null
      team: research
      lane: elastic
      mode: elastic
      placement: independent
      shape: 1xgpu
      gpuClass: any
      queue: jobqueue
      clusterQueue: tau-cq
      topologyName: default-node-topology
      namespace: taugrid-default
      checkpointEvery: 15m
      workloadPriorityClassName: taugrid-default
      podPriorityClassName: taugrid-default
      explain: "Elastic/backfill work stays checkpointable and low priority, but it shares the same LocalQueue while capacity is managed by priority."
    azure.experimental.training.l:
      description: "Compatibility alias for shared GPU training, one full GPU."
      profile: null
      team: experimental
      lane: training
      mode: fixed
      placement: independent
      shape: 1xgpu
      gpuClass: any
      queue: jobqueue
      clusterQueue: tau-cq
      topologyName: default-node-topology
      namespace: taugrid-default
      workloadPriorityClassName: taugrid-default
      podPriorityClassName: taugrid-default
      explain: "Kept for existing --team experimental workflows, but it now shares the shared GPU queue."
    azure.experimental.training.2x:
      description: "Compatibility alias for shared GPU training, 2 full GPUs."
      profile: null
      team: experimental
      lane: training
      mode: fixed
      placement: independent
      shape: 2xgpu
      gpuClass: any
      queue: jobqueue
      clusterQueue: tau-cq
      topologyName: default-node-topology
      namespace: taugrid-default
      workloadPriorityClassName: taugrid-default
      podPriorityClassName: taugrid-default
      explain: "Kept for existing --team experimental workflows, but it now shares the shared GPU queue."
    azure.experimental.training.4x:
      description: "Compatibility alias for shared GPU training, 4 full GPUs."
      profile: null
      team: experimental
      lane: training
      mode: fixed
      placement: independent
      shape: 4xgpu
      gpuClass: any
      queue: jobqueue
      clusterQueue: tau-cq
      topologyName: default-node-topology
      namespace: taugrid-default
      workloadPriorityClassName: taugrid-default
      podPriorityClassName: taugrid-default
      explain: "Kept for existing --team experimental workflows, but it now shares the shared GPU queue."
    azure.experimental.eval.gpu:
      description: "Compatibility alias for shared GPU evaluation."
      profile: null
      team: experimental
      lane: eval
      mode: fixed
      placement: independent
      shape: 1xgpu
      gpuClass: any
      queue: jobqueue
      clusterQueue: tau-cq
      topologyName: default-node-topology
      namespace: taugrid-default
      workloadPriorityClassName: taugrid-default
      podPriorityClassName: taugrid-default
      explain: "Kept for existing --team experimental workflows, but it now shares the shared GPU queue with eval priority metadata."
    azure.experimental.elastic.gpu:
      description: "Compatibility alias for shared checkpointable backfill."
      profile: null
      team: experimental
      lane: elastic
      mode: elastic
      placement: independent
      shape: 1xgpu
      gpuClass: any
      queue: jobqueue
      clusterQueue: tau-cq
      topologyName: default-node-topology
      namespace: taugrid-default
      checkpointEvery: 15m
      workloadPriorityClassName: taugrid-default
      podPriorityClassName: taugrid-default
      explain: "Kept for existing --team experimental workflows, but it now shares the shared GPU queue as low-priority checkpointable work."
    azure.research.large-memory.2x:
      description: "Large-memory training, 2-GPU NVLink-paired H200 subset."
      profile: null
      team: research
      lane: large-memory
      mode: fixed
      placement: single-node-nvlink
      shape: 2xh200-141gb
      gpuClass: h200-141gb
      queue: jobqueue
      clusterQueue: tau-cq
      topologyName: default-node-topology
      namespace: taugrid-default
      resourceFlavor: nd-h200-v5
      workloadPriorityClassName: taugrid-default
      podPriorityClassName: taugrid-default
      explain: "Memory-bound workloads that fit in 2x141GB without needing a full 8-GPU H200 node. Shares the shared GPU queue while preserving the H200 node selector."
    azure.research.large-memory.4x:
      description: "Large-memory training, 4-GPU NVLink-paired H200 subset."
      profile: null
      team: research
      lane: large-memory
      mode: fixed
      placement: single-node-nvlink
      shape: 4xh200-141gb
      gpuClass: h200-141gb
      queue: jobqueue
      clusterQueue: tau-cq
      topologyName: default-node-topology
      namespace: taugrid-default
      resourceFlavor: nd-h200-v5
      workloadPriorityClassName: taugrid-default
      podPriorityClassName: taugrid-default
      explain: "Half-node H200 NVLink subset for memory-bound workloads that don't need full 8x. Shares the shared GPU queue while preserving the H200 node selector."
    azure.research.large-memory.xl:
      description: "Large-memory training on one 8xH200 NVLink node."
      profile: null
      team: research
      lane: large-memory
      mode: fixed
      placement: single-node-nvlink
      shape: 8xh200-141gb
      gpuClass: h200-141gb
      queue: jobqueue
      clusterQueue: tau-cq
      topologyName: default-node-topology
      namespace: taugrid-default
      resourceFlavor: nd-h200-v5
      workloadPriorityClassName: taugrid-default
      podPriorityClassName: taugrid-default
      explain: "Uses one 8xH200 NVLink node for workloads that specifically need H200-class memory or topology, admitted through the shared GPU queue."
    azure.research.large-memory.2node:
      description: "Large-memory training across 2 H200 NVLink nodes (16 GPUs total via Ray Train + Kueue gang admission)."
      profile: null
      team: research
      lane: large-memory
      mode: fixed
      placement: multi-node-nccl
      shape: 8xh200-141gb
      workers: 2
      gpuClass: h200-141gb
      queue: jobqueue
      clusterQueue: tau-cq
      topologyName: default-node-topology
      namespace: taugrid-default
      resourceFlavor: nd-h200-v5
      workloadPriorityClassName: taugrid-default
      podPriorityClassName: taugrid-default
      explain: "16-GPU multi-node training across two dedicated 8xH200 execution workers plus a CPU-only system head. Each worker requests a full node of nvidia.com/gpu; Kueue admits the workload as a gang through the shared GPU queue. Requires the tau-py SDK (--main-script) — embedded reference trainer is single-node only."
