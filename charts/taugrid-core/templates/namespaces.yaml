{{- if .Values.namespaces.create }}
{{- /*
Single source of namespace creation; deduped via dict keys. Every component
rendering namespaced objects needs an entry, or its install fails at apply time
with `namespaces "<name>" not found` — which names the namespace but not the
component that wanted it. tests/namespaces_test.yaml covers each entry.

A namespace another owner already created is skipped rather than rendered; see
taugrid-core.mayOwnNamespace. Names this chart renders into but never creates —
lifecycleRecorder.targetNamespace, spegel — are deliberately absent; see
values.yaml.
*/ -}}
{{- $ns := dict -}}
{{- if .Values.prewarm.enabled }}{{- $_ := set $ns .Values.prewarm.namespace true }}{{- end }}
{{- if .Values.stellar.enabled }}{{- $_ := set $ns .Values.stellar.namespace true }}{{- end }}
{{- if .Values.portal.enabled }}{{- $_ := set $ns .Values.portal.namespace true }}{{- end }}
{{- if .Values.lifecycleRecorder.enabled }}{{- $_ := set $ns .Values.lifecycleRecorder.namespace true }}{{- end }}
{{- range $name, $_ := $ns }}
{{- if include "taugrid-core.mayOwnNamespace" (dict "name" $name "root" $) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $name }}
  annotations:
    # Namespace deletion cascades to everything inside, including the
    # platform-managed expstore PVC this chart mounts but does not own.
    # `tau cluster uninstall` retains storage.
    helm.sh/resource-policy: keep
  labels:
    {{- include "taugrid-core.labels" $ | nindent 4 }}
    # NORTH-STAR §5.7 row 5: Pod Security Standards at namespace.
    # Baseline (not restricted) because some tau-controller pods may
    # need RunAsUser=0 / hostNetwork for node-local probes; warn at
    # restricted to surface anything that drifts.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
{{- end }}
{{- end }}
{{- end }}
