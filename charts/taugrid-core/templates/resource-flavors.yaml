{{- /*
Generates optional Kueue ResourceFlavors for clusters that want taugrid-core to
own flavor objects. Most clusters manage these through lane manifests/GitOps.
*/ -}}
{{- $resourceFlavors := default dict .Values.resourceFlavors -}}
{{- if (default false $resourceFlavors.enabled) }}
{{- range (default list $resourceFlavors.items) }}
{{- if ne (empty .topologyName) (empty .requiredTopology) }}
{{- fail (printf "resourceFlavors.items[%s] must set topologyName and requiredTopology together" .name) }}
{{- end }}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: {{ required "resourceFlavors.items[].name is required" .name }}
  labels:
    tau.azure.com/component: taugrid-core
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or .annotations .requiredTopology }}
  annotations:
    {{- with (omit (default dict .annotations) "kueue.x-k8s.io/podset-required-topology") }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .requiredTopology }}
    kueue.x-k8s.io/podset-required-topology: {{ . | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- with .nodeLabels }}
  nodeLabels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .nodeTaints }}
  nodeTaints:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .topologyName }}
  topologyName: {{ . }}
  {{- end }}
{{- end }}
{{- end }}
