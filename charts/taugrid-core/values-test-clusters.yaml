stellar:
  enabled: false
  serviceName: tau-stellar
  source: kusto
  discovery:
    allowedProjects: []
    featuredProjects: []
    since: 90d
    maxSince: 365d
    legacyProjectScope: false
  kusto:
    ingestion: remote-write
    project: ""
    since: ""
    targetSince: 365d
    queryCommand: ""
    queryArgs:
      - --endpoint={endpoint}
      - --database={database}
      - --query={query}
  service:
    type: ClusterIP
    annotations: {}
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    port: 80
    targetPort: 8080
  nodeSelector:
    kubernetes.azure.com/mode: system
  resources:
    requests: { cpu: "250m", memory: 512Mi }
    limits: { cpu: "1", memory: 2Gi }
  expstore:
    pvcName: tau-stellar-expstore
