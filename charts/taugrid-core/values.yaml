global:
  adx:
    queryConnection:
      endpoint: ""
      database: ""
      clientID: ""

logging:
  enabled: false
  endpoint: ""
  database: Logs
  cluster: ""

resourceFlavors:
  enabled: false
  items: []

prewarm:
  enabled: true
  nodeSelector:
    kubernetes.azure.com/accelerator: nvidia
  tolerations:
    - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
    - { key: sku, operator: Equal, value: gpu, effect: NoSchedule }
  images:
    - mcr.microsoft.com/aks/ai-runtime/ray:py3.12-ray2.56.0-cuda13.0

spegel:
  enabled: false
  namespace: spegel

stellar:
  enabled: false
  replicaCount: 1
  serviceName: tau-stellar
  storePath: /var/lib/tau/expstore
  workspace: taugrid-default
  defaultTarget: test-cluster-stellar
  source: kusto
  discovery:
    allowedProjects: []
    featuredProjects: []
    since: 90d
    maxSince: 365d
    legacyProjectScope: false
  kusto:
    metricsFile: ""
    project: ""
    endpoint: ""
    database: ""
    ingestion: projection
    since: ""
    targetSince: 365d
    queryCommand: ""
    queryArgs: []
    targetPoints: 12000
  init:
    name: test-cluster-stellar
    project: test-cluster-stellar
    group: system
    idempotencyKey: tau-stellar-expstore-init
  image:
    repository: mcr.microsoft.com/aks/ai-runtime/taugrid-portal
    tag: "0.4.5"
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  deploymentAnnotations: {}
  podLabels: {}
  serviceAccount:
    create: false
    name: ""
    annotations: {}
  extraEnv: []
  extraEnvFrom: []
  extraVolumeMounts: []
  extraVolumes: []
  extraInitContainers: []
  service:
    type: ClusterIP
    annotations: {}
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    port: 80
    targetPort: 8080
  nodeSelector:
    kubernetes.azure.com/mode: system
  tolerations: []
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests: { cpu: "250m", memory: 512Mi }
    limits: { cpu: "1", memory: 2Gi }
  expstore:
    pvcName: ""
  importer:
    enabled: false
    history: []
    run: ""
    project: ""
    question: ""
    group: default
    source: stellar-cluster-importer
    interval: 30s
    ingestTimeout: 2m
    outPath: /var/lib/tau/importer
    completionFile: ""
    extraArgs: []
    extraVolumeMounts: []
    extraVolumes: []

lifecycleRecorder:
  enabled: false
  resourceName: tau-lifecycle-recorder
  targetNamespace: ""
  cluster: ""
  workspaceId: ""
  resultScope: ""
  interval: 30s
  ingestTimeout: 2m
  kusto:
    endpoint: ""
    database: Metrics
    table: TauExpRunLifecycle
  schemaManagement:
    enabled: false
    namespace: adx-mon
    resourceName: taugrid-lifecycle-schema
  image:
    repository: mcr.microsoft.com/aks/ai-runtime/tau
    tag: "0.4.5"
    digest: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  podLabels: {}
  workloadIdentity:
    enabled: false
  serviceAccount:
    create: false
    name: ""
    annotations: {}
  rbac:
    create: false
  extraEnv: []
  extraEnvFrom: []
  nodeSelector:
    kubernetes.azure.com/mode: system
  tolerations: []
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests: { cpu: "100m", memory: 128Mi }
    limits: { cpu: "500m", memory: 512Mi }

portal:
  enabled: false
  resourceName: tau-portal
  replicaCount: 1
  serviceName: tau-portal
  source: kusto
  store: ""
  cluster: ""
  workspace: taugrid-default
  localQueue: ""
  workspaceDirectory:
    enabled: false
    # Allow browser workspace switching without per-user identity only for
    # directory entries whose authorization.mode is cluster-wide and that omit
    # users/groups. Workspace-rbac entries always require trusted identity.
    # Enable only with a Portal image that supports this directory field; the
    # chart omits it while false so older strict JSON decoders remain compatible.
    allowUnauthenticatedClusterWide: false
    localCluster: ""
    endpoints: []
    workspaces: []
    auth:
      userHeader: X-MS-CLIENT-PRINCIPAL-NAME
      groupsHeader: X-MS-CLIENT-PRINCIPAL-GROUPS
  access:
    mode: cluster-internal
    externalURL: ""
  gpuConsumers:
    enabled: false
  entraAuth:
    enabled: false
    tenantID: ""
    clientID: ""
    cookieSecret:
      name: ""
      key: cookie-secret
    gatewayClassName: istio
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
    image:
      repository: ""
      tag: ""
      digest: ""
      pullPolicy: IfNotPresent
    imagePullSecrets: []
    replicaCount: 2
    resources:
      requests: { cpu: "100m", memory: 128Mi }
      limits: { cpu: "500m", memory: 256Mi }
    nodeSelector: {}
    tolerations: []
    affinity: {}
  kusto:
    endpoint: ""
    database: ""
    costDatabase: CostTracking
    ingestion: remote-write
    queryCommand: ""
    queryArgs: []
  runHistory:
    enabled: false
    table: TauExpRunLifecycle
    limit: 200
  workloadNamespace: ""
  jobs:
    namespace: ""
    scopeMode: ""
    operatorScopes: []
  kueueviz:
    enabled: false
    namespace: kueue-system
    backendService: kueue-kueueviz-backend
    frontendService: kueue-kueueviz-frontend
  rbac:
    create: false
  image:
    repository: mcr.microsoft.com/aks/ai-runtime/taugrid-portal
    tag: "0.4.5"
    digest: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  podLabels: {}
  serviceAccount:
    create: false
    name: ""
    annotations: {}
  extraEnv: []
  extraEnvFrom: []
  extraVolumeMounts: []
  extraVolumes: []
  extraInitContainers: []
  service:
    type: ClusterIP
    annotations: {}
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    port: 80
    targetPort: 8080
  nodeSelector: {}
  tolerations: []
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests: { cpu: "250m", memory: 512Mi }
    limits: { cpu: "1", memory: 2Gi }
