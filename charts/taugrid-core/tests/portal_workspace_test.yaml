suite: Portal workspace scope
templates:
  - templates/portal.yaml
tests:
  - it: scopes the embedded Stellar board to the default workspace
    set:
      portal.enabled: true
      portal.image.tag: pinned
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --workspace
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].args
          content: taugrid-default
        documentSelector:
          path: kind
          value: Deployment

  - it: accepts an explicit fixed workspace scope
    set:
      portal.enabled: true
      portal.workspace: research
      portal.localQueue: research-queue
      portal.image.tag: pinned
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: research
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].args
          content: --local-queue
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].args
          content: research-queue
        documentSelector:
          path: kind
          value: Deployment

  - it: renders an explicit public cluster-wide workspace directory
    values:
      - workspace-directory-values.yaml
    set:
      portal.workspaceDirectory.allowUnauthenticatedClusterWide: true
    asserts:
      - matchRegex:
          path: data["workspaces.json"]
          pattern: '"allowUnauthenticatedClusterWide": true'
        documentSelector:
          path: kind
          value: ConfigMap

  - it: preserves the legacy workspace directory JSON shape by default
    values:
      - workspace-directory-values.yaml
    asserts:
      - notMatchRegex:
          path: data["workspaces.json"]
          pattern: '"allowUnauthenticatedClusterWide"'
        documentSelector:
          path: kind
          value: ConfigMap

  - it: uses the typed catalog contract without migration switches
    set:
      portal.enabled: true
      portal.image.tag: pinned
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --kusto-experiment-catalog-read-source
        documentSelector:
          path: kind
          value: Deployment
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --kusto-experiment-catalog-shadow-read
        documentSelector:
          path: kind
          value: Deployment
