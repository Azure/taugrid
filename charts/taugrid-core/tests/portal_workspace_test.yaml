suite: Portal workspace scope
templates:
  - templates/portal.yaml
tests:
  - it: scopes the embedded Stellar board to the default workspace
    set:
      portal.enabled: true
      portal.image.tag: pinned
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --workspace
        documentSelector:
          path: kind
          value: Deployment
      # Must stay the name `tau workspace create` gives a stock install, or the
      # portal scopes its reads to a workspace no run is tagged with. This is
      # spelled out rather than derived because helm-unittest cannot read
      # values, so changing portal.workspace has to change this line too.
      - contains:
          path: spec.template.spec.containers[0].args
          content: taugrid-default
        documentSelector:
          path: kind
          value: Deployment

  - it: accepts an explicit fixed workspace scope
    set:
      portal.enabled: true
      portal.workspace: research
      portal.image.tag: pinned
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: research
        documentSelector:
          path: kind
          value: Deployment

  - it: enables typed experiment catalog shadow reads explicitly
    set:
      portal.enabled: true
      portal.image.tag: pinned
      portal.experimentCatalog.shadowRead.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --kusto-experiment-catalog-shadow-read
        documentSelector:
          path: kind
          value: Deployment

  - it: serves legacy experiment discovery by default
    set:
      portal.enabled: true
      portal.image.tag: pinned
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --kusto-experiment-catalog-read-source
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].args
          content: legacy
        documentSelector:
          path: kind
          value: Deployment

  - it: enables function-backed canonical discovery explicitly
    set:
      portal.enabled: true
      portal.image.tag: pinned
      portal.experimentCatalog.readSource: functions
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: functions
        documentSelector:
          path: kind
          value: Deployment

  - it: rejects an unknown experiment catalog read source
    set:
      portal.enabled: true
      portal.image.tag: pinned
      portal.experimentCatalog.readSource: fallback
    asserts:
      - failedTemplate:
          errorMessage: "portal.experimentCatalog.readSource must be one of: legacy, functions"
