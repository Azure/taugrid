suite: Lifecycle schema readiness RBAC
templates:
  - templates/lifecycle-schema-rbac.yaml
values:
  - lifecycle-recorder-values.yaml
tests:
  - it: gives the recorder only read access to its schema command
    set:
      lifecycleRecorder.schemaManagement.enabled: true
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.name
          value: tau-lifecycle-recorder-schema-read
      - equal:
          path: metadata.namespace
          value: adx-mon
      - equal:
          path: rules[0].resourceNames[0]
          value: taugrid-lifecycle-schema
      - equal:
          path: rules[0].verbs[0]
          value: get
      - equal:
          path: rules[0].verbs[1]
          value: list
      - equal:
          path: rules[0].verbs[2]
          value: watch
