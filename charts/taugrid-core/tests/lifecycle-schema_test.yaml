suite: Lifecycle schema ManagementCommand
templates:
  - templates/lifecycle-schema.yaml
values:
  - lifecycle-recorder-values.yaml
tests:
  - it: creates the lifecycle schema through adx-mon
    set:
      lifecycleRecorder.schemaManagement.enabled: true
    asserts:
      - isKind:
          of: ManagementCommand
      - equal:
          path: apiVersion
          value: adx-mon.azure.com/v1
      - equal:
          path: metadata.namespace
          value: adx-mon
      - equal:
          path: spec.database
          value: Metrics
      - matchRegex:
          path: spec.body
          pattern: "create-merge table TauExpRunLifecycle"
      - matchRegex:
          path: spec.body
          pattern: "TauExpRunLifecycleMapping"
      - matchRegex:
          path: spec.body
          pattern: "TauExpRunLifecycleDashboardRows"

  - it: can place the ManagementCommand in a non-default adx-mon namespace
    set:
      lifecycleRecorder.schemaManagement.enabled: true
      lifecycleRecorder.schemaManagement.namespace: observability
    asserts:
      - equal:
          path: metadata.namespace
          value: observability

  - it: rejects a custom table because the generated schema is canonical
    set:
      lifecycleRecorder.schemaManagement.enabled: true
      lifecycleRecorder.kusto.table: custom_lifecycle
    asserts:
      - failedTemplate:
          errorMessage: lifecycleRecorder.kusto.table must be TauExpRunLifecycle when lifecycleRecorder.schemaManagement.enabled=true

  - it: does not create a ManagementCommand when platform automation owns the schema
    set:
      lifecycleRecorder.schemaManagement.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a custom database because adx-mon only executes commands for its configured database
    set:
      lifecycleRecorder.schemaManagement.enabled: true
      lifecycleRecorder.kusto.database: CustomMetrics
    asserts:
      - failedTemplate:
          errorMessage: lifecycleRecorder.kusto.database must be Metrics when lifecycleRecorder.schemaManagement.enabled=true because adx-mon ManagementCommands run only against its configured database
