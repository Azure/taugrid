suite: Namespace ownership decides by who owns the live namespace
templates:
  - templates/namespaces.yaml
  - templates/lifecycle-recorder.yaml
set:
  prewarm.enabled: false
  stellar.enabled: false
  lifecycleRecorder.enabled: false
  portal.enabled: true
  portal.namespace: ns-portal
  portal.image.tag: test
# `lookup` is answered from this fake cluster, so the branches that only run
# against a live API server are reachable here. kube-system is the always-present
# object taugrid-core.apiReachable probes. Per-test `objects` append to this
# list rather than replacing it, so each case below adds only its own namespace.
kubernetesProvider:
  scheme:
    "v1/Namespace":
      gvr: { version: "v1", resource: "namespaces" }
      namespaced: false
  objects:
    - kind: Namespace
      apiVersion: v1
      metadata: { name: kube-system }
tests:
  - it: creates a namespace that does not exist yet
    templates:
      - templates/namespaces.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: ns-portal

  # The upgrade path. A namespace this release created in an earlier revision
  # carries Helm's ownership metadata, so it must keep rendering — dropping it
  # would freeze its Pod Security Standards labels at whatever the last
  # revision wrote.
  - it: keeps rendering a namespace this release already owns
    templates:
      - templates/namespaces.yaml
    kubernetesProvider:
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata:
            name: ns-portal
            labels:
              app.kubernetes.io/managed-by: Helm
            annotations:
              meta.helm.sh/release-name: RELEASE-NAME
              meta.helm.sh/release-namespace: NAMESPACE
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: ns-portal

  # `kubectl create namespace`, tau-queues, workspace tooling: no Helm metadata
  # at all. This is the case the original issue reproduced — rendering this one
  # is what fails install with `exists and cannot be imported into the current
  # release: invalid ownership metadata`.
  - it: skips a namespace created outside Helm
    templates:
      - templates/namespaces.yaml
    kubernetesProvider:
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata:
            name: ns-portal
            labels:
              kubernetes.io/metadata.name: ns-portal
    asserts:
      - hasDocuments:
          count: 0

  # Differs from an owned namespace only in managed-by, so it holds that clause
  # in place: another tool's namespace can carry Helm's release annotations
  # without Helm having created it, and Helm still refuses to adopt it.
  - it: skips a namespace whose Helm annotations were written by another tool
    templates:
      - templates/namespaces.yaml
    kubernetesProvider:
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata:
            name: ns-portal
            labels:
              app.kubernetes.io/managed-by: kustomize
            annotations:
              meta.helm.sh/release-name: RELEASE-NAME
              meta.helm.sh/release-namespace: NAMESPACE
    asserts:
      - hasDocuments:
          count: 0

  # Differs from an owned namespace only in release-namespace, so it holds that
  # clause in place: two releases can share a name in different namespaces, and
  # only the one in this release's namespace owns it.
  - it: skips a namespace owned by a same-named release in another namespace
    templates:
      - templates/namespaces.yaml
    kubernetesProvider:
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata:
            name: ns-portal
            labels:
              app.kubernetes.io/managed-by: Helm
            annotations:
              meta.helm.sh/release-name: RELEASE-NAME
              meta.helm.sh/release-namespace: some-other-namespace
    asserts:
      - hasDocuments:
          count: 0

  # A release rename leaves the namespace owned by the former release name.
  # Skipping is deliberate: Helm would reject it, and the README documents
  # adopting it explicitly.
  - it: skips a namespace owned by this chart under a former release name
    templates:
      - templates/namespaces.yaml
    release:
      name: taugrid-core
      namespace: tau-system
    kubernetesProvider:
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata:
            name: ns-portal
            labels:
              app.kubernetes.io/managed-by: Helm
            annotations:
              meta.helm.sh/release-name: taugrid-core-legacy
              meta.helm.sh/release-namespace: tau-system
    asserts:
      - hasDocuments:
          count: 0

  # The recorder's Role and RoleBinding render into targetNamespace, which this
  # chart never creates. Without this the install fails later, on the Role,
  # with `namespaces "<name>" not found`.
  - it: refuses to install when the recorder target namespace is absent
    templates:
      - templates/lifecycle-recorder.yaml
    values:
      - lifecycle-recorder-values.yaml
    set:
      portal.enabled: false
      lifecycleRecorder.enabled: true
      lifecycleRecorder.targetNamespace: ns-absent
    asserts:
      - failedTemplate:
          errorMessage: 'lifecycleRecorder.targetNamespace "ns-absent" does not exist. This chart does not create it: it is the workload namespace owned by tau-core-controller (via TauWorkspace) or applications/tau-queues. Create it before installing, or point lifecycleRecorder.targetNamespace at an existing workload namespace.'

  - it: installs the recorder when its target namespace exists
    templates:
      - templates/lifecycle-recorder.yaml
    values:
      - lifecycle-recorder-values.yaml
    set:
      portal.enabled: false
      lifecycleRecorder.enabled: true
      lifecycleRecorder.targetNamespace: ns-workload
    kubernetesProvider:
      objects:
        - kind: Namespace
          apiVersion: v1
          metadata: { name: ns-workload }
    asserts:
      - hasDocuments:
          count: 4
      - documentIndex: 1
        equal:
          path: metadata.namespace
          value: ns-workload
