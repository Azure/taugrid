suite: Namespace creation covers every enabled component
templates:
  - templates/namespaces.yaml
tests:
  # Each component gets a namespace no other component defaults to, so a test
  # cannot pass on a namespace some other enabled component happened to create.
  - it: creates the prewarm namespace
    set:
      prewarm.enabled: true
      prewarm.namespace: ns-prewarm
      stellar.enabled: false
      portal.enabled: false
      lifecycleRecorder.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Namespace
      - equal:
          path: metadata.name
          value: ns-prewarm

  - it: creates the stellar namespace
    set:
      prewarm.enabled: false
      stellar.enabled: true
      stellar.namespace: ns-stellar
      stellar.source: kusto
      stellar.workspace: sample
      stellar.image.tag: test
      stellar.kusto.metricsFile: /tmp/metrics.json
      portal.enabled: false
      lifecycleRecorder.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: ns-stellar

  - it: creates the portal namespace
    set:
      prewarm.enabled: false
      stellar.enabled: false
      portal.enabled: true
      portal.namespace: ns-portal
      portal.image.tag: test
      lifecycleRecorder.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: ns-portal

  - it: creates the lifecycle recorder namespace but not its target namespace
    values:
      - lifecycle-recorder-values.yaml
    set:
      prewarm.enabled: false
      stellar.enabled: false
      portal.enabled: false
      lifecycleRecorder.namespace: ns-recorder
      lifecycleRecorder.targetNamespace: ns-recorder-target
    asserts:
      # The recorder renders a Role and RoleBinding into targetNamespace, but
      # that namespace belongs to tau-core-controller or applications/tau-queues.
      # lifecycle-recorder.yaml refuses to install when it is absent rather than
      # creating it here; only lifecycleRecorder.namespace is this chart's.
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: ns-recorder

  - it: emits one namespace per distinct name when components share one
    set:
      prewarm.enabled: true
      prewarm.namespace: ns-shared
      stellar.enabled: true
      stellar.namespace: ns-shared
      stellar.source: kusto
      stellar.workspace: sample
      stellar.image.tag: test
      stellar.kusto.metricsFile: /tmp/metrics.json
      portal.enabled: true
      portal.namespace: ns-shared
      portal.image.tag: test
      lifecycleRecorder.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: ns-shared

  - it: does not create a namespace for spegel, which this chart does not install
    set:
      prewarm.enabled: false
      stellar.enabled: false
      portal.enabled: false
      lifecycleRecorder.enabled: false
      spegel.enabled: true
      spegel.namespace: ns-spegel
    asserts:
      - hasDocuments:
          count: 0

  - it: creates nothing when namespace creation is turned off for a GitOps owner
    set:
      namespaces.create: false
      prewarm.enabled: true
      prewarm.namespace: ns-prewarm
      portal.enabled: true
      portal.namespace: ns-portal
      portal.image.tag: test
    asserts:
      - hasDocuments:
          count: 0

  - it: labels every created namespace with the Pod Security Standards baseline
    set:
      prewarm.enabled: false
      stellar.enabled: false
      portal.enabled: true
      portal.namespace: ns-portal
      portal.image.tag: test
      lifecycleRecorder.enabled: false
    asserts:
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/enforce"]
          value: baseline
      - equal:
          path: metadata.labels["tau.azure.com/component"]
          value: taugrid-core

  # Namespace deletion cascades to everything inside, including the
  # platform-managed expstore PVC. `tau cluster uninstall` retains storage.
  - it: keeps every created namespace on uninstall
    set:
      prewarm.enabled: true
      prewarm.namespace: ns-prewarm
      stellar.enabled: false
      portal.enabled: true
      portal.namespace: ns-portal
      portal.image.tag: test
      lifecycleRecorder.enabled: false
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
