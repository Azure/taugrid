suite: Lifecycle schema asynchronous startup
templates:
  - templates/lifecycle-recorder.yaml
values:
  - lifecycle-recorder-values.yaml
tests:
  - it: starts without waiting for an adx-mon status condition
    set:
      lifecycleRecorder.schemaManagement.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isNull:
          path: spec.template.spec.initContainers

  - it: keeps the recorder without init containers when schema management is disabled
    set:
      lifecycleRecorder.schemaManagement.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isNull:
          path: spec.template.spec.initContainers
