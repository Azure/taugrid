components:
  kueue:
    enabled: true
  kuberayOperator:
    enabled: true
  tauCoreController:
    enabled: true
  taugridCore:
    enabled: true
  # gpuMonitoring is intentionally absent. Helm evaluates only the first
  # condition path that exists, so while this key is unset the gpu-monitoring
  # subchart follows components.tauCoreController.enabled: a cluster with a Tau
  # control plane always gets GPU node health monitoring. Set it explicitly to
  # decouple them, e.g. --set components.gpuMonitoring.enabled=false.
  #
  # gpuMonitoring:
  #   enabled: true

# Portable baseline queue. These quotas bound concurrent Kueue admission;
# Kubernetes scheduling still enforces the cluster's real capacity.
# Production operators should replace them with deliberate capacity policy.
baselineQueue:
  enabled: true
  name: jobqueue
  namespaceSelector:
    matchExpressions:
      - key: tau.azure.com/workspace
        operator: Exists
  topology:
    enabled: true
    name: default-node-topology
    # Tau copies this ResourceFlavor-owned requirement onto generated GPU pod
    # templates after queue resolution.
    requiredLevel: kubernetes.io/hostname
  flavor:
    # New identity avoids mutating the topologyName of the chart 0.2.0
    # taugrid-default ResourceFlavor, which Kueue treats as immutable.
    name: taugrid-default-cpu
    # The baseline flavor covers CPU and memory only. Keep it free of GPU labels
    # and GPU taint tolerations so CPU-only workloads remain on general-purpose
    # nodes when the cluster also has tainted GPU pools.
    nodeLabels:
      kubernetes.io/os: linux
    tolerations: []
  resources:
    - name: cpu
      nominalQuota: "100000"
    - name: memory
      nominalQuota: 100Ti
  gpu:
    enabled: true
    coveredResources:
      - nvidia.com/gpu
    # CPU, memory, and GPU are node-local resources in one Kueue ResourceGroup.
    # The CPU flavor receives zero GPU quota; each flavor below receives the
    # CPU/memory quotas above plus its declared GPU quota. This makes Kueue
    # assign one flavor across all pod resources without steering CPU-only jobs
    # onto GPU nodes. The default generic flavor supports gpu_class: any. Replace
    # it with class-labeled flavors when hardware is known; do not keep it beside
    # class-specific flavors or specific-class work could consume generic quota.
    # When topology is enabled, a selected GPU flavor is the sole TAS flavor.
    flavors:
      - name: taugrid-default-gpu
        nodeLabels:
          kubernetes.io/os: linux
        nodeTaints:
          - key: sku
            value: gpu
            effect: NoSchedule
        tolerations: []
        resources:
          - name: nvidia.com/gpu
            nominalQuota: "1000"

kueue:
  # TauGrid installs the Kueue MultiKueue capability by default. Operators still
  # own worker credentials, routing objects, and multi-cluster queue policy.
  aksExtension:
    enableMultiKueue: true
  controllerManager:
    manager:
      image:
        repository: mcr.microsoft.com/oss/v2/kueue/kueue
        tag: v0.19.0
        pullPolicy: IfNotPresent
  # Keep the active upstream configuration when replacing this embedded YAML
  # string, and include the AKS DRA device-class mapping used by the published
  # Kueue fork.
  managerConfig:
    controllerManagerConfigYaml: |-
      apiVersion: config.kueue.x-k8s.io/v1beta2
      kind: Configuration
      health:
        healthProbeBindAddress: :8081
      metrics:
        bindAddress: :8443
      webhook:
        port: 9443
      leaderElection:
        leaderElect: true
        resourceName: c1f6bfd2.kueue.x-k8s.io
      controller:
        groupKindConcurrency:
          Job.batch: 5
          Pod: 5
          Workload.kueue.x-k8s.io: 5
          LocalQueue.kueue.x-k8s.io: 1
          ClusterQueue.kueue.x-k8s.io: 1
          ResourceFlavor.kueue.x-k8s.io: 1
      clientConnection:
        qps: 50
        burst: 100
      integrations:
        frameworks:
          - batch/job
          - kubeflow.org/mpijob
          - ray.io/rayjob
          - ray.io/rayservice
          - ray.io/raycluster
          - jobset.x-k8s.io/jobset
          - trainer.kubeflow.org/trainjob
          - kubeflow.org/paddlejob
          - kubeflow.org/pytorchjob
          - kubeflow.org/tfjob
          - kubeflow.org/xgboostjob
          - kubeflow.org/jaxjob
          - workload.codeflare.dev/appwrapper
          - pod
          - deployment
          - statefulset
          - leaderworkerset.x-k8s.io/leaderworkerset
      resources:
        deviceClassMappings:
          - name: gpu.nvidia.com
            deviceClassNames:
              - gpu.nvidia.com

kuberay-operator:
  image:
    repository: mcr.microsoft.com/oss/v2/kuberay/operator
    tag: v1.6.2
    pullPolicy: IfNotPresent
  podAnnotations:
    adx-mon/scrape: "true"
    adx-mon/port: "8080"
  configuration:
    enabled: true
    defaultContainerEnvs:
      - name: RAY_DATA_DISABLE_PROGRESS_BARS
        value: "1"
      - name: RAY_metric_cardinality_level
        value: recommended

# The Tau control plane image is publicly available from MCR. The subchart
# defaults to the release tag matching its chart version.
tau-core-controller:
  image:
    repository: mcr.microsoft.com/aks/ai-runtime/tau-core-controller
    pullPolicy: IfNotPresent
  tauCluster:
    # Inherits the controller chart's reviewed AKS GPU VM-size catalog, which
    # reconciles gpu-class and gpu-series labels from instance-type. Append
    # cluster-specific hardware without replacing that catalog.
    extraNodeLabelRules: []

# Portal is part of the default operator experience. The remaining first-party
# services stay opt-in and all enabled services use release-versioned MCR tags.
taugrid-core:
  prewarm:
    enabled: false
  stellar:
    enabled: false
  portal:
    enabled: true
    serviceAccount:
      create: true
      name: tau-portal
    rbac:
      create: true
  lifecycleRecorder:
    enabled: false
