global:
  adx:
    queryConnection:
      endpoint: ""
      database: ""
      clientID: ""

components:
  kueue:
    enabled: true
  kuberayOperator:
    enabled: true
  tauCoreController:
    enabled: true
  taugridCore:
    enabled: true

baselineQueue:
  enabled: true
  name: jobqueue
  namespaceSelector:
    matchExpressions:
      - key: tau.azure.com/workspace
        operator: Exists
  topology:
    enabled: true
    name: taugrid-gpu-topology
  flavor:
    name: taugrid-default-cpu
    nodeLabels:
      kubernetes.io/os: linux
    tolerations: []
  resources:
    - name: cpu
      nominalQuota: "100000"
    - name: memory
      nominalQuota: 100Ti
  gpu:
    enabled: true
    coveredResources:
      - nvidia.com/gpu
      - tau.azure.com/torchrun-host-slot
    flavors: []

kuberay-operator:
  podAnnotations:
    adx-mon/scrape: "true"
    adx-mon/port: "8080"
  configuration:
    enabled: true
    defaultContainerEnvs:
      - name: RAY_DATA_DISABLE_PROGRESS_BARS
        value: "1"
      - name: RAY_metric_cardinality_level
        value: recommended

tau-core-controller:
  image:
    repository: mcr.microsoft.com/aks/ai-runtime/tau-core-controller
    pullPolicy: IfNotPresent
  tauCluster:
    extraNodeLabelRules: []
taugrid-core:
  prewarm:
    enabled: false
  stellar:
    enabled: false
  portal:
    enabled: true
    entraAuth:
      enabled: false
    serviceAccount:
      create: true
      name: tau-portal
    rbac:
      create: true
  lifecycleRecorder:
    enabled: false
