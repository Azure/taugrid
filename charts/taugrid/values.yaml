global:
  adx:
    queryConnection:
      endpoint: ""
      database: ""
      clientID: ""

components:
  kueue:
    enabled: true
  kuberayOperator:
    enabled: true
  tauCoreController:
    enabled: true
  taugridCore:
    enabled: true

baselineQueue:
  enabled: true
  name: jobqueue
  namespaceSelector:
    matchExpressions:
      - key: tau.azure.com/workspace
        operator: Exists
  topology:
    enabled: true
    name: taugrid-gpu-topology
  flavor:
    name: taugrid-default-cpu
    nodeLabels:
      kubernetes.io/os: linux
    tolerations: []
  resources:
    - name: cpu
      nominalQuota: "100000"
    - name: memory
      nominalQuota: 100Ti
  gpu:
    enabled: true
    coveredResources:
      - nvidia.com/gpu
      - tau.azure.com/torchrun-host-slot
    flavors: []

kueue:
  aksExtension:
    enableMultiKueue: true
  controllerManager:
    manager:
      image:
        repository: mcr.microsoft.com/oss/v2/kueue/kueue
        tag: v0.19.2
        pullPolicy: IfNotPresent
  managerConfig:
    controllerManagerConfigYaml: |-
      apiVersion: config.kueue.x-k8s.io/v1beta2
      kind: Configuration
      health:
        healthProbeBindAddress: :8081
      metrics:
        bindAddress: :8443
      webhook:
        port: 9443
      leaderElection:
        leaderElect: true
        resourceName: c1f6bfd2.kueue.x-k8s.io
      controller:
        groupKindConcurrency:
          Job.batch: 5
          Pod: 5
          Workload.kueue.x-k8s.io: 5
          LocalQueue.kueue.x-k8s.io: 1
          ClusterQueue.kueue.x-k8s.io: 1
          ResourceFlavor.kueue.x-k8s.io: 1
      clientConnection:
        qps: 50
        burst: 100
      integrations:
        frameworks:
          - batch/job
          - kubeflow.org/mpijob
          - ray.io/rayjob
          - ray.io/rayservice
          - ray.io/raycluster
          - jobset.x-k8s.io/jobset
          - trainer.kubeflow.org/trainjob
          - kubeflow.org/paddlejob
          - kubeflow.org/pytorchjob
          - kubeflow.org/tfjob
          - kubeflow.org/xgboostjob
          - kubeflow.org/jaxjob
          - workload.codeflare.dev/appwrapper
          - pod
          - deployment
          - statefulset
          - leaderworkerset.x-k8s.io/leaderworkerset
      resources:
        deviceClassMappings:
          - name: gpu.nvidia.com
            deviceClassNames:
              - gpu.nvidia.com

kuberay-operator:
  image:
    repository: mcr.microsoft.com/oss/v2/kuberay/operator
    tag: v1.6.2
    pullPolicy: IfNotPresent
  podAnnotations:
    adx-mon/scrape: "true"
    adx-mon/port: "8080"
  configuration:
    enabled: true
    defaultContainerEnvs:
      - name: RAY_DATA_DISABLE_PROGRESS_BARS
        value: "1"
      - name: RAY_metric_cardinality_level
        value: recommended

tau-core-controller:
  image:
    repository: mcr.microsoft.com/aks/ai-runtime/tau-core-controller
    pullPolicy: IfNotPresent
  tauCluster:
    extraNodeLabelRules: []
taugrid-core:
  prewarm:
    enabled: false
  stellar:
    enabled: false
  portal:
    enabled: true
    entraAuth:
      enabled: false
    serviceAccount:
      create: true
      name: tau-portal
    rbac:
      create: true
  lifecycleRecorder:
    enabled: false
