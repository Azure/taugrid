suite: TauGrid Kueue Extension Controller contract
templates:
  - authority-validation.yaml
tests:
  - it: rejects installation outside kueue-system
    release:
      namespace: tau-system
    asserts:
      - failedTemplate:
          errorMessage: TauGrid requires installing the release in namespace kueue-system because the bundled Kueue Extension Controller identity is namespace-bound

  - it: rejects disabling the bundled Kueue chart
    release:
      namespace: kueue-system
    set:
      components.kueue.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: TauGrid requires components.kueue.enabled=true because the Kueue Extension Controller is part of the bundled Kueue chart

  - it: rejects disabling KEC object automation
    release:
      namespace: kueue-system
    set:
      kueue.aksExtension.enableKueueObjectsAutomation: false
    asserts:
      - failedTemplate:
          errorMessage: TauGrid requires kueue.aksExtension.enableKueueObjectsAutomation=true; KEC is the sole node and ResourceFlavor authority

  - it: rejects Tau-created ResourceFlavors
    release:
      namespace: kueue-system
    set:
      taugrid-core.resourceFlavors.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: TauGrid requires taugrid-core.resourceFlavors.enabled=false; KEC is the sole ResourceFlavor authority
