suite: Retained external control-plane dependencies
templates:
  - charts/tau-core-controller/templates/deployment.yaml
  - charts/tau-core-controller/templates/taucluster.yaml
  - charts/tau-core-controller/templates/rbac.yaml
  - charts/tau-core-controller/templates/serviceaccount.yaml
  - charts/tau-core-controller/templates/quota-approval-policy.yaml
  - charts/taugrid-core/templates/portal.yaml
values:
  - values/external-control-plane.yaml
release:
  name: existing-portal
  namespace: observability
tests:
  - it: places the controller in the existing system namespace
    template: charts/tau-core-controller/templates/deployment.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: existing-platform
      - contains:
          path: spec.template.spec.containers[0].args
          content: --platform-namespace=existing-platform

  - it: retains the external TauCluster and profile catalog
    template: charts/tau-core-controller/templates/taucluster.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: retains external RBAC
    template: charts/tau-core-controller/templates/rbac.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: retains the external controller ServiceAccount
    template: charts/tau-core-controller/templates/serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: retains both external quota guard objects
    template: charts/tau-core-controller/templates/quota-approval-policy.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: creates only the Portal Deployment with the retained Service selector
    template: charts/taugrid-core/templates/portal.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.namespace
          value: observability
      - equal:
          path: spec.selector.matchLabels
          value:
            app: existing-portal
            app.kubernetes.io/instance: existing-portal
