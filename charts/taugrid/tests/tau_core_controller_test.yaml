suite: Tau control plane subchart wiring
templates:
  - charts/tau-core-controller/templates/deployment.yaml
  - charts/tau-core-controller/templates/taucluster.yaml
tests:
  - it: renders the controller into the platform namespace as part of TauGrid
    template: charts/tau-core-controller/templates/deployment.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: tau-platform
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: taugrid
      - contains:
          path: spec.template.spec.containers[0].args
          content: --platform-namespace=tau-platform
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
      - equal:
          path: spec.template.spec.containers[0].image
          value: mcr.microsoft.com/aks/ai-runtime/tau-core-controller:0.1.2

  - it: accepts a mirrored image so clusters without private ACR access can install
    template: charts/tau-core-controller/templates/deployment.yaml
    set:
      tau-core-controller:
        image:
          repository: my-registry.example.com/tau-core-controller
          digest: ""
          tag: v0.1.0
          pullPolicy: IfNotPresent
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: my-registry.example.com/tau-core-controller:v0.1.0

  - it: ships automatic class and series mappings for reviewed AKS GPU SKUs
    template: charts/tau-core-controller/templates/taucluster.yaml
    asserts:
      - equal:
          path: spec.managementMode
          value: Reconcile
      - lengthEqual:
          path: spec.nodes.labelRules
          count: 4
      - equal:
          path: spec.nodes.labelRules[0].match.vmSizes[0]
          value: Standard_NC24ads_A100_v4
      - equal:
          path: spec.nodes.labelRules[0].labels["kueue.azure.com/gpu-series"]
          value: nc24ads-a100-v4
      - equal:
          path: spec.nodes.labelRules[0].labels["tau.azure.com/gpu-class"]
          value: a100-80gb
      - equal:
          path: spec.nodes.labelRules[3].labels["tau.azure.com/gpu-class"]
          value: h200-141gb
      - equal:
          path: spec.queues.ownership
          value: External
