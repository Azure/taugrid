suite: Tau control plane subchart wiring
templates:
  - charts/tau-core-controller/templates/deployment.yaml
  - charts/tau-core-controller/templates/taucluster.yaml
tests:
  - it: renders the controller into the TauGrid release namespace
    template: charts/tau-core-controller/templates/deployment.yaml
    release:
      namespace: tau-system
    asserts:
      - equal:
          path: metadata.namespace
          value: tau-system
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: taugrid
      - contains:
          path: spec.template.spec.containers[0].args
          content: --platform-namespace=tau-system
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
      - equal:
          path: spec.template.spec.containers[0].image
          value: mcr.microsoft.com/aks/ai-runtime/tau-core-controller:0.3.2

  - it: accepts a mirrored image so clusters without private ACR access can install
    template: charts/tau-core-controller/templates/deployment.yaml
    set:
      tau-core-controller:
        image:
          repository: my-registry.example.com/tau-core-controller
          digest: ""
          tag: v0.1.0
          pullPolicy: IfNotPresent
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: my-registry.example.com/tau-core-controller:v0.1.0

  - it: ships automatic class and series mappings for reviewed AKS GPU SKUs
    template: charts/tau-core-controller/templates/taucluster.yaml
    asserts:
      - equal:
          path: spec.managementMode
          value: Reconcile
      - lengthEqual:
          path: spec.nodes.labelRules
          count: 14
      - equal:
          path: spec.nodes.labelRules[0].match.vmSizes[0]
          value: Standard_NV6ads_A10_v5
      - equal:
          path: spec.nodes.labelRules[0].labels["kueue.azure.com/gpu-series"]
          value: nvads-a10-v5
      - equal:
          path: spec.nodes.labelRules[0].labels["tau.azure.com/gpu-class"]
          value: a10-4gb
      - equal:
          path: spec.nodes.labelRules[13].labels["tau.azure.com/gpu-class"]
          value: gb300-288gb
      - equal:
          path: spec.queues.ownership
          value: External
      - lengthEqual:
          path: spec.workloadProfiles
          count: 15
      - equal:
          path: spec.workloadProfiles[0].executionTarget
          value: singleCluster
