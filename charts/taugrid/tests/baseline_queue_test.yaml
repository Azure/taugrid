suite: TauGrid KEC baseline queue
templates:
  - baseline-queue.yaml
tests:
  - it: references the KEC CPU flavor by default
    asserts:
      - hasDocuments:
          count: 5
      - equal:
          path: kind
          value: ClusterQueue
        documentIndex: 0
      - equal:
          path: metadata.name
          value: jobqueue
        documentIndex: 0
      - equal:
          path: spec.resourceGroups
          value:
            - coveredResources:
                - cpu
                - memory
              flavors:
                - name: aks-cpu
                  resources:
                    - name: cpu
                      nominalQuota: "100000"
                    - name: memory
                      nominalQuota: 100Ti
        documentIndex: 0

  - it: references selected KEC GPU flavors without creating them
    set:
      baselineQueue.gpu.flavors:
        - name: aks-h200-ndisr-v5
          resources:
            - name: nvidia.com/gpu
              nominalQuota: "16"
    asserts:
      - hasDocuments:
          count: 5
      - equal:
          path: spec.resourceGroups[0].coveredResources
          value:
            - cpu
            - memory
            - nvidia.com/gpu
        documentIndex: 0
      - equal:
          path: spec.resourceGroups[0].flavors[0].resources[2]
          value:
            name: nvidia.com/gpu
            nominalQuota: "0"
        documentIndex: 0
      - equal:
          path: spec.resourceGroups[0].flavors[1]
          value:
            name: aks-h200-ndisr-v5
            resources:
              - name: cpu
                nominalQuota: "100000"
              - name: memory
                nominalQuota: 100Ti
              - name: nvidia.com/gpu
                nominalQuota: "16"
        documentIndex: 0

  - it: disables every baseline queue object together
    set:
      baselineQueue.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: applies an operator supplied queue name
    set:
      baselineQueue.name: research
    asserts:
      - equal:
          path: metadata.name
          value: research
        documentIndex: 0

  - it: rejects KEC GPU flavors with incomplete resource quotas
    set:
      baselineQueue.gpu.coveredResources:
        - nvidia.com/gpu
        - gpu.nvidia.com
      baselineQueue.gpu.flavors:
        - name: aks-h200-ndisr-v5
          resources:
            - name: nvidia.com/gpu
              nominalQuota: "16"
    asserts:
      - failedTemplate:
          errorMessage: baselineQueue.gpu.flavors[aks-h200-ndisr-v5].resource names must match baselineQueue.gpu.coveredResources

  - it: rejects duplicate CPU and GPU resource coverage
    set:
      baselineQueue.resources:
        - name: cpu
          nominalQuota: "100000"
        - name: memory
          nominalQuota: 100Ti
        - name: nvidia.com/gpu
          nominalQuota: "1000"
      baselineQueue.gpu.flavors:
        - name: aks-h200-ndisr-v5
          resources:
            - name: nvidia.com/gpu
              nominalQuota: "16"
    asserts:
      - failedTemplate:
          errorMessage: resource nvidia.com/gpu appears in both baselineQueue.resources and baselineQueue.gpu.coveredResources
