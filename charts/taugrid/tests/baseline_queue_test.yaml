suite: TauGrid portable baseline queue
templates:
  - baseline-queue.yaml
tests:
  - it: renders the portable queue contract by default
    asserts:
      - hasDocuments:
          count: 6
      - equal:
          path: kind
          value: ResourceFlavor
        documentIndex: 0
      - equal:
          path: spec.nodeLabels["kubernetes.io/os"]
          value: linux
        documentIndex: 0
      - notExists:
          path: spec.topologyName
        documentIndex: 0
      - equal:
          path: kind
          value: ClusterQueue
        documentIndex: 1
      - equal:
          path: metadata.name
          value: jobqueue
        documentIndex: 1
      - equal:
          path: metadata.labels["tau.azure.com/discover-gpu-flavors"]
          value: "true"
        documentIndex: 1
      - equal:
          path: spec.queueingStrategy
          value: BestEffortFIFO
        documentIndex: 1
      - equal:
          path: spec.preemption.withinClusterQueue
          value: LowerPriority
        documentIndex: 1
      - equal:
          path: spec.namespaceSelector.matchExpressions[0].key
          value: tau.azure.com/workspace
        documentIndex: 1
      - equal:
          path: spec.resourceGroups[0].coveredResources
          value:
            - cpu
            - memory
            - nvidia.com/gpu
        documentIndex: 1
      - equal:
          path: spec.resourceGroups[0].flavors[0].name
          value: taugrid-default-cpu
        documentIndex: 1
      - equal:
          path: spec.resourceGroups[0].flavors[0].resources[2]
          value:
            name: nvidia.com/gpu
            nominalQuota: "0"
        documentIndex: 1
      - equal:
          path: kind
          value: PriorityClass
        documentIndex: 2
      - equal:
          path: metadata.name
          value: taugrid-default
        documentIndex: 2
      - equal:
          path: value
          value: 1000
        documentIndex: 2
      - equal:
          path: preemptionPolicy
          value: PreemptLowerPriority
        documentIndex: 2
      - equal:
          path: metadata.name
          value: taugrid-priority
        documentIndex: 3
      - equal:
          path: value
          value: 1200
        documentIndex: 3
      - equal:
          path: preemptionPolicy
          value: PreemptLowerPriority
        documentIndex: 3
      - equal:
          path: kind
          value: WorkloadPriorityClass
        documentIndex: 4
      - equal:
          path: metadata.name
          value: taugrid-default
        documentIndex: 4
      - equal:
          path: value
          value: 1000
        documentIndex: 4
      - equal:
          path: metadata.name
          value: taugrid-priority
        documentIndex: 5
      - equal:
          path: value
          value: 1200
        documentIndex: 5

  - it: disables every baseline queue object together
    set:
      baselineQueue.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: applies an operator supplied queue name
    set:
      baselineQueue.name: research
    asserts:
      - equal:
          path: metadata.name
          value: research
        documentIndex: 1

  - it: rejects a topology name the controller does not own
    set:
      baselineQueue.topology.name: custom-topology
    asserts:
      - failedTemplate:
          errorMessage: baselineQueue.topology.name is fixed at taugrid-gpu-topology because tau-core-controller owns the Topology

  - it: defers GPU ResourceFlavors to controller discovery by default
    asserts:
      - hasDocuments:
          count: 6
      - lengthEqual:
          path: spec.resourceGroups[0].flavors
          count: 1
        documentIndex: 1

  - it: renders a class-labeled GPU flavor without constraining the CPU flavor
    set:
      baselineQueue.gpu.flavors:
        - name: a100-pool
          nodeLabels:
            kubernetes.io/os: linux
            tau.azure.com/gpu-class: a100-80gb
          nodeTaints:
            - key: sku
              value: gpu
              effect: NoSchedule
          tolerations: []
          resources:
            - name: nvidia.com/gpu
              nominalQuota: "1"
    asserts:
      - notExists:
          path: spec.nodeLabels["tau.azure.com/gpu-class"]
        documentIndex: 0
      - equal:
          path: spec.nodeLabels["tau.azure.com/gpu-class"]
          value: a100-80gb
        documentIndex: 1
      - equal:
          path: spec.topologyName
          value: taugrid-gpu-topology
        documentIndex: 1
      - equal:
          path: spec.resourceGroups[0].coveredResources
          value:
            - cpu
            - memory
            - nvidia.com/gpu
        documentIndex: 2
      - equal:
          path: spec.resourceGroups[0].flavors[1].name
          value: a100-pool
        documentIndex: 2
      - equal:
          path: spec.resourceGroups[0].flavors[1].resources[2]
          value:
            name: nvidia.com/gpu
            nominalQuota: "1"
        documentIndex: 2

  - it: renders a CPU-only resource group when GPU admission is disabled
    set:
      baselineQueue.gpu.enabled: false
      baselineQueue.gpu.coveredResources: []
      baselineQueue.gpu.flavors: []
    asserts:
      - hasDocuments:
          count: 6
      - equal:
          path: kind
          value: ClusterQueue
        documentIndex: 1
      - equal:
          path: spec.resourceGroups
          value:
            - coveredResources:
                - cpu
                - memory
              flavors:
                - name: taugrid-default-cpu
                  resources:
                    - name: cpu
                      nominalQuota: "100000"
                    - name: memory
                      nominalQuota: 100Ti
        documentIndex: 1
      - notExists:
          path: metadata.labels["tau.azure.com/discover-gpu-flavors"]
        documentIndex: 1

  - it: disables controller discovery when topology is disabled
    set:
      baselineQueue.topology.enabled: false
    asserts:
      - notExists:
          path: metadata.labels["tau.azure.com/discover-gpu-flavors"]
        documentIndex: 1

  - it: disables controller discovery when the controller is disabled
    set:
      components.tauCoreController.enabled: false
    asserts:
      - notExists:
          path: metadata.labels["tau.azure.com/discover-gpu-flavors"]
        documentIndex: 1

  - it: rejects GPU resources in the CPU and memory resource list
    set:
      baselineQueue.resources:
        - name: cpu
          nominalQuota: "100000"
        - name: memory
          nominalQuota: 100Ti
        - name: nvidia.com/gpu
          nominalQuota: "1000"
    asserts:
      - failedTemplate:
          errorMessage: resource nvidia.com/gpu appears in both baselineQueue.resources and baselineQueue.gpu.coveredResources; GPU resources belong only in baselineQueue.gpu.coveredResources

  - it: rejects a GPU class label on the CPU flavor
    set:
      baselineQueue.flavor.nodeLabels:
        kubernetes.io/os: linux
        tau.azure.com/gpu-class: a100-80gb
    asserts:
      - failedTemplate:
          errorMessage: baselineQueue.flavor is the CPU/memory flavor and must not set GPU placement labels; configure GPU placement through baselineQueue.gpu.flavors

  - it: rejects a GPU series label on the CPU flavor
    set:
      baselineQueue.flavor.nodeLabels:
        kubernetes.io/os: linux
        kueue.azure.com/gpu-series: ndm-a100-v4
    asserts:
      - failedTemplate:
          errorMessage: baselineQueue.flavor is the CPU/memory flavor and must not set GPU placement labels; configure GPU placement through baselineQueue.gpu.flavors

  - it: rejects a GPU taint toleration on the CPU flavor
    set:
      baselineQueue.flavor.tolerations:
        - key: sku
          operator: Equal
          value: gpu
          effect: NoSchedule
    asserts:
      - failedTemplate:
          errorMessage: baselineQueue.flavor is the CPU/memory flavor and must not tolerate GPU node taints; configure GPU tolerations through baselineQueue.gpu.flavors

  - it: rejects an Exists GPU toleration on the CPU flavor
    set:
      baselineQueue.flavor.tolerations:
        - key: sku
          operator: Exists
          effect: NoSchedule
    asserts:
      - failedTemplate:
          errorMessage: baselineQueue.flavor is the CPU/memory flavor and must not tolerate GPU node taints; configure GPU tolerations through baselineQueue.gpu.flavors

  - it: rejects a wildcard toleration on the CPU flavor
    set:
      baselineQueue.flavor.tolerations:
        - key: ""
          operator: Exists
          effect: NoSchedule
    asserts:
      - failedTemplate:
          errorMessage: baselineQueue.flavor is the CPU/memory flavor and must not tolerate GPU node taints; configure GPU tolerations through baselineQueue.gpu.flavors

  - it: rejects GPU flavor resources that differ from coveredResources
    set:
      baselineQueue.gpu.flavors:
        - name: malformed-gpu
          nodeLabels:
            kubernetes.io/os: linux
          nodeTaints:
            - key: sku
              value: gpu
              effect: NoSchedule
          tolerations: []
          resources:
            - name: gpu.nvidia.com
              nominalQuota: "1"
    asserts:
      - failedTemplate:
          errorMessage: baselineQueue.gpu.flavors[malformed-gpu].resource names must match baselineQueue.gpu.coveredResources

  - it: accepts topology-capable GPU flavors without optional labels or tolerations
    set:
      baselineQueue.gpu.flavors:
        - name: resource-only-gpu
          nodeTaints:
            - key: sku
              value: gpu
              effect: NoSchedule
          resources:
            - name: nvidia.com/gpu
              nominalQuota: "1"
    asserts:
      - notExists:
          path: spec.nodeLabels
        documentIndex: 1
      - equal:
          path: spec.topologyName
          value: taugrid-gpu-topology
        documentIndex: 1
      - notExists:
          path: spec.tolerations
        documentIndex: 1

  - it: accepts GPU flavor resources in a different order
    set:
      baselineQueue.gpu.coveredResources:
        - nvidia.com/gpu
        - gpu.nvidia.com
      baselineQueue.gpu.flavors:
        - name: dual-mode-gpu
          nodeLabels: {}
          nodeTaints:
            - key: sku
              value: gpu
              effect: NoSchedule
          tolerations: []
          resources:
            - name: gpu.nvidia.com
              nominalQuota: "1"
            - name: nvidia.com/gpu
              nominalQuota: "1"
    asserts:
      - equal:
          path: spec.resourceGroups[0].flavors[1].name
          value: dual-mode-gpu
        documentIndex: 2

  - it: rejects a flavor toleration that bypasses its GPU admission taint
    set:
      baselineQueue.gpu.flavors:
        - name: unsafe-gpu
          nodeLabels:
            kubernetes.io/os: linux
          nodeTaints:
            - key: sku
              value: gpu
              effect: NoSchedule
          tolerations:
            - key: sku
              operator: Equal
              value: gpu
              effect: NoSchedule
          resources:
            - name: nvidia.com/gpu
              nominalQuota: "1"
    asserts:
      - failedTemplate:
          errorMessage: baselineQueue.gpu.flavors[unsafe-gpu] toleration for nodeTaint sku would make GPU quota eligible for CPU-only workloads; Tau GPU pods already carry GPU-node tolerations
