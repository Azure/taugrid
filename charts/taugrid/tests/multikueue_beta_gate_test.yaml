suite: MultiKueue Beta distribution gate
templates:
  - beta-feature-gates.yaml
  - baseline-queue.yaml
  - charts/kueue/templates/manager/manager-config.yaml
  - charts/kueue/templates/manager/manager.yaml
  - charts/kueue/templates/crd/kueue.x-k8s.io_multikueueclusters.yaml
  - charts/kueue/templates/crd/kueue.x-k8s.io_multikueueconfigs.yaml
  - charts/kueue/templates/rbac/manager_clusterprofiles_role.yaml
  - charts/kueue/templates/rbac/manager_clusterprofiles_role_binding.yaml
  - charts/kueue/templates/rbac/role.yaml
  - charts/tau-core-controller/templates/deployment.yaml
  - charts/tau-core-controller/templates/rbac.yaml
tests:
  - it: keeps the Kueue MultiKueue controller disabled by default
    template: charts/kueue/templates/manager/manager.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --feature-gates=MultiKueue=false

  - it: renders no MultiKueueCluster CRD by default
    template: charts/kueue/templates/crd/kueue.x-k8s.io_multikueueclusters.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no MultiKueueConfig CRD by default
    template: charts/kueue/templates/crd/kueue.x-k8s.io_multikueueconfigs.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no ClusterProfile compatibility RBAC by default
    template: charts/kueue/templates/rbac/manager_clusterprofiles_role.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps the normal baseline queue single-cluster
    template: baseline-queue.yaml
    documentIndex: 2
    asserts:
      - notExists:
          path: spec.admissionChecks

  - it: rejects feature enablement without risk acknowledgement
    template: charts/kueue/templates/rbac/role.yaml
    set:
      global.betaFeatures:
        - multikueue
    asserts:
      - failedTemplate:
          errorMessage: MultiKueue Beta requires both global.betaFeatures=[multikueue] and global.betaRiskAcknowledgements=[multikueue]; enabling only one is not permitted

  - it: rejects risk acknowledgement without feature enablement
    template: charts/kueue/templates/rbac/role.yaml
    set:
      global.betaRiskAcknowledgements:
        - multikueue
    asserts:
      - failedTemplate:
          errorMessage: MultiKueue Beta requires both global.betaFeatures=[multikueue] and global.betaRiskAcknowledgements=[multikueue]; enabling only one is not permitted

  - it: rejects the raw AKS Kueue toggle without both gates
    template: charts/kueue/templates/rbac/role.yaml
    set:
      kueue.aksExtension.enableMultiKueue: true
    asserts:
      - failedTemplate:
          errorMessage: MultiKueue configuration was supplied without the required Beta gate; set both global.betaFeatures=[multikueue] and global.betaRiskAcknowledgements=[multikueue]

  - it: rejects raw Kueue feature gates without both gates
    template: charts/kueue/templates/rbac/role.yaml
    set:
      kueue.controllerManager.featureGates:
        - name: MultiKueue
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: MultiKueue configuration was supplied without the required Beta gate; set both global.betaFeatures=[multikueue] and global.betaRiskAcknowledgements=[multikueue]

  - it: rejects custom queue settings without both gates
    template: beta-feature-gates.yaml
    set:
      customQueues.beta.admissionCheckController: kueue.x-k8s.io/multikueue
    asserts:
      - failedTemplate:
          errorMessage: MultiKueue configuration was supplied without the required Beta gate; set both global.betaFeatures=[multikueue] and global.betaRiskAcknowledgements=[multikueue]

  - it: rejects a custom MultiKueue profile without both gates
    template: beta-feature-gates.yaml
    set:
      tau-core-controller.tauCluster.workloadProfiles:
        - name: site.multikueue
          applicability:
            teams: [research]
            lanes: [training]
            namespaces: [research-workloads]
          gpusPerWorker: 1
          workerCount: 1
          mode: fixed
          placement: independent
          defaultLocalQueue: multikueue-jobqueue
          executionTarget: multiKueueBeta
          priorities:
            workloadPriorityClassName: taugrid-default
            podPriorityClassName: taugrid-default
    asserts:
      - failedTemplate:
          errorMessage: MultiKueue configuration was supplied without the required Beta gate; set both global.betaFeatures=[multikueue] and global.betaRiskAcknowledgements=[multikueue]

  - it: rejects approvals that omit the reviewed Kueue activation
    template: beta-feature-gates.yaml
    set:
      global.betaFeatures:
        - multikueue
      global.betaRiskAcknowledgements:
        - multikueue
    asserts:
      - failedTemplate:
          errorMessage: MultiKueue Beta approvals are set but the pinned Kueue controller is not enabled; use charts/taugrid/values-multikueue-beta.yaml rather than raw subchart values

  - it: enables the pinned Kueue controller only when fully acknowledged
    template: charts/kueue/templates/manager/manager.yaml
    set:
      global.betaFeatures:
        - multikueue
      global.betaRiskAcknowledgements:
        - multikueue
      kueue.aksExtension.enableMultiKueue: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --feature-gates=MultiKueue=true

  - it: enables the Tau runtime gate only when fully acknowledged
    template: charts/tau-core-controller/templates/deployment.yaml
    set:
      global.betaFeatures:
        - multikueue
      global.betaRiskAcknowledgements:
        - multikueue
      kueue.aksExtension.enableMultiKueue: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --beta-feature-gates=multikueue

  - it: renders MultiKueue CRDs only when fully acknowledged
    template: charts/kueue/templates/crd/kueue.x-k8s.io_multikueueclusters.yaml
    set:
      global.betaFeatures:
        - multikueue
      global.betaRiskAcknowledgements:
        - multikueue
      kueue.aksExtension.enableMultiKueue: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: multikueueclusters.kueue.x-k8s.io

  - it: renders isolated ClusterProfile compatibility RBAC only when fully acknowledged
    template: charts/kueue/templates/rbac/manager_clusterprofiles_role.yaml
    set:
      global.betaFeatures:
        - multikueue
      global.betaRiskAcknowledgements:
        - multikueue
      kueue.aksExtension.enableMultiKueue: true
    asserts:
      - hasDocuments:
          count: 1
