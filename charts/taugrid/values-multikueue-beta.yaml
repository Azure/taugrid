# MultiKueue is Beta while TauGrid remains Alpha overall. This reviewed values
# file activates only manager-side controllers and read-only readiness checks.
# Operators must provision worker credentials, MultiKueueCluster objects,
# MultiKueueConfig objects, AdmissionChecks, and isolated queue/profile wiring.
# Operator authorization remains a separate step: set
# tau-core-controller.tauCluster.features.multiKueue=Beta only after those
# prerequisites exist.
global:
  betaFeatures:
    - multikueue
  betaRiskAcknowledgements:
    - multikueue

kueue:
  aksExtension:
    enableMultiKueue: true
