{{- if ne .Release.Namespace "kueue-system" -}}
{{- fail "TauGrid requires installing the release in namespace kueue-system because the bundled Kueue Extension Controller identity is namespace-bound" -}}
{{- end -}}
{{- if not .Values.components.kueue.enabled -}}
{{- fail "TauGrid requires components.kueue.enabled=true because the Kueue Extension Controller is part of the bundled Kueue chart" -}}
{{- end -}}
{{- if not .Values.kueue.aksExtension.enableKueueObjectsAutomation -}}
{{- fail "TauGrid requires kueue.aksExtension.enableKueueObjectsAutomation=true; KEC is the sole node and ResourceFlavor authority" -}}
{{- end -}}
{{- $taugridCore := default dict (index .Values "taugrid-core") -}}
{{- $resourceFlavors := default dict (index $taugridCore "resourceFlavors") -}}
{{- if (default false (index $resourceFlavors "enabled")) -}}
{{- fail "TauGrid requires taugrid-core.resourceFlavors.enabled=false; KEC is the sole ResourceFlavor authority" -}}
{{- end -}}
