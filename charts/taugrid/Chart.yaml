apiVersion: v2
name: taugrid
description: Kubernetes-native TauGrid distribution for fresh AKS clusters.
type: application
version: 0.4.6
appVersion: "0.4.6"
kubeVersion: ">=1.30.0-0"
keywords:
  - taugrid
  - aks
  - kueue
  - kuberay
dependencies:
  - name: kueue
    version: 0.19.6
    repository: oci://mcr.microsoft.com/aks/ai-runtime/helm
    condition: components.kueue.enabled
  - name: kuberay-operator
    version: 1.6.2
    repository: oci://mcr.microsoft.com/aks/ai-runtime/helm
    condition: components.kuberayOperator.enabled
  - name: tau-core-controller
    version: 0.4.6
    repository: oci://mcr.microsoft.com/aks/ai-runtime/helm
    condition: components.tauCoreController.enabled
  - name: taugrid-core
    version: 0.4.6
    repository: oci://mcr.microsoft.com/aks/ai-runtime/helm
    condition: components.taugridCore.enabled
  - name: gpu-monitoring
    version: 0.1.9
    repository: oci://mcr.microsoft.com/aks/ai-runtime/helm
    condition: components.gpuMonitoring.enabled,components.tauCoreController.enabled
