        lanes:
        - training
        namespaces:
        - taugrid-default
        teams:
        - research
      defaultLocalQueue: jobqueue
      description: Shared GPU training on one GPU.
      executionTarget: singleCluster
      gpusPerWorker: 1
      mode: fixed
      name: azure.research.training.l
      placement: independent
      priorities:
        podPriorityClassName: taugrid-default
        workloadPriorityClassName: taugrid-default
      workerCount: 1
