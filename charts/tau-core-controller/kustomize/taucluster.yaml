apiVersion: tau.azure.com/v1alpha1
kind: TauCluster
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: tau-core-controller
    app.kubernetes.io/part-of: taugrid
spec:
  # Keep this concrete Kustomize desired state aligned with values.yaml. Argo CD
  # overlays can patch the rule list when they introduce another ResourceFlavor.
  managementMode: Reconcile
  deletionPolicy: Retain
  features:
    multiKueue: Disabled
  nodes:
    labelRules:
      - match:
          vmSizes:
            - Standard_NV6ads_A10_v5
        labels:
          kueue.azure.com/gpu-series: nvads-a10-v5
          tau.azure.com/gpu-class: a10-4gb
      - match:
          vmSizes:
            - Standard_NV12ads_A10_v5
