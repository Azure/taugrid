partOf: taugrid

image:
  repository: mcr.microsoft.com/aks/ai-runtime/tau-core-controller
  digest: ""
  tag: "0.4.4"
  pullPolicy: IfNotPresent

# Optional operator-owned quota hierarchy. These resources are deliberately
# empty by default so upgrades preserve the legacy taugrid-default workspace
# and externally managed jobqueue until an operator opts into multi-workspace
# quota management.
teams: []
# - name: vision
#   spec:
#     quota:
#       - flavor: taugrid-gpu-h200-141gb
#         resource: nvidia.com/gpu
#         nominalQuota: "32"

workspaces: []
# - name: vision-training
#   spec:
#     teamRef:
#       name: vision
#     target:
#       namespace: vision-training
#       createNamespace: true
#     queue: default
#     quota:
#       - flavor: taugrid-gpu-h200-141gb
#         resource: nvidia.com/gpu
#         nominalQuota: "8"
#         borrowingLimit: "4"
#         lendingLimit: "0"
#     authorization:
#       mode: cluster-wide

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

tauCluster:
  managementMode: Reconcile
  deletionPolicy: Retain
  nodeLabelRules:
    - match:
        vmSizes:
          - Standard_NV6ads_A10_v5
      labels:
        kueue.azure.com/gpu-series: nvads-a10-v5
        tau.azure.com/gpu-class: a10-4gb
    - match:
        vmSizes:
          - Standard_NV12ads_A10_v5
      labels:
        kueue.azure.com/gpu-series: nvads-a10-v5
        tau.azure.com/gpu-class: a10-8gb
    - match:
        vmSizes:
          - Standard_NV18ads_A10_v5
      labels:
        kueue.azure.com/gpu-series: nvads-a10-v5
        tau.azure.com/gpu-class: a10-12gb
    - match:
        vmSizes:
          - Standard_NV36ads_A10_v5
          - Standard_NV36adms_A10_v5
          - Standard_NV72ads_A10_v5
      labels:
        kueue.azure.com/gpu-series: nvads-a10-v5
        tau.azure.com/gpu-class: a10-24gb
    - match:
        vmSizes:
          - Standard_NC24ads_A100_v4
      labels:
        kueue.azure.com/gpu-series: nc24ads-a100-v4
        tau.azure.com/gpu-class: a100-80gb
    - match:
        vmSizes:
          - Standard_NC48ads_A100_v4
          - Standard_NC96ads_A100_v4
      labels:
        kueue.azure.com/gpu-series: nc-a100-v4
        tau.azure.com/gpu-class: a100-80gb
    - match:
        vmSizes:
          - Standard_ND96asr_v4
      labels:
        kueue.azure.com/gpu-series: nd-a100-v4
        tau.azure.com/gpu-class: a100-40gb
    - match:
        vmSizes:
          - Standard_ND96amsr_A100_v4
      labels:
        kueue.azure.com/gpu-series: ndm-a100-v4
        tau.azure.com/gpu-class: a100-80gb
    - match:
        vmSizes:
          - Standard_NC40ads_H100_v5
          - Standard_NC80adis_H100_v5
      labels:
        kueue.azure.com/gpu-series: nc-h100-v5
        tau.azure.com/gpu-class: h100-95gb
    - match:
        vmSizes:
          - Standard_NCC40ads_H100_v5
      labels:
        kueue.azure.com/gpu-series: ncc-h100-v5
        tau.azure.com/gpu-class: h100-95gb
    - match:
        vmSizes:
          - Standard_ND96isr_H100_v5
      labels:
        kueue.azure.com/gpu-series: nd-h100-v5
        tau.azure.com/gpu-class: h100-80gb
    - match:
        vmSizes:
          - Standard_ND96isr_H200_v5
      labels:
        kueue.azure.com/gpu-series: nd-h200-v5
        tau.azure.com/gpu-class: h200-141gb
    - match:
        vmSizes:
          - Standard_ND96isr_GB200_v6
          - Standard_ND128isr_NDR_GB200_v6
      labels:
        kueue.azure.com/gpu-series: nd-gb200-v6
        tau.azure.com/gpu-class: gb200-192gb
    - match:
        vmSizes:
          - Standard_ND128isr_GB300_v6
          - Standard_ND128isrG5_GB300_v6
      labels:
        kueue.azure.com/gpu-series: nd-gb300-v6
        tau.azure.com/gpu-class: gb300-288gb
  extraNodeLabelRules: []
  queues:
    ownership: External
  defaultWorkloadProfileNamespace: taugrid-default
  workloadProfiles:
    - name: azure.workspace.cpu
      description: CPU-only workspace jobs without GPUs.
      applicability:
        namespaces: ["{{ .Values.tauCluster.defaultWorkloadProfileNamespace }}"]
      gpusPerWorker: 0
      workerCount: 1
      mode: fixed
      placement: unconstrained
      defaultLocalQueue: jobqueue
      executionTarget: singleCluster
      priorities:
        disableDefaultPriorities: true
    - name: azure.research.training.l
      description: Shared GPU training on one GPU.
      applicability:
        teams: [research]
        lanes: [training]
        namespaces: ["{{ .Values.tauCluster.defaultWorkloadProfileNamespace }}"]
      gpusPerWorker: 1
      workerCount: 1
      mode: fixed
      placement: unconstrained
      defaultLocalQueue: jobqueue
      executionTarget: singleCluster
      priorities:
        workloadPriorityClassName: taugrid-default
        podPriorityClassName: taugrid-default
    - name: azure.research.training.2x
      description: Shared GPU training on two GPUs.
      applicability:
        teams: [research]
        lanes: [training]
        namespaces: ["{{ .Values.tauCluster.defaultWorkloadProfileNamespace }}"]
      gpusPerWorker: 2
      workerCount: 1
      mode: fixed
      placement: unconstrained
      defaultLocalQueue: jobqueue
      executionTarget: singleCluster
      priorities:
        workloadPriorityClassName: taugrid-default
        podPriorityClassName: taugrid-default
