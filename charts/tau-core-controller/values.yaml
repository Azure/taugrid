# app.kubernetes.io/part-of for every rendered object. The TauGrid distribution
# leaves this as taugrid; GitOps paths rendering the literal manifests under
# kustomize/ should keep the same value.
partOf: taugrid

# The controller image is publicly available from MCR. Override the repository,
# tag, or digest only to run a mirrored or pre-release build.
image:
  repository: mcr.microsoft.com/aks/ai-runtime/tau-core-controller
  # Release image tags follow this chart's version. Set tag to "" when
  # overriding digest with an immutable sha256 reference.
  digest: ""
  tag: "0.4.3"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

tauCluster:
  managementMode: Reconcile
  deletionPolicy: Retain
  queues:
    ownership: External
  # Namespace authorized by the built-in workload profile catalog. Set this
  # when one workspace namespace is provisioned outside the sample default.
  defaultWorkloadProfileNamespace: taugrid-default
  # Canonical default workload-profile catalog. This list is the hand-authored
  # source used by both Helm and the checked-in GitOps/sample TauCluster
  # manifests. Helm list replacement is intentional: platform owners can replace
  # the complete catalog with site-specific profiles using this value.
  #
  # Keep MultiKueue profiles out of this default. Operators append site-specific
  # multiKueue profiles only after provisioning routing and credentials.
  workloadProfiles:
    - name: azure.research.training.l
      description: Shared GPU training on one GPU.
      applicability:
        teams: [research]
        lanes: [training]
        namespaces: ["{{ .Values.tauCluster.defaultWorkloadProfileNamespace }}"]
      gpusPerWorker: 1
      workerCount: 1
      mode: fixed
      placement: independent
      defaultLocalQueue: jobqueue
      executionTarget: singleCluster
      priorities:
        workloadPriorityClassName: taugrid-default
        podPriorityClassName: taugrid-default
    - name: azure.research.training.2x
      description: Shared GPU training on two GPUs.
      applicability:
        teams: [research]
        lanes: [training]
        namespaces: ["{{ .Values.tauCluster.defaultWorkloadProfileNamespace }}"]
      gpusPerWorker: 2
      workerCount: 1
      mode: fixed
      placement: independent
      defaultLocalQueue: jobqueue
      executionTarget: singleCluster
      priorities:
        workloadPriorityClassName: taugrid-default
        podPriorityClassName: taugrid-default
    - name: azure.research.training.4x
      description: Shared GPU training on four GPUs.
      applicability:
        teams: [research]
        lanes: [training]
        namespaces: ["{{ .Values.tauCluster.defaultWorkloadProfileNamespace }}"]
      gpusPerWorker: 4
      workerCount: 1
      mode: fixed
      placement: independent
      defaultLocalQueue: jobqueue
      executionTarget: singleCluster
      priorities:
        workloadPriorityClassName: taugrid-default
        podPriorityClassName: taugrid-default
    - name: azure.research.training.xl
      description: Shared GPU training on eight GPUs.
      applicability:
        teams: [research]
        lanes: [training]
        namespaces: ["{{ .Values.tauCluster.defaultWorkloadProfileNamespace }}"]
      gpusPerWorker: 8
      workerCount: 1
      mode: fixed
      placement: independent
      defaultLocalQueue: jobqueue
      executionTarget: singleCluster
      priorities:
        workloadPriorityClassName: taugrid-default
        podPriorityClassName: taugrid-default
    - name: azure.research.eval.gpu
      description: Shared GPU evaluation on one GPU.
      applicability:
        teams: [research]
        lanes: [eval]
        namespaces: ["{{ .Values.tauCluster.defaultWorkloadProfileNamespace }}"]
      gpusPerWorker: 1
      workerCount: 1
      mode: fixed
      placement: independent
      defaultLocalQueue: jobqueue
      executionTarget: singleCluster
      priorities:
        workloadPriorityClassName: taugrid-default
        podPriorityClassName: taugrid-default
    - name: azure.research.elastic.gpu
      description: Shared checkpointable backfill on one GPU.
      applicability:
        teams: [research]
        lanes: [elastic]
        namespaces: ["{{ .Values.tauCluster.defaultWorkloadProfileNamespace }}"]
      gpusPerWorker: 1
      workerCount: 1
      mode: elastic
      placement: independent
      defaultLocalQueue: jobqueue
