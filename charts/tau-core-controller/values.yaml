# Namespace that owns the controller, its RBAC, and every TauWorkspace object.
# It is also passed to the binary as --platform-namespace.
platformNamespace: tau-platform

# app.kubernetes.io/part-of for every rendered object. The TauGrid distribution
# leaves this as taugrid; GitOps paths rendering the literal manifests under
# kustomize/ should keep the same value.
partOf: taugrid

# The controller image is publicly available from MCR. Override the repository,
# tag, or digest only to run a mirrored or pre-release build.
image:
  repository: mcr.microsoft.com/aks/ai-runtime/tau-core-controller
  # Release image tags follow this chart's version. Set tag to "" when
  # overriding digest with an immutable sha256 reference.
  digest: ""
  tag: "0.3.0"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

tauCluster:
  managementMode: Reconcile
  deletionPolicy: Retain
  # Tau owns these derived labels. AKS supplies node.kubernetes.io/instance-type;
  # the controller continuously reconciles the stable researcher class and the
  # platform series on matching current and future nodes. CPU-only clusters and
  # GPU pools scaled to zero remain ready when none of these rules match.
  nodeLabelRules:
    - match:
        vmSizes:
          - Standard_NV6ads_A10_v5
      labels:
        kueue.azure.com/gpu-series: nvads-a10-v5
        tau.azure.com/gpu-class: a10-4gb
    - match:
        vmSizes:
          - Standard_NV12ads_A10_v5
      labels:
        kueue.azure.com/gpu-series: nvads-a10-v5
        tau.azure.com/gpu-class: a10-8gb
    - match:
        vmSizes:
          - Standard_NV18ads_A10_v5
      labels:
        kueue.azure.com/gpu-series: nvads-a10-v5
        tau.azure.com/gpu-class: a10-12gb
    - match:
        vmSizes:
          - Standard_NV36ads_A10_v5
          - Standard_NV36adms_A10_v5
          - Standard_NV72ads_A10_v5
      labels:
        kueue.azure.com/gpu-series: nvads-a10-v5
        tau.azure.com/gpu-class: a10-24gb
    - match:
        vmSizes:
          - Standard_NC24ads_A100_v4
      labels:
        kueue.azure.com/gpu-series: nc24ads-a100-v4
        tau.azure.com/gpu-class: a100-80gb
    - match:
        vmSizes:
          - Standard_NC48ads_A100_v4
          - Standard_NC96ads_A100_v4
      labels:
        kueue.azure.com/gpu-series: nc-a100-v4
        tau.azure.com/gpu-class: a100-80gb
    - match:
        vmSizes:
          - Standard_ND96asr_v4
      labels:
        kueue.azure.com/gpu-series: nd-a100-v4
        tau.azure.com/gpu-class: a100-40gb
    - match:
        vmSizes:
          - Standard_ND96amsr_A100_v4
      labels:
        kueue.azure.com/gpu-series: ndm-a100-v4
        tau.azure.com/gpu-class: a100-80gb
    - match:
        vmSizes:
          - Standard_NC40ads_H100_v5
          - Standard_NC80adis_H100_v5
      labels:
        kueue.azure.com/gpu-series: nc-h100-v5
        tau.azure.com/gpu-class: h100-95gb
    - match:
        vmSizes:
          - Standard_NCC40ads_H100_v5
      labels:
        kueue.azure.com/gpu-series: ncc-h100-v5
        tau.azure.com/gpu-class: h100-95gb
    - match:
        vmSizes:
          - Standard_ND96isr_H100_v5
      labels:
        kueue.azure.com/gpu-series: nd-h100-v5
        tau.azure.com/gpu-class: h100-80gb
    - match:
        vmSizes:
          - Standard_ND96isr_H200_v5
      labels:
        kueue.azure.com/gpu-series: nd-h200-v5
        tau.azure.com/gpu-class: h200-141gb
    - match:
        vmSizes:
          - Standard_ND96isr_GB200_v6
          - Standard_ND128isr_NDR_GB200_v6
      labels:
        kueue.azure.com/gpu-series: nd-gb200-v6
        tau.azure.com/gpu-class: gb200-192gb
    - match:
        vmSizes:
          - Standard_ND128isr_GB300_v6
          - Standard_ND128isrG5_GB300_v6
      labels:
        kueue.azure.com/gpu-series: nd-gb300-v6
        tau.azure.com/gpu-class: gb300-288gb
  # Helm replaces lists, so setting nodeLabelRules discards anything a parent
  # chart declared. Use extraNodeLabelRules to append instead.
  extraNodeLabelRules: []
  queues:
    ownership: External
