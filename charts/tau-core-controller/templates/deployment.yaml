apiVersion: apps/v1
kind: Deployment
metadata:
  name: tau-core-controller
  namespace: {{ include "tau-core-controller.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "tau-core-controller.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tau-core-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tau-core-controller.labels" . | nindent 8 }}
    spec:
      serviceAccountName: tau-core-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ include "tau-core-controller.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect
            - --platform-namespace={{ include "tau-core-controller.namespace" . }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
