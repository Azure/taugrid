suite: TauCluster topology reconciliation
templates:
  - taucluster.yaml
tests:
  - it: delegates node classification to KEC
    asserts:
      - equal:
          path: spec.managementMode
          value: Reconcile
      - equal:
          path: spec.deletionPolicy
          value: Retain
      - lengthEqual:
          path: spec.nodes.labelRules
          count: 0
      - equal:
          path: spec.queues.ownership
          value: External
      - lengthEqual:
          path: spec.workloadProfiles
          count: 15
      - equal:
          path: spec.workloadProfiles[0].executionTarget
          value: singleCluster
      - equal:
          path: spec.workloadProfiles[0].applicability.namespaces[0]
          value: taugrid-default

  - it: renders built-in workload profiles for a custom workspace namespace
    set:
      tauCluster.defaultWorkloadProfileNamespace: team-alpha
    asserts:
      - lengthEqual:
          path: spec.workloadProfiles
          count: 15
      - equal:
          path: spec.workloadProfiles[0].applicability.namespaces[0]
          value: team-alpha
      - equal:
          path: spec.workloadProfiles[14].applicability.namespaces[0]
          value: team-alpha

  - it: replaces the complete workload profile catalog for a site
    set:
      tauCluster.workloadProfiles:
        - name: site.training
          applicability:
            teams: [site-team]
            lanes: [training]
            namespaces: [site-workloads]
          gpusPerWorker: 2
          workerCount: 1
          mode: fixed
          placement: independent
          defaultLocalQueue: site-queue
          executionTarget: singleCluster
          priorities:
            workloadPriorityClassName: site-default
            podPriorityClassName: site-default
    asserts:
      - lengthEqual:
          path: spec.workloadProfiles
          count: 1
      - equal:
          path: spec.workloadProfiles[0].name
          value: site.training
