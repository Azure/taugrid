suite: TauCluster topology reconciliation
templates:
  - taucluster.yaml
tests:
  - it: reconciles the reviewed AKS GPU label catalog by default
    asserts:
      - equal:
          path: spec.managementMode
          value: Reconcile
      - equal:
          path: spec.deletionPolicy
          value: Retain
      - lengthEqual:
          path: spec.nodes.labelRules
          count: 4
      - equal:
          path: spec.nodes.labelRules[0].match.vmSizes[0]
          value: Standard_NC24ads_A100_v4
      - equal:
          path: spec.nodes.labelRules[0].labels["kueue.azure.com/gpu-series"]
          value: nc24ads-a100-v4
      - equal:
          path: spec.nodes.labelRules[0].labels["tau.azure.com/gpu-class"]
          value: a100-80gb
      - equal:
          path: spec.nodes.labelRules[2].labels["tau.azure.com/gpu-class"]
          value: h100-95gb
      - equal:
          path: spec.nodes.labelRules[3].labels["kueue.azure.com/gpu-series"]
          value: nd-h200-v5
      - equal:
          path: spec.nodes.labelRules[3].labels["tau.azure.com/gpu-class"]
          value: h200-141gb
      - equal:
          path: spec.queues.ownership
          value: External

  - it: replaces the catalog and appends a platform supplied mapping
    set:
      tauCluster.nodeLabelRules:
        - match:
            vmSizes:
              - Standard_ND96isr_H200_v5
          labels:
            kueue.azure.com/gpu-series: nd-h200-v5
      tauCluster.extraNodeLabelRules:
        - match:
            vmSizes:
              - Standard_NC40ads_H100_v5
          labels:
            kueue.azure.com/gpu-series: nc-h100-v5
    asserts:
      - lengthEqual:
          path: spec.nodes.labelRules
          count: 2
      - equal:
          path: spec.nodes.labelRules[0].labels["kueue.azure.com/gpu-series"]
          value: nd-h200-v5
      - equal:
          path: spec.nodes.labelRules[1].match.vmSizes[0]
          value: Standard_NC40ads_H100_v5
