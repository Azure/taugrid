suite: TauCluster topology reconciliation
templates:
  - taucluster.yaml
tests:
  - it: reconciles the reviewed AKS GPU label catalog by default
    asserts:
      - equal:
          path: spec.managementMode
          value: Reconcile
      - equal:
          path: spec.deletionPolicy
          value: Retain
      - lengthEqual:
          path: spec.nodes.labelRules
          count: 14
      - equal:
          path: spec.nodes.labelRules[0].match.vmSizes[0]
          value: Standard_NV6ads_A10_v5
      - equal:
          path: spec.nodes.labelRules[0].labels["kueue.azure.com/gpu-series"]
          value: nvads-a10-v5
      - equal:
          path: spec.nodes.labelRules[0].labels["tau.azure.com/gpu-class"]
          value: a10-4gb
      - equal:
          path: spec.nodes.labelRules[4].labels["tau.azure.com/gpu-class"]
          value: a100-80gb
      - equal:
          path: spec.nodes.labelRules[4].labels["kueue.azure.com/gpu-series"]
          value: nc24ads-a100-v4
      - equal:
          path: spec.nodes.labelRules[10].labels["tau.azure.com/gpu-class"]
          value: h100-80gb
      - equal:
          path: spec.nodes.labelRules[11].labels["tau.azure.com/gpu-class"]
          value: h200-141gb
      - equal:
          path: spec.nodes.labelRules[12].labels["tau.azure.com/gpu-class"]
          value: gb200-192gb
      - equal:
          path: spec.nodes.labelRules[13].match.vmSizes[1]
          value: Standard_ND128isrG5_GB300_v6
      - equal:
          path: spec.nodes.labelRules[13].labels["tau.azure.com/gpu-class"]
          value: gb300-288gb
      - equal:
          path: spec.nodes.labelRules[9].labels["tau.azure.com/gpu-class"]
          value: h100-95gb
      - equal:
          path: spec.queues.ownership
          value: External
      - lengthEqual:
          path: spec.workloadProfiles
          count: 15
      - equal:
          path: spec.workloadProfiles[0].executionTarget
          value: singleCluster
      - equal:
          path: spec.features.multiKueue
          value: Disabled
      - notEqual:
          path: spec.workloadProfiles[0].executionTarget
          value: multiKueueBeta

  - it: replaces the catalog and appends a platform supplied mapping
    set:
      tauCluster.nodeLabelRules:
        - match:
            vmSizes:
              - Standard_ND96isr_H200_v5
          labels:
            kueue.azure.com/gpu-series: nd-h200-v5
      tauCluster.extraNodeLabelRules:
        - match:
            vmSizes:
              - Standard_NC40ads_H100_v5
          labels:
            kueue.azure.com/gpu-series: nc-h100-v5
    asserts:
      - lengthEqual:
          path: spec.nodes.labelRules
          count: 2
      - equal:
          path: spec.nodes.labelRules[0].labels["kueue.azure.com/gpu-series"]
          value: nd-h200-v5
      - equal:
          path: spec.nodes.labelRules[1].match.vmSizes[0]
          value: Standard_NC40ads_H100_v5

  - it: replaces the complete workload profile catalog for a site
    set:
      tauCluster.workloadProfiles:
        - name: site.training
          applicability:
            teams: [site-team]
            lanes: [training]
            namespaces: [site-workloads]
          gpusPerWorker: 2
          workerCount: 1
          mode: fixed
          placement: independent
          defaultLocalQueue: site-queue
          executionTarget: singleCluster
          priorities:
            workloadPriorityClassName: site-default
            podPriorityClassName: site-default
    asserts:
      - lengthEqual:
          path: spec.workloadProfiles
          count: 1
      - equal:
          path: spec.workloadProfiles[0].name
          value: site.training
