suite: Researcher RayService permissions
templates:
  - templates/rbac.yaml
tests:
  - it: grants the controller read-only source Job access for workspace drain checks
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments"]
            verbs: ["get", "list", "watch"]
        documentIndex: 2
      - contains:
          path: rules
          content:
            apiGroups: ["batch"]
            resources: ["jobs"]
            verbs: ["get", "list", "watch"]
        documentIndex: 2
      - contains:
          path: rules
          content:
            apiGroups: ["ray.io"]
            resources: ["rayjobs", "rayservices"]
            verbs: ["get", "list", "watch"]
        documentIndex: 2

  - it: grants RayJob and RayService lifecycle permissions to the researcher role
    documentSelector:
      path: metadata.name
      value: tau-researcher-v1
    asserts:
      - isKind:
          of: ClusterRole
      - contains:
          path: rules
          content:
            apiGroups: ["ray.io"]
            resources: ["rayjobs", "rayservices"]
            verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]

  - it: grants the controller create-only mutation access to Kueue Topologies
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["kueue.x-k8s.io"]
            resources: ["topologies"]
            verbs: ["get", "list", "watch", "create"]
        documentIndex: 2
      - contains:
          path: rules
          content:
            apiGroups: ["kueue.x-k8s.io"]
            resources: ["resourceflavors"]
            verbs: ["get", "list", "watch", "create"]
        documentIndex: 2
      - contains:
          path: rules
          content:
            apiGroups: ["kueue.x-k8s.io"]
            resources: ["clusterqueues"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        documentIndex: 2
      - contains:
          path: rules
          content:
            apiGroups: ["kueue.x-k8s.io"]
            resources: ["cohorts"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        documentIndex: 2
      - contains:
          path: rules
          content:
            apiGroups: ["tau.azure.com"]
            resources: ["teams", "workspaces"]
            verbs: ["update", "patch"]
        documentIndex: 2
      - contains:
          path: rules
          content:
            apiGroups: ["tau.azure.com"]
            resources: ["clusters/status", "teams/status", "workspaces/status", "quotarequests/status"]
            verbs: ["get", "update", "patch"]
        documentIndex: 2

  - it: grants the controller Node status patch access for torchrun host slots
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["nodes/status"]
            verbs: ["get", "patch"]
        documentIndex: 2
