suite: Controller deployment portability
templates:
  - deployment.yaml
tests:
  - it: uses the public MCR release image matching the chart version
    release:
      namespace: tau-system
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: mcr.microsoft.com/aks/ai-runtime/tau-core-controller:0.4.0
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: taugrid
      - equal:
          path: metadata.namespace
          value: tau-system
      - contains:
          path: spec.template.spec.containers[0].args
          content: --platform-namespace=tau-system

  - it: accepts a mirrored image
    set:
      image:
        repository: my-registry.example.com/tau-core-controller
        digest: ""
        tag: v0.1.0
        pullPolicy: IfNotPresent
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: my-registry.example.com/tau-core-controller:v0.1.0

  - it: keeps the release namespace consistent between metadata and args
    release:
      namespace: custom-system
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-system
      - contains:
          path: spec.template.spec.containers[0].args
          content: --platform-namespace=custom-system

  - it: keeps the immutable selector free of release scoped labels
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: tau-core-controller
