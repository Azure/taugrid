suite: Controller deployment portability
templates:
  - deployment.yaml
tests:
  - it: pins the public MCR image by digest and does not re-pull it
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: mcr.microsoft.com/aks/ai-runtime/tau-core-controller@sha256:0f1d58b3cb2a9297117670874ef2e7df35847f13e2a34edb02126f1a4a8dd766
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: taugrid
      - equal:
          path: metadata.namespace
          value: tau-platform
      - contains:
          path: spec.template.spec.containers[0].args
          content: --platform-namespace=tau-platform

  - it: accepts a mirrored image
    set:
      image:
        repository: mcr.microsoft.com/aks/ai-runtime/tau-core-controller
        digest: ""
        tag: v0.1.0
        pullPolicy: IfNotPresent
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: mcr.microsoft.com/aks/ai-runtime/tau-core-controller:v0.1.0

  - it: keeps the platform namespace consistent between metadata and args
    set:
      platformNamespace: tau-system
    asserts:
      - equal:
          path: metadata.namespace
          value: tau-system
      - contains:
          path: spec.template.spec.containers[0].args
          content: --platform-namespace=tau-system

  - it: keeps the immutable selector free of release scoped labels
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: tau-core-controller
