suite: MultiKueue Beta controller gate
templates:
  - beta-feature-gates.yaml
  - deployment.yaml
  - rbac.yaml
  - taucluster.yaml
tests:
  - it: keeps the runtime gate and MultiKueue RBAC disabled by default
    template: deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --beta-feature-gates=multikueue

  - it: keeps MultiKueue prerequisite RBAC absent by default
    template: rbac.yaml
    documentIndex: 2
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["kueue.x-k8s.io"]
            resources: ["admissionchecks"]
            verbs: ["get", "list", "watch"]
      - notContains:
          path: rules
          content:
            apiGroups: ["kueue.x-k8s.io"]
            resources: ["multikueueconfigs", "multikueueclusters"]
            verbs: ["get"]

  - it: rejects feature enablement without risk acknowledgement
    template: beta-feature-gates.yaml
    set:
      global.betaFeatures:
        - multikueue
    asserts:
      - failedTemplate:
          errorMessage: MultiKueue Beta requires both global.betaFeatures=[multikueue] and global.betaRiskAcknowledgements=[multikueue]; enabling only one is not permitted

  - it: rejects risk acknowledgement without feature enablement
    template: beta-feature-gates.yaml
    set:
      global.betaRiskAcknowledgements:
        - multikueue
    asserts:
      - failedTemplate:
          errorMessage: MultiKueue Beta requires both global.betaFeatures=[multikueue] and global.betaRiskAcknowledgements=[multikueue]; enabling only one is not permitted

  - it: rejects direct MultiKueue-looking values without both gates
    template: beta-feature-gates.yaml
    set:
      partOf: multikueue-platform
    asserts:
      - failedTemplate:
          errorMessage: MultiKueue configuration was supplied without the required Beta gate; set both global.betaFeatures=[multikueue] and global.betaRiskAcknowledgements=[multikueue]

  - it: rejects TauCluster operator Beta without install approvals
    template: beta-feature-gates.yaml
    set:
      tauCluster.features.multiKueue: Beta
    asserts:
      - failedTemplate:
          errorMessage: MultiKueue configuration was supplied without the required Beta gate; set both global.betaFeatures=[multikueue] and global.betaRiskAcknowledgements=[multikueue]

  - it: rejects a custom MultiKueue profile without install approvals
    template: beta-feature-gates.yaml
    set:
      tauCluster.workloadProfiles:
        - name: site.multikueue
          applicability:
            teams: [research]
            lanes: [training]
            namespaces: [research-workloads]
          gpusPerWorker: 1
          workerCount: 1
          mode: fixed
          placement: independent
          defaultLocalQueue: multikueue-jobqueue
          executionTarget: multiKueueBeta
          priorities:
            workloadPriorityClassName: taugrid-default
            podPriorityClassName: taugrid-default
    asserts:
      - failedTemplate:
          errorMessage: MultiKueue configuration was supplied without the required Beta gate; set both global.betaFeatures=[multikueue] and global.betaRiskAcknowledgements=[multikueue]

  - it: enables only the runtime capability when fully acknowledged
    template: deployment.yaml
    set:
      global.betaFeatures:
        - multikueue
      global.betaRiskAcknowledgements:
        - multikueue
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --beta-feature-gates=multikueue

  - it: grants least-privilege prerequisite reads when fully acknowledged
    template: rbac.yaml
    documentIndex: 2
    set:
      global.betaFeatures:
        - multikueue
      global.betaRiskAcknowledgements:
        - multikueue
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["kueue.x-k8s.io"]
            resources: ["admissionchecks"]
            verbs: ["get", "list", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["kueue.x-k8s.io"]
            resources: ["multikueueconfigs", "multikueueclusters"]
            verbs: ["get"]

  - it: renders operator Beta only after both install approvals
    template: taucluster.yaml
    set:
      global.betaFeatures:
        - multikueue
      global.betaRiskAcknowledgements:
        - multikueue
      tauCluster.features.multiKueue: Beta
    asserts:
      - equal:
          path: spec.features.multiKueue
          value: Beta
