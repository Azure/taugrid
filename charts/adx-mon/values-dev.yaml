# values-dev.yaml — Development overrides for local/CI testing
#
# Uses GHCR images from the upstream adx-mon repo instead of MCR.
# Usage:
#   helm install adx-mon charts/adx-mon/ -f charts/adx-mon/values.yaml -f charts/adx-mon/values-dev.yaml

operator:
  image:
    repository: ghcr.io/azure/adx-mon/operator
    tag: latest

collector:
  image:
    repository: ghcr.io/azure/adx-mon/collector
    tag: latest

collectorSingleton:
  image:
    repository: ghcr.io/azure/adx-mon/collector
    tag: latest

ingestor:
  image:
    repository: ghcr.io/azure/adx-mon/ingestor
    tag: latest

alerter:
  image:
    repository: ghcr.io/azure/adx-mon/alerter
    tag: latest

# NOTE: kube-state-metrics image is not overridden here.
# values.yaml already defaults to mcr.microsoft.com/oss/v2/kubernetes/kube-state-metrics:v2.18.0.

global:
  imagePullPolicy: Always
