      - DCGMFIDEVFBUSED
      - DCGMFIDEVFBFREE
      - DCGMFIDEVGPUTEMP
      - DCGMFIDEVPOWERUSAGE
      - DCGMFIDEVCORRECTABLEREMAPPEDROWS
