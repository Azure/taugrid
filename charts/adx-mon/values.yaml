      - KubeCustomresourceLocalqueueAdmittedWorkloads
      - KubeCustomresourceLocalqueuePendingWorkloads
      - KueueAdmissionAttemptsTotal
      - KueueAdmissionWaitTimeSeconds
      - ExperimentMetrics
      - KubeJobComplete
      - KubeJobFailed
      - KubeJobDurationSeconds
      - KubeJobOwner
      - KubeNamespaceLabels
      - KubeNodeStatusCondition
      - KubeNodeLabels
      - KubePodContainerResourceLimits
      - KubePodContainerResourceRequests
      - KubePodInfo
      - KubePodResourceclaimInfo
      - KubePodStatusPhase
      - KubePodOwner
      - NodeCpuSecondsTotal
      - NodeMemoryMemTotalBytes
      - NodeMemoryMemAvailableBytes
      - NodeFilesystemSizeBytes
      - NodeFilesystemAvailBytes
