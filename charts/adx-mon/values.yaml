      - '^disabled.*'
      - '^hidden.*'
      - '^python_gc.*'
      - '^python_info$'
      - '^registered.*'
      - '^target_info$'
  journalLogs:
    enabled: true
    targets:
      - matches: ['_SYSTEMD_UNIT=kubelet.service']
        database: Logs
        table: Kubelet
  containerLogs:
    enabled: false
    targets: []
  otelLog:
    enabled: true
    liftAttributes:
      - "kusto.database"
      - "kusto.table"
  gpu:
    dcgmScrape: true
    kernelTarget: true
    kernelLogTable: KernelLogs
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: sku
      operator: Equal
      value: gpu
      effect: NoSchedule
  nodeSelector: {}
  affinity: {}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: "30%"

collectorSingleton:
  enabled: true
  image:
    repository: mcr.microsoft.com/aks/ai-runtime/adx-mon/collector
    tag: ""
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 500m
      memory: 2Gi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  nodeSelector: {}
  scrapeTargets: []

ingestor:
  enabled: true
  image:
    repository: mcr.microsoft.com/aks/ai-runtime/adx-mon/ingestor
    tag: ""
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 4Gi
  storageDir: /mnt/ingestor
  maxSegmentAge: 60s
  maxDiskUsage: 21474836480
  maxTransferSize: 10485760
  maxConnections: 1000
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  nodeSelector: {}
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [ingestor]
          topologyKey: kubernetes.io/hostname

alerter:
  enabled: true
  image:
    repository: mcr.microsoft.com/aks/ai-runtime/adx-mon/alerter
    tag: ""
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 125Mi
    limits:
      cpu: 400m
      memory: 1400Mi
  alerterEndpoint: ""
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  nodeSelector: {}

kube-state-metrics:
  enabled: true
  image:
    registry: mcr.microsoft.com
    repository: oss/v2/kubernetes/kube-state-metrics
    tag: v2.20.0
  shards: 1
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: kueue.x-k8s.io
              version: v1beta1
              kind: ClusterQueue
            labelsFromPath:
              name: [metadata, name]
              cohort: [spec, cohort]
            metrics:
              - name: clusterqueue_pending_workloads
                help: "Number of pending workloads in the ClusterQueue"
                each:
                  type: Gauge
                  gauge:
                    path: [status, pendingWorkloads]
                    nilIsZero: true
              - name: clusterqueue_admitted_workloads
                help: "Number of admitted workloads in the ClusterQueue"
                each:
                  type: Gauge
                  gauge:
                    path: [status, admittedWorkloads]
                    nilIsZero: true
              - name: clusterqueue_reserving_workloads
                help: "Number of reserving workloads in the ClusterQueue"
                each:
                  type: Gauge
                  gauge:
                    path: [status, reservingWorkloads]
                    nilIsZero: true
          - groupVersionKind:
              group: kueue.x-k8s.io
              version: v1beta1
              kind: LocalQueue
            labelsFromPath:
              name: [metadata, name]
              namespace: [metadata, namespace]
            metrics:
              - name: localqueue_pending_workloads
                help: "Number of pending workloads in the LocalQueue"
                each:
                  type: Gauge
                  gauge:
                    path: [status, pendingWorkloads]
                    nilIsZero: true
              - name: localqueue_admitted_workloads
                help: "Number of admitted workloads in the LocalQueue"
                each:
                  type: Gauge
                  gauge:
                    path: [status, admittedWorkloads]
                    nilIsZero: true
              - name: localqueue_reserving_workloads
                help: "Number of reserving workloads in the LocalQueue"
                each:
                  type: Gauge
                  gauge:
                    path: [status, reservingWorkloads]
                    nilIsZero: true
          - groupVersionKind:
              group: kueue.x-k8s.io
              version: v1beta1
              kind: Workload
            labelsFromPath:
              name: [metadata, name]
              namespace: [metadata, namespace]
            metrics:
              - name: workload_info
                help: "Info metric for Kueue workloads (labels carry admission details)"
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      clusterqueue: [status, admission, clusterQueue]
  rbac:
    extraRules:
      - apiGroups: ["kueue.x-k8s.io"]
        resources: ["clusterqueues", "localqueues", "workloads"]
        verbs: ["list", "watch"]
  metricLabelsAllowlist:
    - namespaces=[tau.azure.com/workspace]
    - pods=[app.kubernetes.io/name,app.kubernetes.io/component,ray.io/is-ray-node]
    - nodes=[node.kubernetes.io/instance-type,kubernetes.azure.com/agentpool]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  nodeSelector: {}
  podAnnotations:
    adx-mon/scrape: "true"
    adx-mon/port: "8080"

crds:
  install: true
  keep: true

functions:
  enabled: true
  items:
    gpuHealth:
      enabled: true
      database: Metrics
    nodeHealth:
      enabled: true
      database: Metrics
    containerMetrics:
      enabled: true
      database: Metrics
    kueueMetrics:
      enabled: true
      database: Metrics
    ncclErrors:
      enabled: true
      database: Logs
    xidErrors:
      enabled: true
      database: Logs
    trainingJobSummary:
      enabled: true
      database: Metrics
    tauExpMetricEventRows:
      enabled: false
      database: Metrics
    tauExpSeriesCatalogRows:
      enabled: false
      database: Metrics
    tauExpRunCatalogRows:
      enabled: false
      database: Metrics
    auditEvents:
      enabled: true
      database: Audit

alertRules:
  enabled: true
  items:
    gpuXidCritical:
      enabled: true
      interval: 1m
      destination: ""
    nodeNotReady:
      enabled: true
      interval: 1m
      destination: ""
    eccUncorrectable:
      enabled: true
      interval: 5m
      destination: ""
    nvlinkDown:
      enabled: true
      interval: 5m
      destination: ""
    jobFailureRate:
      enabled: true
      interval: 5m
      destination: ""
  ray:
    enabled: false
    podRestart:
      interval: 5m
      destination: ""
      restartThreshold: 3

summaryRules:
  enabled: true
  items:
    gpuUtilizationHourly:
      enabled: true
      interval: 1h
      database: Metrics
      table: GpuUtilizationHourly
    gpuCostHourly:
      enabled: true
      interval: 1h
      ingestionDelay: 2m
      database: CostTracking
      table: GpuCostHourly
    gpuCostDaily:
      enabled: false
      interval: 24h
      ingestionDelay: 10m
      database: CostTracking
      table: GpuCostDaily
    namespaceCostMonthly:
      enabled: false
      interval: 24h
      ingestionDelay: 20m
      database: CostTracking
      table: NamespaceCostMonthly
    nodeResourcesHourly:
      enabled: true
      interval: 1h
      database: Metrics
      table: NodeResourcesHourly

cost:
  gpuRates:
    Standard_NC6s_v3: 3.06
    Standard_NC12s_v3: 3.06
    Standard_NC24s_v3: 3.06
    Standard_NC24rs_v3: 3.365
    Standard_NC24ads_A100_v4: 3.67
    Standard_NC48ads_A100_v4: 3.675
    Standard_NC96ads_A100_v4: 3.6725
    Standard_ND96asr_v4: 3.40
    Standard_ND96amsr_A100_v4: 4.10
    Standard_ND96isr_H100_v5: 12.27
    Standard_NV6ads_A10_v5: 0.45
    Standard_NV12ads_A10_v5: 0.45
    Standard_NV18ads_A10_v5: 0.45
    Standard_NV36ads_A10_v5: 0.45
    Standard_NV72ads_A10_v5: 0.45

podSecurityContext:
  runAsNonRoot: false
  supplementalGroups:
    - 0
    - 23
    - 101
    - 999
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

_test:
  enabled: false

