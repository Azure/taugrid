      - SystemLogs
      - KernelLogs
      - Kubelet
      - ContainerRuntime

  ingestionBatching:
    enabled: false
    metrics:
      maxBatchingTimeSpan: "00:00:15"
      maxNumberOfItems: 500
      maxRawDataSizeMB: 1024
