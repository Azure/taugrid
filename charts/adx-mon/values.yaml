global:
  namespace: ""
  clusterName: ""
  region: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

adx:
  clusterUrl: ""
  clientId: ""
  workloadIdentity:
    enabled: false
  metricsDatabase: "Metrics"
  logsDatabase: "Logs"
  costTrackingDatabase: "CostTracking"
  auditDatabase: "Audit"
  configMapRef: ""

operator:
  enabled: true
  image:
    repository: mcr.microsoft.com/aks/ai-runtime/adx-mon/operator
    tag: ""
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  nodeSelector: {}
  affinity: {}

collector:
  enabled: true
  image:
    repository: mcr.microsoft.com/aks/ai-runtime/adx-mon/collector
    tag: ""
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 500m
      memory: 2Gi
  hostPort: 3100
  storageDir: /mnt/collector
  initImage:
    repository: mcr.microsoft.com/azurelinux/base/core
