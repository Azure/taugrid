{{- if .Values.ingestor.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "adx-mon.serviceAccountName" (dict "root" . "component" "ingestor") }}
  namespace: {{ include "adx-mon.namespace" . }}
  labels:
    {{- include "adx-mon.componentLabels" (dict "root" . "component" "ingestor") | nindent 4 }}
  {{- if .Values.adx.workloadIdentity.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ include "adx-mon.workloadIdentityClientId" . | quote }}
  {{- end }}
# SA default is false for security; StatefulSet pod overrides to true for API access.
automountServiceAccountToken: false
{{- end }}
