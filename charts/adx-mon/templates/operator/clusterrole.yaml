{{- if .Values.operator.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "adx-mon.fullname" . }}-operator
  labels:
    {{- include "adx-mon.componentLabels" (dict "root" . "component" "operator") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, services, configmaps, serviceaccounts]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [adx-mon.azure.com]
    resources:
      - adxclusters
      - alerters
      - alertrules
      - collectors
      - functions
      - ingestors
      - managementcommands
      - metricsexporters
      - summaryrules
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [adx-mon.azure.com]
    resources:
      - adxclusters/status
      - alerters/status
      - collectors/status
      - ingestors/status
    verbs: [update, patch]
  - apiGroups: [adx-mon.azure.com]
    resources:
      - adxclusters/finalizers
      - alerters/finalizers
      - collectors/finalizers
      - ingestors/finalizers
    verbs: [get, update, delete]
{{- end }}
