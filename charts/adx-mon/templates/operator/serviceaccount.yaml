{{- if .Values.operator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "adx-mon.serviceAccountName" (dict "root" . "component" "operator") }}
  namespace: {{ include "adx-mon.namespace" . }}
  labels:
    {{- include "adx-mon.componentLabels" (dict "root" . "component" "operator") | nindent 4 }}
# SA default is false for security; Deployment explicitly overrides to true
# because controller-runtime requires API server access.
automountServiceAccountToken: false
{{- end }}
