{{- if and .Values.functions.enabled .Values.functions.items.gpuHealth.enabled }}
apiVersion: adx-mon.azure.com/v1
kind: Function
metadata:
  name: {{ include "adx-mon.fullname" . }}-gpu-health
  namespace: {{ include "adx-mon.namespace" . }}
  labels:
    {{- include "adx-mon.labels" . | nindent 4 }}
    app.kubernetes.io/component: function
spec:
  database: {{ .Values.functions.items.gpuHealth.database | quote }}
  body: |
    // GPU health view: utilization, temperature, power, memory, row-remap errors.
    // Lifts Prometheus labels from the dynamic Labels column for clean queries.
    // Prefer PodResources labels when configured. AKS host DCGM exporters instead
    // expose Hostname and rely on the collector's lifted Host/Namespace/Pod
    // columns, so fall back to those without collapsing multiple hosts.
    //
    // NOTE: DCGM metrics are ALL UPPERCASE, so adx-mon NormalizeMetricName produces
    // all-caps table names (underscores stripped, case preserved).
    // Row-remap metrics replace ECC SBE/DBE counters because the stock dcgm-exporter
    // default-counters.csv does not include DCGM_FI_DEV_ECC_{SBE,DBE}_VOL_TOTAL.
    // To add ECC counters, ship a custom dcgm-exporter ConfigMap.
    .create-or-alter function GpuHealth () {
      let gpu_util = DCGMFIDEVGPUUTIL
      | extend gpu = tostring(Labels.gpu),
               instance = iff(isnotempty(tostring(Labels.instance)), tostring(Labels.instance), iff(isnotempty(tostring(Labels.Hostname)), tostring(Labels.Hostname), tostring(Host))),
               namespace = iff(isnotempty(tostring(Labels.exported_namespace)), tostring(Labels.exported_namespace), tostring(Namespace)),
               pod = iff(isnotempty(tostring(Labels.pod)), tostring(Labels.pod), tostring(Pod)),
               modelName = tostring(Labels.modelName);
      let gpu_temp = DCGMFIDEVGPUTEMP
      | extend gpu = tostring(Labels.gpu),
               instance = iff(isnotempty(tostring(Labels.instance)), tostring(Labels.instance), iff(isnotempty(tostring(Labels.Hostname)), tostring(Labels.Hostname), tostring(Host))),
               namespace = iff(isnotempty(tostring(Labels.exported_namespace)), tostring(Labels.exported_namespace), tostring(Namespace)),
               pod = iff(isnotempty(tostring(Labels.pod)), tostring(Labels.pod), tostring(Pod)),
               modelName = tostring(Labels.modelName);
      let gpu_power = DCGMFIDEVPOWERUSAGE
      | extend gpu = tostring(Labels.gpu),
               instance = iff(isnotempty(tostring(Labels.instance)), tostring(Labels.instance), iff(isnotempty(tostring(Labels.Hostname)), tostring(Labels.Hostname), tostring(Host))),
               namespace = iff(isnotempty(tostring(Labels.exported_namespace)), tostring(Labels.exported_namespace), tostring(Namespace)),
               pod = iff(isnotempty(tostring(Labels.pod)), tostring(Labels.pod), tostring(Pod)),
               modelName = tostring(Labels.modelName);
      let mem_used = DCGMFIDEVFBUSED
      | extend gpu = tostring(Labels.gpu),
               instance = iff(isnotempty(tostring(Labels.instance)), tostring(Labels.instance), iff(isnotempty(tostring(Labels.Hostname)), tostring(Labels.Hostname), tostring(Host))),
               namespace = iff(isnotempty(tostring(Labels.exported_namespace)), tostring(Labels.exported_namespace), tostring(Namespace)),
               pod = iff(isnotempty(tostring(Labels.pod)), tostring(Labels.pod), tostring(Pod)),
               modelName = tostring(Labels.modelName);
      let mem_free = DCGMFIDEVFBFREE
      | extend gpu = tostring(Labels.gpu),
               instance = iff(isnotempty(tostring(Labels.instance)), tostring(Labels.instance), iff(isnotempty(tostring(Labels.Hostname)), tostring(Labels.Hostname), tostring(Host))),
               namespace = iff(isnotempty(tostring(Labels.exported_namespace)), tostring(Labels.exported_namespace), tostring(Namespace)),
               pod = iff(isnotempty(tostring(Labels.pod)), tostring(Labels.pod), tostring(Pod)),
               modelName = tostring(Labels.modelName);
      let remap_correctable = DCGMFIDEVCORRECTABLEREMAPPEDROWS
      | extend gpu = tostring(Labels.gpu),
               instance = iff(isnotempty(tostring(Labels.instance)), tostring(Labels.instance), iff(isnotempty(tostring(Labels.Hostname)), tostring(Labels.Hostname), tostring(Host))),
               namespace = iff(isnotempty(tostring(Labels.exported_namespace)), tostring(Labels.exported_namespace), tostring(Namespace)),
               pod = iff(isnotempty(tostring(Labels.pod)), tostring(Labels.pod), tostring(Pod)),
               modelName = tostring(Labels.modelName);
      let remap_uncorrectable = DCGMFIDEVUNCORRECTABLEREMAPPEDROWS
      | extend gpu = tostring(Labels.gpu),
               instance = iff(isnotempty(tostring(Labels.instance)), tostring(Labels.instance), iff(isnotempty(tostring(Labels.Hostname)), tostring(Labels.Hostname), tostring(Host))),
               namespace = iff(isnotempty(tostring(Labels.exported_namespace)), tostring(Labels.exported_namespace), tostring(Namespace)),
               pod = iff(isnotempty(tostring(Labels.pod)), tostring(Labels.pod), tostring(Pod)),
               modelName = tostring(Labels.modelName);
      let remap_failure = DCGMFIDEVROWREMAPFAILURE
      | extend gpu = tostring(Labels.gpu),
               instance = iff(isnotempty(tostring(Labels.instance)), tostring(Labels.instance), iff(isnotempty(tostring(Labels.Hostname)), tostring(Labels.Hostname), tostring(Host))),
               namespace = iff(isnotempty(tostring(Labels.exported_namespace)), tostring(Labels.exported_namespace), tostring(Namespace)),
               pod = iff(isnotempty(tostring(Labels.pod)), tostring(Labels.pod), tostring(Pod)),
               modelName = tostring(Labels.modelName);
      union
        (gpu_util           | project Timestamp, Cluster, instance, gpu, modelName, namespace, pod, metric="gpu_utilization", Value),
        (gpu_temp           | project Timestamp, Cluster, instance, gpu, modelName, namespace, pod, metric="gpu_temperature_celsius", Value),
        (gpu_power          | project Timestamp, Cluster, instance, gpu, modelName, namespace, pod, metric="gpu_power_watts", Value),
        (mem_used           | project Timestamp, Cluster, instance, gpu, modelName, namespace, pod, metric="fb_memory_used_mb", Value),
        (mem_free           | project Timestamp, Cluster, instance, gpu, modelName, namespace, pod, metric="fb_memory_free_mb", Value),
        (remap_correctable  | project Timestamp, Cluster, instance, gpu, modelName, namespace, pod, metric="correctable_remapped_rows", Value),
        (remap_uncorrectable | project Timestamp, Cluster, instance, gpu, modelName, namespace, pod, metric="uncorrectable_remapped_rows", Value),
        (remap_failure      | project Timestamp, Cluster, instance, gpu, modelName, namespace, pod, metric="row_remap_failure", Value)
    }
{{- end }}
