{{- if and .Values.functions.enabled .Values.functions.items.tauExpMetricDeliveryObservabilityRows.enabled }}
apiVersion: adx-mon.azure.com/v1
kind: Function
metadata:
  name: {{ include "adx-mon.fullname" . }}-tau-exp-metric-delivery-observability-rows
  namespace: {{ include "adx-mon.namespace" . }}
  labels:
    {{- include "adx-mon.labels" . | nindent 4 }}
    app.kubernetes.io/component: function
spec:
  database: {{ .Values.functions.items.tauExpMetricDeliveryObservabilityRows.database | quote }}
  body: |
    .create-or-alter function with (folder = 'Tau/experiments', docstring = 'Typed metric delivery volume, duplicate, schema, and digest observability.', skipvalidation = 'true') TauExpMetricDeliveryObservabilityRows()
    {
      TauExpMetricEventsV1
      | extend activity_hour = bin(exported_at, 1h)
      | summarize
          raw_event_count = count(),
          unique_event_count = dcount(event_id),
          missing_event_id_count = countif(isempty(event_id)),
          invalid_schema_count = countif(schema_version != 'tau.experiment.metric.v1'),
          latest_event_at = max(wall_time),
          latest_exported_at = max(exported_at),
          max_export_delay_seconds = max(datetime_diff('second', exported_at, wall_time))
        by activity_hour
      | extend duplicate_event_count = raw_event_count - unique_event_count
      | project
          activity_hour,
          raw_event_count,
          unique_event_count,
          duplicate_event_count,
          missing_event_id_count,
          invalid_schema_count,
          latest_event_at,
          latest_exported_at,
          max_export_delay_seconds
    }
{{- end }}
