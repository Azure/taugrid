{{- if .Values.managementCommands.typedMetricEventsV1.enabled }}
apiVersion: adx-mon.azure.com/v1
kind: ManagementCommand
metadata:
  name: {{ include "adx-mon.fullname" . }}-typed-metric-events-v1-retention
  namespace: {{ include "adx-mon.namespace" . }}
  labels:
    {{- include "adx-mon.labels" . | nindent 4 }}
    app.kubernetes.io/component: management-command
spec:
  database: {{ .Values.managementCommands.typedMetricEventsV1.database | quote }}
  body: |
    // This separate desired-state command retries until asynchronous materialized-view
    // creation completes, so retention reconciliation cannot race view backfill.
    .alter-merge materialized-view TauExpMetricEventsV1Dedup policy retention softdelete = {{ .Values.managementCommands.typedMetricEventsV1.retention.softDeletePeriod }} recoverability = disabled
{{- end }}
