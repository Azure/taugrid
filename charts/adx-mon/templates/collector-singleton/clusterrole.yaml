{{- if .Values.collectorSingleton.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "adx-mon.fullname" . }}-collector-singleton
  labels:
    {{- include "adx-mon.componentLabels" (dict "root" . "component" "collector-singleton") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes/metrics, nodes/proxy]
    verbs: [get]
  - apiGroups: [""]
    resources: [namespaces, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: ["/metrics"]
    verbs: [get]
{{- end }}
