{{- if .Values.collectorSingleton.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "adx-mon.serviceAccountName" (dict "root" . "component" "collector-singleton") }}
  namespace: {{ include "adx-mon.namespace" . }}
  labels:
    {{- include "adx-mon.componentLabels" (dict "root" . "component" "collector-singleton") | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
