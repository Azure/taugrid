{{- if .Values.collector.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "adx-mon.fullname" . }}-collector
  namespace: {{ include "adx-mon.namespace" . }}
  labels:
    {{- include "adx-mon.componentLabels" (dict "root" . "component" "collector") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "adx-mon.componentSelectorLabels" (dict "root" . "component" "collector") | nindent 6 }}
  updateStrategy:
    {{- toYaml .Values.collector.updateStrategy | nindent 4 }}
  template:
    metadata:
      annotations:
        adx-mon/scrape: "true"
        adx-mon/port: "9091"
        adx-mon/path: /metrics
        adx-mon/log-destination: "Logs:Collector"
        adx-mon/log-parsers: json
        checksum/config: {{ include (print $.Template.BasePath "/collector/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "adx-mon.componentSelectorLabels" (dict "root" . "component" "collector") | nindent 8 }}
    spec:
      automountServiceAccountToken: true
      serviceAccountName: {{ include "adx-mon.serviceAccountName" (dict "root" . "component" "collector") }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: fix-permissions
          image: {{ .Values.collector.initImage.repository }}:{{ .Values.collector.initImage.tag }}
          command: ["sh", "-c", "chown 1000:3000 /mnt/data && chmod 750 /mnt/data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: storage
              mountPath: /mnt/data
      containers:
        - name: collector
          image: {{ include "adx-mon.image" (dict "image" .Values.collector.image "chart" .Chart) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /collector
          args:
            - --config=/etc/config/config.toml
            - --hostname=$(HOSTNAME)
          ports:
            - containerPort: 8080
              protocol: TCP
              hostPort: {{ .Values.collector.hostPort }}
          env:
            - name: LOG_LEVEL
              value: INFO
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GODEBUG
              value: http2client=0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsGroup: 3000
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          volumeMounts:
            - name: ssl-certs
              mountPath: /etc/ssl/certs
              readOnly: true
            - name: etc-pki-ca-certs
              mountPath: /etc/pki/ca-trust/extracted
              readOnly: true
            - name: config-volume
              mountPath: /etc/config
            - name: storage
              mountPath: /mnt/data
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: runlog
              mountPath: /run/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: etcmachineid
              mountPath: /etc/machine-id
              readOnly: true
      {{- with .Values.collector.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: ssl-certs
          hostPath:
            path: /etc/ssl/certs
            type: Directory
        - name: etc-pki-ca-certs
          hostPath:
            path: /etc/pki/ca-trust/extracted
            type: DirectoryOrCreate
        - name: config-volume
          configMap:
            name: {{ include "adx-mon.fullname" . }}-collector-config
        - name: storage
          hostPath:
            path: {{ .Values.collector.storageDir }}
            type: DirectoryOrCreate
        - name: varlog
          hostPath:
            path: /var/log
        - name: runlog
          hostPath:
            path: /run/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: etcmachineid
          hostPath:
            path: /etc/machine-id
            type: File
{{- end }}
