{{- if .Values.collector.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "adx-mon.fullname" . }}-collector
  labels:
    {{- include "adx-mon.componentLabels" (dict "root" . "component" "collector") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "adx-mon.fullname" . }}-collector
subjects:
  - kind: ServiceAccount
    name: {{ include "adx-mon.serviceAccountName" (dict "root" . "component" "collector") }}
    namespace: {{ include "adx-mon.namespace" . }}
{{- end }}
