{{- if .Values.alerter.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "adx-mon.serviceAccountName" (dict "root" . "component" "alerter") }}
  namespace: {{ include "adx-mon.namespace" . }}
  labels:
    {{- include "adx-mon.componentLabels" (dict "root" . "component" "alerter") | nindent 4 }}
  {{- if .Values.adx.workloadIdentity.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ include "adx-mon.workloadIdentityClientId" . | quote }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
