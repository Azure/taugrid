{{- if and .Values.summaryRules.enabled .Values.summaryRules.items.namespaceCostMonthly.enabled }}
apiVersion: adx-mon.azure.com/v1
kind: SummaryRule
metadata:
  name: {{ include "adx-mon.fullname" . }}-namespace-cost-monthly
  namespace: {{ include "adx-mon.namespace" . }}
  labels:
    {{- include "adx-mon.labels" . | nindent 4 }}
    app.kubernetes.io/component: summary-rule
spec:
  database: {{ .Values.summaryRules.items.namespaceCostMonthly.database | quote }}
  table: {{ .Values.summaryRules.items.namespaceCostMonthly.table | quote }}
  interval: {{ .Values.summaryRules.items.namespaceCostMonthly.interval | quote }}
  {{- with .Values.summaryRules.items.namespaceCostMonthly.ingestionDelay }}
  ingestionDelay: {{ . | quote }}
  {{- end }}
  {{- with .Values.summaryRules.items.namespaceCostMonthly.criteria }}
  criteria:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  body: |
    // Monthly namespace cost for chargeback: aggregates daily cost by namespace.
    // Reads from GpuCostDaily (output of gpu-cost-daily SummaryRule).
    // Runs daily but appends to a monthly table, building up the month incrementally.
    GpuCostDaily
    | where Timestamp between (_startTime .. _endTime)
    | extend workspace = coalesce(workspace, namespace)
    | summarize
        total_gpu_hours = sum(total_gpu_hours),
        total_cost = sum(total_cost),
        avg_utilization = avg(avg_utilization)
        by Cluster, workspace, namespace, sku
    | extend pod_day_count = long(null), max_daily_nodes = long(null)
    | extend month = format_datetime(_startTime, "yyyy-MM")
    | extend Timestamp = bin(_startTime, 1d)
    | project Timestamp, month, namespace, sku,
        total_gpu_hours, total_cost, avg_utilization,
        pod_day_count, max_daily_nodes, Cluster, workspace
{{- end }}
