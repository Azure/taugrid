{{- if and .Values.summaryRules.enabled .Values.summaryRules.items.gpuCostDaily.enabled }}
apiVersion: adx-mon.azure.com/v1
kind: SummaryRule
metadata:
  name: {{ include "adx-mon.fullname" . }}-gpu-cost-daily
  namespace: {{ include "adx-mon.namespace" . }}
  labels:
    {{- include "adx-mon.labels" . | nindent 4 }}
    app.kubernetes.io/component: summary-rule
spec:
  database: {{ .Values.summaryRules.items.gpuCostDaily.database | quote }}
  table: {{ .Values.summaryRules.items.gpuCostDaily.table | quote }}
  interval: {{ .Values.summaryRules.items.gpuCostDaily.interval | quote }}
  {{- with .Values.summaryRules.items.gpuCostDaily.criteria }}
  criteria:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  body: |
    // Daily GPU cost aggregation: rolls up hourly cost data by namespace and SKU.
    // Reads from GpuCostHourly (output of gpu-cost-hourly SummaryRule).
    // Each row in GpuCostHourly represents exactly 1 hour of usage (bin(Timestamp, 1h)),
    // so sum(gpu_count) = total GPU-hours and sum(hourly_cost) = total cost.
    GpuCostHourly
    | where Timestamp between (_startTime .. _endTime)
    | summarize
        total_gpu_hours = sum(gpu_count),
        total_cost = sum(hourly_cost),
        avg_utilization = avg(avg_util),
        avg_rate = avg(rate_per_gpu_hour),
        distinct_pods = dcount(pod),
        distinct_nodes = dcount(node)
        by bin(Timestamp, 1d), namespace, sku
    | project Timestamp, namespace, sku,
        total_gpu_hours, total_cost, avg_utilization, avg_rate,
        distinct_pods, distinct_nodes
{{- end }}
