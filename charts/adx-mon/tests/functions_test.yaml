  # ── experiment-metrics-dashboard-rows ───────────────────────
  - it: should render experiment-metrics-dashboard-rows Function CR
    template: templates/functions/experiment-metrics-dashboard-rows.yaml
    asserts:
      - isKind:
          of: Function
      - equal:
          path: metadata.name
          value: adx-mon-experiment-metrics-dashboard-rows
      - equal:
          path: spec.database
          value: "Metrics"
      - equal:
          path: spec.body
          value: |
            // skipvalidation keeps the optional Tau remote-write function installable
            // before any cluster has emitted ExperimentMetrics; it must not hide schema drift.
            .create-or-alter function with (folder = 'Tau/experiments', docstring = 'Normalize adx-mon experiment_metrics rows to the Tau dashboard metric contract.', skipvalidation = 'true') ExperimentMetricsDashboardRows()
            {
            ExperimentMetrics
            | extend workspace_id=tostring(Labels.workspace_id), cluster=tostring(Cluster), source_store_id=tostring(Labels.source_store_id), ['project']=tostring(Labels['project']), experiment_id=coalesce(tostring(Labels.experiment_id), tostring(Labels.question_id), ''), run_group_id=tostring(Labels.run_group_id), run_id=tostring(Labels.run_id), metric_name=tostring(Labels.metric_name), source=tostring(Labels.source), unit=tostring(Labels.unit), split=tostring(Labels.split), metric_file_id=tostring(Labels.metric_file_id), metric_file_path=tostring(Labels.metric_file_path), tags=tostring(Labels.tags), step=tolong(Labels.step), wall_time=Timestamp, value=todouble(Value)
            | project exported_at=Timestamp, workspace_id, cluster, source_store_id, metric_file_id, metric_file_path, ['project'], experiment_id, run_group_id, run_id, metric_name, step, wall_time, value, unit, source, split, tags
            }

  - it: should suppress experiment-metrics-dashboard-rows when functions.enabled is false
    template: templates/functions/experiment-metrics-dashboard-rows.yaml
    set:
      functions.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should suppress experiment-metrics-dashboard-rows when item is disabled
    template: templates/functions/experiment-metrics-dashboard-rows.yaml
    set:
      functions.items.experimentMetricsDashboardRows.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # ── Cross-cutting ──────────────────────────────────────────
  - it: should set correct labels on all Function CRs
    template: templates/functions/gpu-health.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: function
      - isNotEmpty:
          path: metadata.labels["app.kubernetes.io/name"]
      - isNotEmpty:
          path: metadata.labels["app.kubernetes.io/instance"]

  - it: should use custom namespace when set
    template: templates/functions/gpu-health.yaml
    set:
      global.namespace: custom-ns
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-ns

  - it: should allow database override per function
    template: templates/functions/gpu-health.yaml
    set:
      functions.items.gpuHealth.database: CustomMetricsDB
    asserts:
      - equal:
          path: spec.database
          value: "CustomMetricsDB"

  # ── AuditEvents function ────────────────────────────────────
  - it: audit-events function renders with default values
    template: templates/functions/audit-events.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Function
      - equal:
          path: spec.database
          value: "Audit"

  - it: audit-events function renders when enabled
    template: templates/functions/audit-events.yaml
    set:
      functions.items.auditEvents.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Function
      - equal:
          path: spec.database
          value: "Audit"
      - matchRegex:
          path: spec.body
          pattern: "AuditEvents"
      - matchRegex:
          path: spec.body
          pattern: "KubeAuditLogs"
      - matchRegex:
          path: spec.body
          pattern: 'RawData\.records'
      - notMatchRegex:
          path: spec.body
          pattern: 'parse_json\(records\)'

  - it: audit-events function uses configured database
    template: templates/functions/audit-events.yaml
    set:
      functions.items.auditEvents.enabled: true
      functions.items.auditEvents.database: CustomAudit
    asserts:
      - equal:
          path: spec.database
          value: "CustomAudit"

  - it: audit-events function suppressed when functions.enabled=false
    template: templates/functions/audit-events.yaml
    set:
      functions.enabled: false
      functions.items.auditEvents.enabled: true
    asserts:
      - hasDocuments:
          count: 0
