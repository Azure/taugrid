    template: templates/functions/xid-errors.yaml
    asserts:
      - isKind:
          of: Function
      - equal:
          path: metadata.name
          value: adx-mon-xid-errors
      - equal:
          path: spec.database
          value: "Logs"
      - matchRegex:
          path: spec.body
          pattern: "XidErrors"

  - it: should suppress xid-errors when functions.enabled is false
    template: templates/functions/xid-errors.yaml
    set:
      functions.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should suppress xid-errors when item is disabled
    template: templates/functions/xid-errors.yaml
    set:
      functions.items.xidErrors.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # ── training-job-summary ───────────────────────────────────
  - it: should render training-job-summary Function CR
    template: templates/functions/training-job-summary.yaml
    asserts:
      - isKind:
          of: Function
      - equal:
          path: metadata.name
          value: adx-mon-training-job-summary
      - equal:
          path: spec.database
          value: "Metrics"
      - matchRegex:
          path: spec.body
          pattern: "TrainingJobSummary"
      - matchRegex:
          path: spec.body
          pattern: 'column_ifexists\("Cluster", ""\)'
      - matchRegex:
          path: spec.body
          pattern: "project Timestamp, Cluster=cluster"
      - matchRegex:
          path: spec.body
          pattern: "nvidia_com_gpu"

  - it: should suppress training-job-summary when functions.enabled is false
    template: templates/functions/training-job-summary.yaml
    set:
      functions.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should suppress training-job-summary when item is disabled
    template: templates/functions/training-job-summary.yaml
