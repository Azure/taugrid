suite: operator templates
templates:
  - operator/deployment.yaml
  - operator/serviceaccount.yaml
  - operator/clusterrole.yaml
  - operator/clusterrolebinding.yaml

tests:

  # ── Deployment ────────────────────────────────────────────────────
  - it: renders operator Deployment by default
    template: operator/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-adx-mon-operator

  - it: does not render Deployment when operator.enabled is false
    template: operator/deployment.yaml
    set:
      operator.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: uses correct image with appVersion fallback
    template: operator/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: mcr.microsoft.com/aks/ai-runtime/adx-mon/operator:v0.3.0

  - it: uses explicit image tag when set
    template: operator/deployment.yaml
    set:
      operator.image.tag: "v1.0.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: mcr.microsoft.com/aks/ai-runtime/adx-mon/operator:v1.0.0

  - it: applies pod security context
    template: operator/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: false
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: applies container security context
    template: operator/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: sets component selector labels on pods
    template: operator/deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: operator
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: adx-mon

  - it: selector matches pod labels
    template: operator/deployment.yaml
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: operator
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: adx-mon

  - it: sets resource requests and limits
    template: operator/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi

  - it: includes cluster-labels args when global names are set
    template: operator/deployment.yaml
    set:
      global.clusterName: my-cluster
      global.region: eastus2
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cluster-labels=cluster=my-cluster
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cluster-labels=region=eastus2

  - it: omits cluster-labels args when global names are empty
    template: operator/deployment.yaml
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].args

  - it: mounts CA certificate volumes
    template: operator/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /etc/ssl/certs
            name: ca-certs
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ca-certs
            hostPath:
              path: /etc/ssl/certs
              type: Directory

  - it: applies tolerations from values
    template: operator/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: CriticalAddonsOnly
            operator: Exists

  - it: uses release namespace
    template: operator/deployment.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: NAMESPACE

  - it: uses custom namespace when set
    template: operator/deployment.yaml
    set:
      global.namespace: custom-ns
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-ns

  - it: keeps log annotations but does not opt into metrics scraping
    template: operator/deployment.yaml
    asserts:
      - isNull:
          path: spec.template.metadata.annotations["adx-mon/scrape"]
      - isNull:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
      - equal:
          path: spec.template.metadata.annotations["adx-mon/log-destination"]
          value: "Logs:Operator"

  - it: does not expose ports or health probes (no listener; needs upstream changes for AKS Automatic)
    template: operator/deployment.yaml
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].ports
      - isNull:
          path: spec.template.spec.containers[0].livenessProbe
      - isNull:
          path: spec.template.spec.containers[0].readinessProbe

  - it: ClusterRole has read-only RBAC permissions
    template: operator/clusterrole.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [rbac.authorization.k8s.io]
            resources: [clusterroles, clusterrolebindings]
            verbs: [get, list, watch]

  - it: ClusterRole has events create/patch for controller-runtime
    template: operator/clusterrole.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [events]
            verbs: [create, patch]

    # ── ServiceAccount ────────────────────────────────────────────────
  - it: renders operator ServiceAccount
    template: operator/serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-adx-mon-operator
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: does not render ServiceAccount when disabled
    template: operator/serviceaccount.yaml
    set:
      operator.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # ── ClusterRole ────────────────────────────────────────────────
  - it: renders operator ClusterRole with CRD permissions
    template: operator/clusterrole.yaml
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: RELEASE-NAME-adx-mon-operator

  - it: ClusterRole includes adx-mon.azure.com API group
    template: operator/clusterrole.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [adx-mon.azure.com]
            resources:
              - adxclusters
              - alerters
              - alertrules
              - collectors
              - functions
              - ingestors
              - managementcommands
              - metricsexporters
              - summaryrules
            verbs: [get, list, watch, create, update, patch, delete]

  # ── ClusterRoleBinding ────────────────────────────────────────────
  - it: renders operator ClusterRoleBinding
    template: operator/clusterrolebinding.yaml
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-adx-mon-operator
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-adx-mon-operator
      - equal:
          path: subjects[0].namespace
          value: NAMESPACE
