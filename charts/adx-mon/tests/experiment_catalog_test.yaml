suite: Experiment catalog v1
templates:
  - templates/management-commands/experiment-catalog-v1.yaml
  - templates/functions/tau-exp-series-catalog-rows.yaml
  - templates/functions/tau-exp-run-catalog-rows.yaml
tests:
  - it: suppresses the physical catalog by default
    template: templates/management-commands/experiment-catalog-v1.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: creates legacy physical catalogs without implicit backfill
    template: templates/management-commands/experiment-catalog-v1.yaml
    set:
      managementCommands.experimentCatalogV1.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ManagementCommand
      - equal:
          path: spec.database
          value: Metrics
      - matchRegex:
          path: spec.body
          pattern: '\.create ifnotexists materialized-view TauExpSeriesCatalogV1'
      - matchRegex:
          path: spec.body
          pattern: '\.create ifnotexists materialized-view TauExpMetricRunCatalogV1'
      - matchRegex:
          path: spec.body
          pattern: '\.create ifnotexists materialized-view TauExpLifecycleRunCatalogV1'
      - matchRegex:
          path: spec.body
          pattern: 'TauExpSeriesCatalogV1 on table ExperimentMetrics'
      - matchRegex:
          path: spec.body
          pattern: 'TauExpMetricRunCatalogV1 on table ExperimentMetrics'
      - matchRegex:
          path: spec.body
          pattern: 'TauExpLifecycleRunCatalogV1 on table TauExpRunLifecycle'
      - notMatchRegex:
          path: spec.body
          pattern: '\.alter-merge table TauExp(Series|MetricRun|TypedSeries|TypedMetricRun|LifecycleRun)CatalogV1 policy retention'
      - notMatchRegex:
          path: spec.body
          pattern: 'backfill=true'
      - notMatchRegex:
          path: spec.body
          pattern: 'TauExpTypedSeriesCatalogV1'
      - notMatchRegex:
          path: spec.body
          pattern: 'update policy'

  - it: uses verified async materialized view syntax only when backfill is enabled
    template: templates/management-commands/experiment-catalog-v1.yaml
    set:
      managementCommands.experimentCatalogV1.enabled: true
      managementCommands.experimentCatalogV1.backfillEnabled: true
    asserts:
      - matchRegex:
          path: spec.body
          pattern: '\.create async ifnotexists materialized-view with \(backfill=true\) TauExpSeriesCatalogV1'
      - matchRegex:
          path: spec.body
          pattern: '\.create async ifnotexists materialized-view with \(backfill=true\) TauExpMetricRunCatalogV1'
      - matchRegex:
          path: spec.body
          pattern: '\.create async ifnotexists materialized-view with \(backfill=true\) TauExpLifecycleRunCatalogV1'
      - notMatchRegex:
          path: spec.body
          pattern: '\.create async ifnotexists materialized-view TauExp'

  - it: creates both physical metric catalogs for dual shadow delivery
    template: templates/management-commands/experiment-catalog-v1.yaml
    set:
      managementCommands.experimentCatalogV1.enabled: true
      functions.experimentCatalogSource: dual
    asserts:
      - matchRegex:
          path: spec.body
          pattern: 'TauExpSeriesCatalogV1 on table ExperimentMetrics'
      - matchRegex:
          path: spec.body
          pattern: 'TauExpTypedSeriesCatalogV1 on table TauExpMetricEventsV1'
      - matchRegex:
          path: spec.body
          pattern: 'TauExpMetricRunCatalogV1 on table ExperimentMetrics'
      - matchRegex:
          path: spec.body
          pattern: 'TauExpTypedMetricRunCatalogV1 on table TauExpMetricEventsV1'

  - it: creates only typed metric catalogs after cutover
    template: templates/management-commands/experiment-catalog-v1.yaml
    set:
      managementCommands.experimentCatalogV1.enabled: true
      functions.experimentCatalogSource: typed
    asserts:
      - matchRegex:
          path: spec.body
          pattern: 'TauExpTypedSeriesCatalogV1 on table TauExpMetricEventsV1'
      - notMatchRegex:
          path: spec.body
          pattern: 'TauExpSeriesCatalogV1 on table ExperimentMetrics'
      - matchRegex:
          path: spec.body
          pattern: 'TauExpLifecycleRunCatalogV1 on table TauExpRunLifecycle'

  - it: uses dynamic metric labels and monotonic lifecycle buckets
    template: templates/management-commands/experiment-catalog-v1.yaml
    set:
      managementCommands.experimentCatalogV1.enabled: true
    asserts:
      - matchRegex:
          path: spec.body
          pattern: 'coalesce\(tostring\(Labels.experiment_id\), tostring\(Labels.question_id\),'
      - matchRegex:
          path: spec.body
          pattern: "is_terminal_marker = metric_name == 'tau/run_status' and status_state in"
      - matchRegex:
          path: spec.body
          pattern: "is_terminal = tolower\\(state\\) in \\('succeeded', 'failed', 'cancelled'\\)"
      - matchRegex:
          path: spec.body
          pattern: 'by lifecycle_cluster = cluster, lifecycle_namespace = namespace, durable_identity, is_terminal'
      - matchRegex:
          path: spec.body
          pattern: "run_group_id, run_id, metric_name\\n"
      - notMatchRegex:
          path: spec.body
          pattern: 'run_id, metric_name, unit, source, split'

  - it: suppresses stable catalog functions by default
    template: templates/functions/tau-exp-series-catalog-rows.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the typed stable series function
    template: templates/functions/tau-exp-series-catalog-rows.yaml
    set:
      functions.items.tauExpSeriesCatalogRows.enabled: true
    asserts:
      - isKind:
          of: Function
      - equal:
          path: spec.database
          value: Metrics
      - matchRegex:
          path: spec.body
          pattern: 'TauExpSeriesCatalogRows\(\)'
      - matchRegex:
          path: spec.body
          pattern: "catalog_version = 'v1'"
      - matchRegex:
          path: spec.body
          pattern: 'latest_step = tolong\(step_value\)'
      - matchRegex:
          path: spec.body
          pattern: 'latest_value = todouble\(metric_value\)'
      - matchRegex:
          path: spec.body
          pattern: 'summarize[\s\S]*by workspace_id, cluster, source_store_id, \['

  - it: unions and deduplicates legacy and typed series during shadow delivery
    template: templates/functions/tau-exp-series-catalog-rows.yaml
    set:
      functions.items.tauExpSeriesCatalogRows.enabled: true
      functions.experimentCatalogSource: dual
    asserts:
      - matchRegex:
          path: spec.body
          pattern: 'let legacy_rows'
      - matchRegex:
          path: spec.body
          pattern: 'let typed_rows'
      - matchRegex:
          path: spec.body
          pattern: 'union legacy_rows, typed_rows'
      - matchRegex:
          path: spec.body
          pattern: "by workspace_id, cluster, source_store_id, \\['project'\\], experiment_id"

  - it: renders typed-only stable series after cutover
    template: templates/functions/tau-exp-series-catalog-rows.yaml
    set:
      functions.items.tauExpSeriesCatalogRows.enabled: true
      functions.experimentCatalogSource: typed
    asserts:
      - matchRegex:
          path: spec.body
          pattern: 'let typed_rows'
      - notMatchRegex:
          path: spec.body
          pattern: 'TauExpSeriesCatalogV1'
      - notMatchRegex:
          path: spec.body
          pattern: 'union legacy_rows'

  - it: renders the full outer stable run function
    template: templates/functions/tau-exp-run-catalog-rows.yaml
    set:
      functions.items.tauExpRunCatalogRows.enabled: true
    asserts:
      - isKind:
          of: Function
      - matchRegex:
          path: spec.body
          pattern: 'TauExpRunCatalogRows\(\)'
      - matchRegex:
          path: spec.body
          pattern: 'experiment_id_count = dcount\(experiment_id\)'
      - matchRegex:
          path: spec.body
          pattern: 'iff\(experiment_id_count == 1, candidate_experiment_id,'
      - matchRegex:
          path: spec.body
          pattern: 'join kind=fullouter lifecycle_runs'
      - matchRegex:
          path: spec.body
          pattern: 'lifecycle_is_terminal, lifecycle_state'
      - matchRegex:
          path: spec.body
          pattern: "catalog_version = 'v1'"
      - matchRegex:
          path: spec.body
          pattern: 'metric_series_count'
      - matchRegex:
          path: spec.body
          pattern: "TauExpSeriesCatalogRows\\(\\)[\\s\\S]*metric_name != 'tau/run_status'"
      - matchRegex:
          path: spec.body
          pattern: 'has_metrics = isnotnull\(metric_latest_time\)'
      - matchRegex:
          path: spec.body
          pattern: 'join kind=fullouter lifecycle_runs on workspace_id, cluster'
      - matchRegex:
          path: spec.body
          pattern: 'experiment_tracking'

  - it: unions and deduplicates metric run evidence during shadow delivery
    template: templates/functions/tau-exp-run-catalog-rows.yaml
    set:
      functions.items.tauExpRunCatalogRows.enabled: true
      functions.experimentCatalogSource: dual
    asserts:
      - matchRegex:
          path: spec.body
          pattern: 'union legacy_metric_runs, typed_metric_runs'
      - matchRegex:
          path: spec.body
          pattern: 'metric_first_time = min\(metric_first_time\)'
      - matchRegex:
          path: spec.body
          pattern: 'lifecycle_is_terminal, lifecycle_state'

  - it: renders typed-only metric run evidence after cutover
    template: templates/functions/tau-exp-run-catalog-rows.yaml
    set:
      functions.items.tauExpRunCatalogRows.enabled: true
      functions.experimentCatalogSource: typed
    asserts:
      - matchRegex:
          path: spec.body
          pattern: 'TauExpTypedMetricRunCatalogV1'
      - notMatchRegex:
          path: spec.body
          pattern: 'TauExpMetricRunCatalogV1'
      - notMatchRegex:
          path: spec.body
          pattern: 'union legacy_metric_runs'

  - it: suppresses run catalog when functions are globally disabled
    template: templates/functions/tau-exp-run-catalog-rows.yaml
    set:
      functions.enabled: false
      functions.items.tauExpRunCatalogRows.enabled: true
    asserts:
      - hasDocuments:
          count: 0
