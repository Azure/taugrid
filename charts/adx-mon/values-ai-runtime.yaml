adx:
  configMapRef: adx-mon-cluster-config

collector:
  gpu:
    dcgmScrape: true
    kernelTarget: true

  journalLogs:
    targets:
      - matches: ['_SYSTEMD_UNIT=kubelet.service']
        database: Logs
        table: Kubelet
      - matches: ['_SYSTEMD_UNIT=containerd.service']
        database: Logs
        table: ContainerRuntime

  containerLogs:
    enabled: true
    targets:
      - namespace: kuberay-system
        labels:
          app.kubernetes.io/name: kuberay-operator
        destination: "Logs:SystemLogs"
        parsers: ["json"]

      - namespace: kueue-system
        labels:
          app.kubernetes.io/name: kueue
        destination: "Logs:SystemLogs"
        parsers: ["json"]

      - labels:
          app.kubernetes.io/name: dcgm-exporter
        destination: "Logs:SystemLogs"
        parsers: ["json"]

      - labels:
          tau.azure.com/managed-by: "tau"
        destination: "Logs:ContainerLogs"
        parsers: ["json"]

      - labels:
          ray.io/is-ray-node: "yes"
        destination: "Logs:ContainerLogs"
        parsers: ["json"]

  prometheusScrape:
    extraStaticTargets: []

functions:
  enabled: true

alertRules:
  enabled: true

operator:
  nodeSelector:
    kubernetes.azure.com/mode: system

ingestor:
  nodeSelector:
    kubernetes.azure.com/mode: system

alerter:
  nodeSelector:
    kubernetes.azure.com/mode: system

collectorSingleton:
  nodeSelector:
    kubernetes.azure.com/mode: system

kube-state-metrics:
  nodeSelector:
    kubernetes.azure.com/mode: system

managementCommands:
  precreateMetricsTables:
    enabled: true
  precreateLogsTables:
    enabled: true
  ingestionBatching:
    enabled: true
  retentionPolicies:
    enabled: true
