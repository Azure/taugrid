    ib_devices: "mlx5_0:1 mlx5_1:1 mlx5_2:1 mlx5_5:1 mlx5_6:1 mlx5_7:1 mlx5_8:1 mlx5_9:1"
    ib_pkey: "0x8003"
    ib_flap_threshold_short: 2
    ib_flap_check_window: 3600
    nvme_total: 0
    nvme_size_count: 0
    nvme_size: "0"
    imex_procname: "imex"
