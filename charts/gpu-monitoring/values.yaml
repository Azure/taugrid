image:
  repository: mcr.microsoft.com/oss/kubernetes/node-problem-detector
  tag: v0.8.19
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

namespace: ""
labels: {}

npdPort: 20260

ibPkey: "0xffff"

env: []
extraArgs: []

serviceAccount:
  create: true
  name: gpu-monitoring

rbac:
  create: true
  name: gpu-monitoring

daemonset:
  hostNetwork: true
  hostPID: true
  tolerations:
    - operator: Exists
  nodeSelector: {}
  requireAcceleratorLabel: false
  instanceTypeLabelKeys:
    - node.kubernetes.io/instance-type
  topologySpreadConstraints: []

securityContext:
  privileged: true

resources: {}

configMap:
  name: gpu-monitoring-gpu

monitors:
  customPluginMonitor: true
  systemLogMonitor: true
  systemStatsMonitor: true
  kernelMonitor: false

volumes:
  dev:
    hostPath: /dev
  kmsg:
    hostPath: /dev/kmsg
  log:
    hostPath: /var/log
  localtime:
    hostPath: /etc/localtime

nodeTainter:
  enabled: true

nodeExporter:
  enabled: true
  image:
    repository: mcr.microsoft.com/oss/prometheus/node-exporter
    tag: v1.8.2
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

dcgmHealth:
  source: host-dcgmi
  exporterUrl: http://localhost:19400/metrics

dcgmExporterMetrics:
  enabled: false
  name: gpu-monitoring-dcgm-metrics
  namespace: gpu-operator

metricsCollector:
  enabled: true
  image:
    repository: mcr.microsoft.com/aks/ai-runtime/gpu-metrics-collector
    tag: ""
    digest: sha256:233aba6519e39d9a65069ba168a4cef0aed45a3ebe3080f14d3d0b98dd1076ef
  scrapeInterval: "15s"
  extendedHealthChecks: false
  requireMetricCoverage: false
  resources:
    requests:
      cpu: "2m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "512Mi"
  npdScrape: true
  rules:
    - name: ecc-dbe-retired
      extended: true
      perGpu: true
      metricName: DCGM_FI_DEV_RETIRED_DBE
      conditionType: GPUECCDoubleRetired
      mode: rate
      threshold: 0
      window: 1m
      for: 1m
    - name: ecc-dbe-volatile
      extended: true
      perGpu: true
      metricName: DCGM_FI_DEV_ECC_DBE_VOL_TOTAL
      conditionType: GPUECCDoubleVolatile
      mode: rate
      threshold: 0
      window: 1m
      for: 1m
    - name: nvlink-replay
      extended: true
      perGpu: true
      metricName: DCGM_FI_DEV_NVLINK_REPLAY_ERROR_COUNT_TOTAL
      conditionType: GPUNVLinkReplayErrors
      mode: rate
      threshold: 0
      window: 1m
      for: 1m
    - name: xid-48
      metricName: DCGM_FI_DEV_XID_ERRORS
      labels:
        err_code: "48"
      conditionType: XIDError48
      mode: instant
      threshold: 0
    - name: xid-63
      metricName: DCGM_FI_DEV_XID_ERRORS
      labels:
        err_code: "63"
      conditionType: XIDError63
      mode: instant
      threshold: 0
    - name: xid-64
      metricName: DCGM_FI_DEV_XID_ERRORS
      labels:
        err_code: "64"
      conditionType: XIDError64
      mode: instant
      threshold: 0
    - name: xid-79
      metricName: DCGM_FI_DEV_XID_ERRORS
      labels:
        err_code: "79"
      conditionType: XIDError79
      mode: instant
      threshold: 0
    - name: xid-94
      metricName: DCGM_FI_DEV_XID_ERRORS
      labels:
        err_code: "94"
      conditionType: XIDError94
      mode: instant
      threshold: 0
    - name: xid-95
      metricName: DCGM_FI_DEV_XID_ERRORS
      labels:
        err_code: "95"
      conditionType: XIDError95
      mode: instant
      threshold: 0
    - name: ib-link-down
      metricName: node_infiniband_link_downed_total
      conditionType: IBLinkDown
      mode: rate
      threshold: 0
      window: 1m
      for: 1m
    - name: ib-symbol-error
      metricName: node_infiniband_symbol_error_total
      conditionType: IBSymbolError
      mode: rate
      threshold: 0
      window: 1m
      for: 1m
    - name: ecc-sbe-volatile-rate
      extended: true
      perGpu: true
      metricName: DCGM_FI_DEV_ECC_SBE_VOL_TOTAL
      conditionType: GPUECCSingleVolatileRate
      mode: rate
      threshold: 10
      window: 10m
      for: 5m
    - name: ecc-sbe-retired
      extended: true
      perGpu: true
      metricName: DCGM_FI_DEV_RETIRED_SBE
      conditionType: GPUECCSingleRetired
      mode: rate
      threshold: 0
      window: 5m
      for: 5m
    - name: pcie-replay
      perGpu: true
      metricName: DCGM_FI_DEV_PCIE_REPLAY_COUNTER
      conditionType: GPUPCIeReplayErrors
      mode: rate
      threshold: 5
      window: 5m
      for: 5m
    - name: grace-cpu-ecc-uncorrectable
      extended: true
      metricName: node_memory_ECC_uncorrectable_total
      conditionType: GraceCPUECCUncorrectable
      mode: instant
      threshold: 0
      for: 1m
    - name: grace-cpu-ecc-correctable-rate
      extended: true
      metricName: node_memory_ECC_correctable_total
      conditionType: GraceCPUECCCorrectableRate
      mode: rate
      threshold: 10
      window: 10m
      for: 5m

