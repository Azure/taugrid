suite: GPU monitoring DaemonSet wiring
templates:
  - daemonset.yaml

tests:
  - it: renders one DaemonSet per SKU (13 by default)
    asserts:
      - hasDocuments:
          count: 13

  - it: a100 DaemonSet includes NPD, node-exporter, and metrics-collector containers (no bundled dcgm-exporter)
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-a100
    asserts:
      - isKind:
          of: DaemonSet
      - contains:
          path: spec.template.spec.containers
          content:
            name: gpu-monitoring
          any: true
      - notContains:
          path: spec.template.spec.containers
          content:
            name: dcgm-exporter
          any: true
      - contains:
          path: spec.template.spec.containers
          content:
            name: node-exporter
          any: true
      - contains:
          path: spec.template.spec.containers
          content:
            name: metrics-collector
          any: true

  - it: spark DaemonSet has no dcgm-exporter, keeps node-exporter (same as every other SKU)
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-spark
    asserts:
      - notContains:
          path: spec.template.spec.containers
          content:
            name: dcgm-exporter
          any: true
      - contains:
          path: spec.template.spec.containers
          content:
            name: node-exporter
          any: true
      - contains:
          path: spec.template.spec.containers
          content:
            name: metrics-collector
          any: true

  - it: spark DaemonSet targets the one-GPU A10 instance types
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-spark
    asserts:
      - contains:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions
          content:
            key: node.kubernetes.io/instance-type
            operator: In
            values:
              - Standard_NV6ads_A10_v5
              - Standard_NV12ads_A10_v5
              - Standard_NV18ads_A10_v5
              - Standard_NV36ads_A10_v5
              - Standard_NV36adms_A10_v5
          any: true

  - it: GB300 uses Blackwell checks with an 800-Gbps InfiniBand expectation
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-gb300
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --config.custom-plugin-monitor=/custom-config/custom-plugin-monitor-gb200.json
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXPECTED_IB_GBPS
            value: "800"
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GPU_TYPE
            value: GB300
          any: true

  - it: GB200 retains its 400-Gbps InfiniBand expectation
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-gb200
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXPECTED_IB_GBPS
            value: "400"
          any: true

  - it: A100 preserves its historical 200-Gbps and PKey expectations
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-a100
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXPECTED_IB_GBPS
            value: "200"
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
             name: EXPECTED_IB_PKEY
             value: "0x8003"
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
             name: CREATE_IMEX_CHANNEL_EXPECTED
             value: "0"
          any: true

  - it: profiles without an explicit CreateImexChannel0 contract preserve legacy behavior
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-gb200
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
             name: CREATE_IMEX_CHANNEL_EXPECTED
          any: true

  - it: H200 does not configure the A100-specific driver expectation
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-h200
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CREATE_IMEX_CHANNEL_EXPECTED
          any: true

  - it: invalid CreateImexChannel0 expectations fail before deployment
    set:
      gpuSkus.a100.create_imex_channel_expected: "2"
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.a100.create_imex_channel_expected must be quoted "0" or "1"; omit the field to preserve the legacy contract; got 2'

  - it: unquoted CreateImexChannel0 expectations fail before deployment
    set:
      gpuSkus.a100.create_imex_channel_expected: 0
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.a100.create_imex_channel_expected must be quoted "0" or "1"; omit the field to preserve the legacy contract; got 0'

  - it: H200 defaults to the East US 2 PKey
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-h200
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
             name: EXPECTED_IB_PKEY
             value: "0x8001"
          any: true

  - it: H200 expects the verified Hopper VBIOS
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-h200
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
             name: VBIOS_VERSIONS
             value: '("96.00.BC.00.02")'
          any: true

  - it: H200 PKey is deployment-overridable for Flex
    set:
      gpuSkus.h200.ib_pkey: "0xffff"
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-h200
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
             name: EXPECTED_IB_PKEY
             value: "0xffff"
          any: true

  - it: unquoted hexadecimal PKeys are rejected before deployment
    set:
      gpuSkus.h200.ib_pkey: 32769
    asserts:
      - failedTemplate:
          errorPattern: 'gpuSkus\.h200\.ib_pkey must be a quoted four-digit hexadecimal PKey'

  - it: malformed PKeys are rejected before deployment
    set:
      gpuSkus.h200.ib_pkey: "8001"
    asserts:
      - failedTemplate:
          errorPattern: 'gpuSkus\.h200\.ib_pkey must be a quoted four-digit hexadecimal PKey'

  - it: enabledGpuSkus can render only H200
    set:
      enabledGpuSkus[0]: h200
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: gpu-monitoring-h200

  - it: enabledGpuSkus rejects unknown profiles
    set:
      enabledGpuSkus[0]: h20o
    asserts:
      - failedTemplate:
          errorMessage: 'enabledGpuSkus contains unknown profile "h20o"'

  - it: enabledGpuSkus rejects a null selected profile
    values:
      - custom-profile-null-values.yaml
    asserts:
      - failedTemplate:
          errorMessage: 'enabledGpuSkus profile "custom" must resolve to a non-empty map'

  - it: enabledGpuSkus rejects an empty selected profile
    values:
      - custom-profile-empty-values.yaml
    asserts:
      - failedTemplate:
          errorMessage: 'enabledGpuSkus profile "custom" must resolve to a non-empty map'

  - it: selected profiles require instanceTypes
    values:
      - custom-profile-instance-types-missing-values.yaml
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.custom.instanceTypes must be a non-empty list of non-empty strings'

  - it: selected profiles reject empty instanceTypes
    values:
      - custom-profile-instance-types-empty-values.yaml
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.custom.instanceTypes must be a non-empty list of non-empty strings'

  - it: selected profiles reject non-list instanceTypes
    values:
      - custom-profile-instance-types-invalid-values.yaml
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.custom.instanceTypes must be a non-empty list of non-empty strings'

  - it: selected profiles reject empty-string instanceTypes
    values:
      - custom-profile-instance-types-empty-string-values.yaml
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.custom.instanceTypes must be a non-empty list of non-empty strings'

  - it: selected profiles require a numeric GPU count
    values:
      - custom-profile-minimal-values.yaml
    set:
      gpuSkus.custom.num_gpus: true
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.custom.num_gpus must be a nonnegative integer'

  - it: selected profiles require monitor_config
    values:
      - custom-profile-monitor-config-missing-values.yaml
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.custom.monitor_config must name a bundled custom-plugin monitor config'

  - it: selected profiles reject null monitor_config
    values:
      - custom-profile-minimal-values.yaml
    set:
      gpuSkus.custom.monitor_config: null
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.custom.monitor_config must name a bundled custom-plugin monitor config'

  - it: selected profiles reject empty monitor_config
    values:
      - custom-profile-minimal-values.yaml
    set:
      gpuSkus.custom.monitor_config: ""
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.custom.monitor_config must name a bundled custom-plugin monitor config'

  - it: selected profiles reject non-string monitor_config
    values:
      - custom-profile-minimal-values.yaml
    set:
      gpuSkus.custom.monitor_config: true
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.custom.monitor_config must name a bundled custom-plugin monitor config'

  - it: selected profiles reject unknown monitor_config
    values:
      - custom-profile-minimal-values.yaml
    set:
      gpuSkus.custom.monitor_config: unknown-monitor.json
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.custom.monitor_config must name a bundled custom-plugin monitor config'

  - it: selected profiles reject monitor_config path traversal
    values:
      - custom-profile-minimal-values.yaml
    set:
      gpuSkus.custom.monitor_config: ../custom-plugin-monitor-spark.json
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.custom.monitor_config must name a bundled custom-plugin monitor config'

  - it: a minimal custom profile renders exactly one DaemonSet
    values:
      - custom-profile-minimal-values.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: gpu-monitoring-custom

  - it: a dotted custom profile name remains valid
    values:
      - custom-profile-dotted-values.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: gpu-monitoring-custom.gpu

  - it: custom profiles without a PKey use the global fallback
    set:
      ibPkey: "0x8007"
      gpuSkus.h200.ib_pkey: null
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-h200
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
             name: EXPECTED_IB_PKEY
             value: "0x8007"
          any: true

  - it: both VBIOS checks are mounted, so GPUVbiosMismatch and GPUVbiosInconsistent can be reported independently
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-h200
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: custom-config
            mountPath: /custom-config/check_gpu_vbios.sh
            subPath: check_gpu_vbios.sh
            readOnly: true
          any: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: custom-config
            mountPath: /custom-config/check_gpu_vbios_consistency.sh
            subPath: check_gpu_vbios_consistency.sh
            readOnly: true
          any: true

  - it: every SKU mounts the VBIOS consistency check
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: custom-config
            mountPath: /custom-config/check_gpu_vbios_consistency.sh
            subPath: check_gpu_vbios_consistency.sh
            readOnly: true
          any: true

  - it: nodeExporter.enabled=false omits the node-exporter sidecar
    set:
      nodeExporter.enabled: false
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-a100
    asserts:
      - notContains:
          path: spec.template.spec.containers
          content:
            name: node-exporter
          any: true

  - it: metrics-collector sidecar mounts the per-SKU collector-config ConfigMap
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-a100
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: collector-config
            configMap:
              name: gpu-monitoring-gpu-metrics-collector-a100
          any: true

  - it: collector configuration is hashed into the pod template
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-a100
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/metrics-collector-config"]
          value: 7a683260ac52258d9134ee7d08bf6791e3d445eb24fd845473f1feaceb79a6be

  - it: per-profile scrape target changes update only that profile checksum
    values:
      - mixed-dcgm-values.yaml
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-h200
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/metrics-collector-config"]
          value: d23cdf182b434153a13bff355a82888884856889259806fc5259fe5bf9bb3179

  - it: GPU device-file and host DCGM health checks are required
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-a100
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NPD_GPU_REQUIRED
            value: "1"
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NPD_DCGM_REQUIRED
            value: "1"
          any: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: custom-config
            mountPath: /usr/local/bin/dcgmi
            subPath: dcgmi-wrapper.sh
            readOnly: true
          any: true
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: init-dcgm-health
          any: true
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value:
            - /custom-config/check-dcgm-watches.sh
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 2
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /custom-config/start-node-problem-detector.sh

  - it: exporter-source profiles do not require a host dcgmi binary
    values:
      - mixed-dcgm-values.yaml
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-h200
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NPD_DCGM_REQUIRED
            value: "0"
          any: true
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: init-dcgm-health
          any: true
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - matchRegex:
          path: spec.template.spec.containers[0].args[3]
          pattern: '^--config.custom-plugin-monitor=/custom-config/no-host-dcgm-monitor-[a-f0-9]{10}\.json$'

  - it: an invalid dcgmHealth.source fails before deployment
    set:
      enabledGpuSkus[0]: h200
      gpuSkus.h200.dcgmHealth.source: bogus
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.h200 effective dcgmHealth.source must be exactly one of "host-dcgmi" or "exporter"'

  - it: a null global dcgmHealth fails with a profile-scoped message, not a reflect panic
    set:
      enabledGpuSkus[0]: h200
      dcgmHealth: null
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.h200: global dcgmHealth must be a map with source and/or exporterUrl keys; got null'

  - it: a scalar global dcgmHealth fails with a profile-scoped message, not a reflect panic
    set:
      enabledGpuSkus[0]: h200
      dcgmHealth: bogus
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.h200: global dcgmHealth must be a map with source and/or exporterUrl keys; got string'

  - it: a null per-profile dcgmHealth fails with a profile-scoped message, not a reflect panic
    set:
      enabledGpuSkus[0]: h200
      gpuSkus.h200.dcgmHealth: null
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.h200.dcgmHealth must be a map with source and/or exporterUrl keys; got null'

  - it: a scalar per-profile dcgmHealth fails with a profile-scoped message, not a reflect panic
    set:
      enabledGpuSkus[0]: h200
      gpuSkus.h200.dcgmHealth: bogus
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.h200.dcgmHealth must be a map with source and/or exporterUrl keys; got string'

  - it: reserved DCGM runtime environment cannot override rendered lifecycle
    values:
      - reserved-dcgm-env-values.yaml
    asserts:
      - failedTemplate:
          errorMessage: 'env must not override reserved variable NPD_DCGM_REQUIRED'

  - it: production values cannot enable DCGM health simulation
    values:
      - reserved-dcgm-simulation-values.yaml
    asserts:
      - failedTemplate:
          errorMessage: 'env must not override reserved variable NPD_DCGM_SIMULATION'

  - it: production values cannot enable NVIDIA GPU simulation
    values:
      - reserved-gpu-simulation-values.yaml
    asserts:
      - failedTemplate:
          errorMessage: 'env must not override reserved variable NPD_GPU_SIMULATION'

  - it: host DCGM lifecycle requires hostPID true
    set:
      enabledGpuSkus[0]: a100
      daemonset.hostPID: false
    asserts:
      - failedTemplate:
          errorMessage: 'daemonset.hostPID must be boolean true when any GPU profile is enabled'

  - it: host-dcgmi source requires hostNetwork true
    set:
      enabledGpuSkus[0]: a100
      daemonset.hostNetwork: false
    asserts:
      - failedTemplate:
          errorMessage: 'daemonset.hostNetwork must be boolean true when an enabled profile uses dcgmHealth.source=host-dcgmi'

  - it: host DCGM lifecycle rejects string hostPID
    set:
      enabledGpuSkus[0]: a100
      daemonset.hostPID: "true"
    asserts:
      - failedTemplate:
          errorMessage: 'daemonset.hostPID must be boolean true when any GPU profile is enabled'

  - it: host-dcgmi source rejects string hostNetwork
    set:
      enabledGpuSkus[0]: a100
      daemonset.hostNetwork: "true"
    asserts:
      - failedTemplate:
          errorMessage: 'daemonset.hostNetwork must be boolean true when an enabled profile uses dcgmHealth.source=host-dcgmi'

  - it: host DCGM lifecycle rejects null hostPID
    set:
      enabledGpuSkus[0]: a100
      daemonset.hostPID: null
    asserts:
      - failedTemplate:
          errorMessage: 'daemonset.hostPID must be boolean true when any GPU profile is enabled'

  - it: host-dcgmi source rejects null hostNetwork
    set:
      enabledGpuSkus[0]: a100
      daemonset.hostNetwork: null
    asserts:
      - failedTemplate:
          errorMessage: 'daemonset.hostNetwork must be boolean true when an enabled profile uses dcgmHealth.source=host-dcgmi'

  - it: exporter-source profile still requires hostPID
    values:
      - mixed-dcgm-values.yaml
    set:
      enabledGpuSkus[0]: h200
      daemonset.hostPID: false
    asserts:
      - failedTemplate:
          errorMessage: 'daemonset.hostPID must be boolean true when any GPU profile is enabled'

  - it: exporter-source profile can disable hostNetwork
    values:
      - mixed-dcgm-values.yaml
    set:
      enabledGpuSkus[0]: h200
      daemonset.hostNetwork: false
      monitors.customPluginMonitor: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: gpu-monitoring-h200
      - equal:
          path: spec.template.spec.hostPID
          value: true
      - equal:
          path: spec.template.spec.hostNetwork
          value: false

  - it: exporter-source profile requires the metrics collector
    values:
      - mixed-dcgm-values.yaml
    set:
      enabledGpuSkus[0]: h200
      metricsCollector.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.h200 uses dcgmHealth.source=exporter and requires metricsCollector.enabled=true'

  - it: host-dcgmi source also requires the metrics collector
    set:
      enabledGpuSkus[0]: a100
      metricsCollector.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.a100 uses dcgmHealth.source=host-dcgmi and requires metricsCollector.enabled=true'

  - it: disabling the custom plugin monitor also disables the host dcgmi lifecycle
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-a100
    set:
      enabledGpuSkus[0]: a100
      monitors.customPluginMonitor: false
    asserts:
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: init-dcgm-health
          any: true
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --config.custom-plugin-monitor=/custom-config/custom-plugin-monitor.json

  - it: disabling the custom plugin monitor does not relax host-dcgmi hostNetwork
    set:
      enabledGpuSkus[0]: a100
      daemonset.hostNetwork: false
      monitors.customPluginMonitor: false
    asserts:
      - failedTemplate:
          errorMessage: 'daemonset.hostNetwork must be boolean true when an enabled profile uses dcgmHealth.source=host-dcgmi'

  - it: custom plugin monitor must be an actual boolean
    set:
      enabledGpuSkus[0]: a100
      monitors.customPluginMonitor: "true"
    asserts:
      - failedTemplate:
          errorMessage: 'monitors.customPluginMonitor must be a boolean'

  - it: exporter source rejects the inherited host-dcgmi loopback default
    set:
      enabledGpuSkus[0]: h200
      gpuSkus.h200.dcgmHealth.source: exporter
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.h200 dcgmHealth.source=exporter requires an explicit non-loopback dcgmHealth.exporterUrl; it must not inherit the host-dcgmi loopback default'

  - it: host-dcgmi source rejects a non-loopback exporterUrl
    set:
      enabledGpuSkus[0]: h200
      gpuSkus.h200.dcgmHealth.exporterUrl: http://nvidia-dcgm-exporter.gpu-operator.svc:9400/metrics
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.h200 dcgmHealth.source=host-dcgmi requires a loopback dcgmHealth.exporterUrl'

  - it: exporter source rejects another IPv4 loopback address
    set:
      enabledGpuSkus[0]: h200
      gpuSkus.h200.dcgmHealth.source: exporter
      gpuSkus.h200.dcgmHealth.exporterUrl: http://127.0.0.2:9400/metrics
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.h200 dcgmHealth.source=exporter requires an explicit non-loopback dcgmHealth.exporterUrl; it must not inherit the host-dcgmi loopback default'

  - it: exporter source rejects IPv6 loopback
    set:
      enabledGpuSkus[0]: h200
      gpuSkus.h200.dcgmHealth.source: exporter
      gpuSkus.h200.dcgmHealth.exporterUrl: http://[::1]:9400/metrics
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.h200 dcgmHealth.source=exporter requires an explicit non-loopback dcgmHealth.exporterUrl; it must not inherit the host-dcgmi loopback default'

  - it: a credentialed exporterUrl is rejected without echoing it
    set:
      enabledGpuSkus[0]: h200
      gpuSkus.h200.dcgmHealth.source: exporter
      gpuSkus.h200.dcgmHealth.exporterUrl: http://user:secret@dcgm-operator.svc:9400/metrics?token=abc
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.h200 effective dcgmHealth.exporterUrl must be a nonempty absolute lowercase http(s) URL without whitespace, backslashes, credentials, or URL suffix parameters'

  - it: an exporterUrl query string is rejected without echoing it
    set:
      enabledGpuSkus[0]: h200
      gpuSkus.h200.dcgmHealth.source: exporter
      gpuSkus.h200.dcgmHealth.exporterUrl: http://dcgm-operator.svc:9400/metrics?token=supersecret
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.h200 effective dcgmHealth.exporterUrl must be a nonempty absolute lowercase http(s) URL without whitespace, backslashes, credentials, or URL suffix parameters'

  - it: an exporterUrl fragment is rejected without echoing it
    set:
      enabledGpuSkus[0]: h200
      gpuSkus.h200.dcgmHealth.source: exporter
      gpuSkus.h200.dcgmHealth.exporterUrl: http://dcgm-operator.svc:9400/metrics#supersecret
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.h200 effective dcgmHealth.exporterUrl must be a nonempty absolute lowercase http(s) URL without whitespace, backslashes, credentials, or URL suffix parameters'

  - it: legacy gpuSkus.<profile>.scrapeTargets fails loud with a migration message
    set:
      enabledGpuSkus[0]: h200
      gpuSkus.h200.scrapeTargets[0].name: dcgm-exporter
      gpuSkus.h200.scrapeTargets[0].url: http://localhost:19400/metrics
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.h200.scrapeTargets was removed in gpu-monitoring 0.1.7; migrate to dcgmHealth.source and dcgmHealth.exporterUrl (see the README "DCGM health sources" section)'

  - it: legacy gpuSkus.<profile>.dcgm_health_required fails loud with a migration message
    set:
      gpuSkus.a100.dcgm_health_required: true
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.a100.dcgm_health_required was removed in gpu-monitoring 0.1.7; migrate to dcgmHealth.source and dcgmHealth.exporterUrl (see the README "DCGM health sources" section)'

  - it: spark DaemonSet mounts the spark per-SKU collector-config ConfigMap (not shared)
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-spark
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: collector-config
            configMap:
              name: gpu-monitoring-gpu-metrics-collector-spark
          any: true

  - it: metrics-collector sidecar has expected args
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-a100
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=="metrics-collector")].args[0]
          pattern: '--config=/etc/npd-metrics-collector/rules.yaml'
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=="metrics-collector")].args[1]
          pattern: '--scrape-interval=15s'

  - it: default affinity matches instance type without requiring the AKS accelerator label
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-a100
    asserts:
      - notContains:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions
          content:
            key: kubernetes.azure.com/accelerator
          any: true
      - contains:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions
          content:
            key: node.kubernetes.io/instance-type
            operator: In
            values:
              - Standard_ND96asr_v4
              - Standard_ND96amsr_A100_v4
          any: true

  - it: requireAcceleratorLabel=true restricts scheduling to AKS-managed GPU pools
    set:
      daemonset.requireAcceleratorLabel: true
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-a100
    asserts:
      - contains:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions
          content:
            key: kubernetes.azure.com/accelerator
            operator: In
            values:
              - nvidia
          any: true
      - contains:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions
          content:
            key: node.kubernetes.io/instance-type
            operator: In
            values:
              - Standard_ND96asr_v4
              - Standard_ND96amsr_A100_v4
          any: true

  - it: can target stretch-node instance type labels without the AKS accelerator label
    set:
      daemonset.requireAcceleratorLabel: false
      daemonset.instanceTypeLabelKeys[0]: aks.azure.com/instance-type
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-a100
    asserts:
      - notContains:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions
          content:
            key: kubernetes.azure.com/accelerator
          any: true
      - contains:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions
          content:
            key: aks.azure.com/instance-type
            operator: In
            values:
              - Standard_ND96asr_v4
              - Standard_ND96amsr_A100_v4
          any: true

  - it: nodeTainter.enabled=true adds tolerations for NoSchedule and NoExecute
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-a100
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            operator: Exists
            effect: NoSchedule
          any: true
      - contains:
          path: spec.template.spec.tolerations
          content:
            operator: Exists
            effect: NoExecute
          any: true

  - it: references the shared content-addressed executable Secret
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-a100
    asserts:
      - matchRegex:
          path: spec.template.spec.volumes[?(@.name=="custom-config")].secret.secretName
          pattern: '^gpu-monitoring-gpu-[a-f0-9]{10}$'
