suite: metrics-collector per-SKU ConfigMap
templates:
  - metrics-collector-configmap.yaml

tests:
  - it: renders one ConfigMap per SKU (13 by default)
    asserts:
      - hasDocuments:
          count: 13

  - it: enabledGpuSkus renders collector configuration only for selected profiles
    set:
      enabledGpuSkus[0]: h200
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: gpu-monitoring-gpu-metrics-collector-h200

  - it: a100 ConfigMap has the fixed dcgm-exporter, node-exporter, and NPD scrape targets
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-gpu-metrics-collector-a100
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'name: "dcgm-exporter"\s+url: "http://localhost:19400/metrics"\s+required: true\s+availabilityCondition: "DcgmExporterUnavailable"\s+unavailableFor: "2m"\s+availableFor: "1m"'
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'name: "node-exporter"\s+url: "http://localhost:9100/metrics"'
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'name: "node-problem-detector"\s+url: "http://localhost:20261/metrics"'

  - it: profiles use the global host-dcgmi localhost:19400 exporterUrl by default
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-gpu-metrics-collector-spark
    asserts:
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'name: "dcgm-exporter"\s+url: "http://localhost:19400/metrics"'

  - it: a per-profile dcgmHealth.source=exporter overrides the global exporterUrl
    values:
      - mixed-dcgm-values.yaml
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-gpu-metrics-collector-h200
    asserts:
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'name: "dcgm-exporter"\s+url: "http://nvidia-dcgm-exporter.gpu-operator.svc:9400/metrics"\s+required: true\s+availabilityCondition: "DcgmExporterUnavailable"\s+unavailableFor: "2m"\s+availableFor: "1m"'
      - notMatchRegex:
          path: data["rules.yaml"]
          pattern: 'http://localhost:19400/metrics'

  - it: a per-profile override does not leak into another profile
    values:
      - mixed-dcgm-values.yaml
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-gpu-metrics-collector-a100
    asserts:
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'name: "dcgm-exporter"\s+url: "http://localhost:19400/metrics"'

  - it: an invalid dcgmHealth.source fails to render
    set:
      enabledGpuSkus[0]: h200
      gpuSkus.h200.dcgmHealth.source: bogus
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.h200 effective dcgmHealth.source must be exactly one of "host-dcgmi" or "exporter"'

  - it: every accepted profile always renders the dcgm-exporter target and keeps every DCGM_* rule
    documentIndex: -1
    asserts:
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'name: "dcgm-exporter"\s+url: "[^"]+"\s+required: true\s+availabilityCondition: "DcgmExporterUnavailable"\s+unavailableFor: "2m"\s+availableFor: "1m"'
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'metricName: DCGM_FI_DEV_XID_ERRORS'
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'rules:\s*\n\s*- '

  - it: an exporter-source profile still renders the fixed dcgm-exporter target and every DCGM_* rule
    values:
      - mixed-dcgm-values.yaml
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-gpu-metrics-collector-h200
    asserts:
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'name: "dcgm-exporter"'
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'metricName: DCGM_FI_DEV_XID_ERRORS'

  - it: the fixed DcgmExporterUnavailable condition cannot collide with a collector rule
    set:
      enabledGpuSkus[0]: h200
      metricsCollector.rules[0].conditionType: DcgmExporterUnavailable
    asserts:
      - failedTemplate:
          errorMessage: 'gpuSkus.h200 cannot use conditionType "DcgmExporterUnavailable"; it is reserved for the chart-owned dcgm-exporter availability condition'

  - it: the availability condition never collides with the NPD dcgmi condition
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-gpu-metrics-collector-h100
    asserts:
      - notMatchRegex:
          path: data["rules.yaml"]
          pattern: 'availabilityCondition: "DcgmHealthProblem"'
      - notMatchRegex:
          path: data["rules.yaml"]
          pattern: 'conditionType: DcgmExporterUnavailable'

  - it: per-SKU nodeExporter=false drops the node-exporter target from that SKU's ConfigMap
    set:
      gpuSkus.a100.nodeExporter: false
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-gpu-metrics-collector-a100
    asserts:
      - notMatchRegex:
          path: data["rules.yaml"]
          pattern: 'name: "node-exporter"'

  - it: metricsCollector.nodeExporterScrape=true keeps node-exporter target when sidecar is disabled
    set:
      nodeExporter.enabled: false
      metricsCollector.nodeExporterScrape: true
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-gpu-metrics-collector-a100
    asserts:
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'name: "node-exporter"\s+url: "http://localhost:9100/metrics"'

  - it: metricsCollector.npdScrape=false omits the NPD target
    set:
      metricsCollector.npdScrape: false
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-gpu-metrics-collector-a100
    asserts:
      - notMatchRegex:
          path: data["rules.yaml"]
          pattern: 'node-problem-detector'

  - it: custom npdPort propagates (prometheus port = npdPort + 1)
    set:
      npdPort: 30000
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-gpu-metrics-collector-h100
    asserts:
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'name: "node-problem-detector"\s+url: "http://localhost:30001/metrics"'

  - it: metricsCollector.enabled=false renders no ConfigMaps
    set:
      metricsCollector.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: rules section is non-empty (ECC/NVLink/XID etc. all render)
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-gpu-metrics-collector-a100
    asserts:
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'ecc-dbe-retired'
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'DCGM_FI_DEV_XID_ERRORS'
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'DCGM_FI_DEV_NVLINK_CRC_FLIT_ERROR_COUNT_TOTAL'
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'metricName: node_infiniband_port_link_downed_total'
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'metricName: node_infiniband_port_symbol_error_total'
      - notMatchRegex:
          path: data["rules.yaml"]
          pattern: 'metricName: node_infiniband_(link_downed|symbol_error)_total'

  - it: all raw XID gauges use exporter err_code labels and instant thresholds
    documentSelector:
      path: metadata.name
      value: gpu-monitoring-gpu-metrics-collector-a100
    asserts:
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'conditionType: XIDError48\s+labels:\s+err_code: "48"\s+metricName: DCGM_FI_DEV_XID_ERRORS\s+mode: instant\s+name: xid-48\s+threshold: 0'
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'conditionType: XIDError63\s+labels:\s+err_code: "63"\s+metricName: DCGM_FI_DEV_XID_ERRORS\s+mode: instant\s+name: xid-63\s+threshold: 0'
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'conditionType: XIDError64\s+labels:\s+err_code: "64"\s+metricName: DCGM_FI_DEV_XID_ERRORS\s+mode: instant\s+name: xid-64\s+threshold: 0'
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'conditionType: XIDError79\s+labels:\s+err_code: "79"\s+metricName: DCGM_FI_DEV_XID_ERRORS\s+mode: instant\s+name: xid-79\s+threshold: 0'
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'conditionType: XIDError94\s+labels:\s+err_code: "94"\s+metricName: DCGM_FI_DEV_XID_ERRORS\s+mode: instant\s+name: xid-94\s+threshold: 0'
      - matchRegex:
          path: data["rules.yaml"]
          pattern: 'conditionType: XIDError95\s+labels:\s+err_code: "95"\s+metricName: DCGM_FI_DEV_XID_ERRORS\s+mode: instant\s+name: xid-95\s+threshold: 0'
      - notMatchRegex:
          path: data["rules.yaml"]
          pattern: '\bxid:'

  - it: two enabled profiles claiming one instance type fail to render
    set:
      gpuSkus.h200.instanceTypes[0]: Standard_ND96isr_H100_v5
    asserts:
      - failedTemplate:
          errorMessage: 'instance type "Standard_ND96isr_H100_v5" is claimed by profiles "h100" and "h200"; a node must run exactly one monitoring profile so its Node conditions have a single owner'

  - it: instance type overlap is detected regardless of spelling case
    set:
      gpuSkus.h200.instanceTypes[0]: standard_nd96isr_h100_v5
    asserts:
      - failedTemplate:
          errorMessage: 'instance type "standard_nd96isr_h100_v5" is claimed by profiles "h100" and "h200"; a node must run exactly one monitoring profile so its Node conditions have a single owner'

  - it: an overlap outside the enabled profile set does not block rendering
    set:
      enabledGpuSkus[0]: h200
      gpuSkus.h200.instanceTypes[0]: Standard_ND96isr_H100_v5
    asserts:
      - hasDocuments:
          count: 1
