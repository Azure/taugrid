{{- include "gpu-monitoring.validateEnabledGpuSkus" . }}
{{- if .Values.metricsCollector.enabled }}
{{- range $skuName, $sku := .Values.gpuSkus }}
{{- if and $sku (or (empty $.Values.enabledGpuSkus) (has $skuName $.Values.enabledGpuSkus)) }}
{{- $collectorConfig := include "gpu-monitoring.metricsCollectorConfig" (dict "root" $ "sku" $sku) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Values.configMap.name }}-metrics-collector-{{ $skuName }}
  namespace: {{ include "gpu-monitoring.namespace" $ }}
  labels:
    gpu-sku: {{ $skuName }}
data:
  rules.yaml: |
    {{- $collectorConfig | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
