trigger: none
pr: none

parameters:
  - name: releaseTag
    type: string
    default: ''
  - name: releaseSourceCommit
    type: string
    default: ''
  - name: releaseVersion
    type: string
    default: ''

pool:
  vmImage: ubuntu-latest

jobs:
  - job: VerifyRelease
    displayName: Verify published release (read only)
    timeoutInMinutes: 35
    steps:
      - checkout: self
        fetchDepth: 0
        fetchTags: true

      - bash: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          test -n "$RELEASE_SOURCE_COMMIT"
          test -n "$RELEASE_VERSION"
          python3 scripts/ci/verify-release-readiness.py \
            --tag "$RELEASE_TAG" --commit "$RELEASE_SOURCE_COMMIT" \
            --version "$RELEASE_VERSION" --timeout 1800
        displayName: Verify immutable source and public distribution
        env:
          RELEASE_TAG: ${{ parameters.releaseTag }}
          RELEASE_SOURCE_COMMIT: ${{ parameters.releaseSourceCommit }}
          RELEASE_VERSION: ${{ parameters.releaseVersion }}
          GITHUB_REPOSITORY: Azure/taugrid
