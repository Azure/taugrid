trigger: none
pr: none

schedules:
  - cron: "15 8 * * *"
    displayName: Daily TauGrid Flex end-to-end validation
    branches:
      include:
        - main
    always: true

parameters:
  - name: profile
    displayName: Workload profile
    type: string
    default: full
    values:
      - smoke
      - full
  - name: rdmaConformance
    displayName: Run H200 InfiniBand/NCCL conformance
    type: boolean
    default: true
  - name: includeDGXSpark
    displayName: Include DGX Spark targets
    type: boolean
    default: false

pool:
  name: 1es-aks-ai-runtime-ado-eastus2

variables:
  - name: azureClusterServiceConnection
    value: aks ai runtime - corp
  - name: azureRegistryServiceConnection
    value: aks ai runtime - corp
  - name: GOFLAGS
    value: -mod=readonly
  - name: GOTOOLCHAIN
    value: local
  - name: FLEX_NIGHTLY_DEPLOY_MODE
    value: shared-cluster-controllers
  - name: FLEX_NIGHTLY_GPU_TOPOLOGY
    value: taugrid-gpu-topology
  - name: FLEX_NIGHTLY_TAU_NAMESPACE
    value: ray
  - name: FLEX_NIGHTLY_TAU_QUEUE
    value: backfill
  - name: FLEX_NIGHTLY_TAU_JOB_PROFILE
    value: nightly.cpu.1x
  - name: FLEX_NIGHTLY_TAU_RAY_PROFILE
    value: nightly.cpu.1x
  - name: FLEX_NIGHTLY_ACR_NAME
    value: $(AKS_AI_RUNTIME_FLEX_ACR_NAME)
  - name: FLEX_NIGHTLY_CLUSTER_SUBSCRIPTION_ID
    value: $(AKS_AI_RUNTIME_FLEX_SUBSCRIPTION_ID)
  - name: FLEX_NIGHTLY_IMAGE_REPOSITORY_PREFIX
    value: $(AKS_AI_RUNTIME_FLEX_NIGHTLY_IMAGE_REPOSITORY_PREFIX)
  - name: FLEX_NIGHTLY_TAUGRID_RELEASE
    value: $(AKS_AI_RUNTIME_FLEX_TAUGRID_RELEASE)
  - name: FLEX_NIGHTLY_TAUGRID_SYSTEM_NAMESPACE
    value: $(AKS_AI_RUNTIME_FLEX_TAUGRID_SYSTEM_NAMESPACE)
  - name: FLEX_NIGHTLY_STORAGE_WESTEUROPE_REGION
    value: $(AKS_AI_RUNTIME_FLEX_STORAGE_WESTEUROPE_REGION)
  - name: FLEX_NIGHTLY_STORAGE_EASTUS2EUAP_REGION
    value: $(AKS_AI_RUNTIME_FLEX_STORAGE_EASTUS2EUAP_REGION)
  - name: AKS_AI_RUNTIME_FLEX_NIGHTLY_MIN_RDMA_NODES
    value: "2"
  - name: FINEWEB_TRAIN_STEPS
    value: "2"
  - name: FINEWEB_CHECKPOINT_INTERVAL
    value: "1"
  - name: FINEWEB_RAYJOB_TIMEOUT_MINUTES
    value: "60"

jobs:
  - job: taucluster_reconcile
    displayName: Reconcile TauCluster GPU catalog
    timeoutInMinutes: 15
    steps:
      - checkout: self

      - bash: scripts/ci/tests/taugrid-flex-nightly-taucluster-reconcile_test.sh
        displayName: Validate TauCluster reconciliation

      - task: AzureCLI@2
        displayName: Reconcile reviewed GPU classes and nightly profile
        inputs:
          azureSubscription: $(azureClusterServiceConnection)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail

            tools_dir="$(Agent.TempDirectory)/taugrid-nightly-tools"
            mkdir -p "${tools_dir}"
            if ! command -v kubelogin >/dev/null 2>&1; then
              az aks install-cli \
                --install-location "${tools_dir}/kubectl" \
                --kubelogin-install-location "${tools_dir}/kubelogin"
              export PATH="${tools_dir}:${PATH}"
            fi

            export KUBECONFIG="$(Agent.TempDirectory)/flex-kubeconfig"
            az aks get-credentials \
              --subscription "${FLEX_NIGHTLY_CLUSTER_SUBSCRIPTION_ID}" \
              --resource-group "${FLEX_NIGHTLY_RESOURCE_GROUP}" \
              --name "${FLEX_NIGHTLY_CLUSTER_NAME}" \
              --context flex-nightly \
              --file "${KUBECONFIG}" \
              --overwrite-existing
            kubelogin convert-kubeconfig --kubeconfig "${KUBECONFIG}" --login azurecli

            FLEX_NIGHTLY_TAUCLUSTER_ARTIFACT_DIR="$(Build.ArtifactStagingDirectory)/taucluster-reconcile" \
              scripts/ci/taugrid-flex-nightly-taucluster-reconcile.sh
        env:
          FLEX_NIGHTLY_RESOURCE_GROUP: $(AKS_AI_RUNTIME_FLEX_RESOURCE_GROUP)
          FLEX_NIGHTLY_CLUSTER_NAME: $(AKS_AI_RUNTIME_FLEX_CLUSTER_NAME)
          FLEX_NIGHTLY_TAU_PROFILE: $(FLEX_NIGHTLY_TAU_JOB_PROFILE)
          FLEX_NIGHTLY_TAU_NAMESPACE: $(FLEX_NIGHTLY_TAU_NAMESPACE)
          FLEX_NIGHTLY_TAU_QUEUE: $(FLEX_NIGHTLY_TAU_QUEUE)
          FLEX_NIGHTLY_RECONCILE_WORKLOAD_PROFILES: "false"

      - bash: mkdir -p "$(Build.ArtifactStagingDirectory)/taucluster-reconcile"
        displayName: Ensure TauCluster diagnostics directory exists
        condition: always()

      - task: PublishPipelineArtifact@1
        displayName: Publish TauCluster reconciliation diagnostics
        condition: always()
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/taucluster-reconcile
          artifact: taugrid-flex-taucluster-reconcile-$(Build.BuildId)-$(System.JobAttempt)

  - job: preflight
    displayName: Hardware and topology contract
    dependsOn: taucluster_reconcile
    timeoutInMinutes: 15
    steps:
      - checkout: self

      - bash: scripts/ci/tests/taugrid-flex-nightly-contract_test.sh
        displayName: Validate nightly pipeline contract

      - bash: scripts/ci/tests/taugrid-flex-nightly-report_test.sh
        displayName: Validate nightly report generation

      - bash: scripts/ci/tests/taugrid-flex-nightly-cli-smoke_test.sh
        displayName: Validate Tau CLI nightly smoke

      - bash: scripts/ci/tests/taugrid-flex-nightly-gpu-profile-smoke_test.sh
        displayName: Validate GPU workload-profile smoke

      - bash: scripts/ci/tests/taugrid-flex-nightly-storage-smoke_test.sh
        displayName: Validate cross-region storage smoke

      - bash: scripts/ci/tests/taugrid-flex-nightly-kusto-check_test.sh
        displayName: Validate Portal and Kusto checks

      - task: AzureCLI@2
        displayName: Inventory Flex hardware matrix
        inputs:
          azureSubscription: $(azureClusterServiceConnection)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail

            tools_dir="$(Agent.TempDirectory)/taugrid-nightly-tools"
            mkdir -p "${tools_dir}"
            if ! command -v kubelogin >/dev/null 2>&1; then
              az aks install-cli \
                --install-location "${tools_dir}/kubectl" \
                --kubelogin-install-location "${tools_dir}/kubelogin"
              export PATH="${tools_dir}:${PATH}"
            fi

            export KUBECONFIG="$(Agent.TempDirectory)/flex-kubeconfig"
            az aks get-credentials \
              --subscription "${FLEX_NIGHTLY_CLUSTER_SUBSCRIPTION_ID}" \
              --resource-group "${FLEX_NIGHTLY_RESOURCE_GROUP}" \
              --name "${FLEX_NIGHTLY_CLUSTER_NAME}" \
              --context flex-nightly \
              --file "${KUBECONFIG}" \
              --overwrite-existing
            kubelogin convert-kubeconfig --kubeconfig "${KUBECONFIG}" --login azurecli

            artifact_dir="$(Build.ArtifactStagingDirectory)/preflight"
            mkdir -p "${artifact_dir}"
            image_platforms="$(docker manifest inspect "${RAY_E2E_IMAGE}" |
              jq -r 'if .manifests then [.manifests[].platform | (.os + "/" + .architecture)] | unique[] else (.os + "/" + .architecture) end')"
            if [[ "${RAY_E2E_IMAGE}" =~ ray([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              ray_version="${BASH_REMATCH[1]}"
            else
              echo "##vso[task.logissue type=error]Ray image must contain a rayX.Y.Z version"
              exit 1
            fi
            if [[ "$(printf '%s\n' 2.56.1 "${ray_version}" | sort -V | head -n1)" != "2.56.1" ]]; then
              echo "##vso[task.logissue type=error]Ray ${ray_version} predates the Ray Serve protobuf compatibility fix; use 2.56.1 or newer"
              exit 1
            fi
            grep -Fxq linux/amd64 <<<"${image_platforms}"
            if [[ "${INCLUDE_DGX}" == "true" || "${INCLUDE_DGX}" == "True" ]]; then
              grep -Fxq linux/arm64 <<<"${image_platforms}"
            fi
            printf '%s\n' "${image_platforms}" >"${artifact_dir}/ray-image-platforms.txt"
            printf '%s\n' "${ray_version}" >"${artifact_dir}/ray-version.txt"
            export FLEX_NIGHTLY_CONTRACT_FILE="${artifact_dir}/hardware-matrix.json"
            scripts/ci/taugrid-flex-nightly-preflight.sh cluster
        env:
          FLEX_NIGHTLY_DEPLOY_MODE: $(FLEX_NIGHTLY_DEPLOY_MODE)
          FLEX_NIGHTLY_GPU_TOPOLOGY: $(FLEX_NIGHTLY_GPU_TOPOLOGY)
          FLEX_NIGHTLY_RESOURCE_GROUP: $(AKS_AI_RUNTIME_FLEX_RESOURCE_GROUP)
          FLEX_NIGHTLY_CLUSTER_NAME: $(AKS_AI_RUNTIME_FLEX_CLUSTER_NAME)
          FLEX_NIGHTLY_MIN_RDMA_NODES: $(AKS_AI_RUNTIME_FLEX_NIGHTLY_MIN_RDMA_NODES)
          FLEX_NIGHTLY_INCLUDE_DGX: ${{ parameters.includeDGXSpark }}
          FLEX_NIGHTLY_DGX_SELECTOR: $(AKS_AI_RUNTIME_FLEX_NIGHTLY_DGX_SELECTOR)
          FLEX_NIGHTLY_DGX_SITE: $(AKS_AI_RUNTIME_FLEX_NIGHTLY_DGX_SITE)
          FLEX_NIGHTLY_A100_SITE: $(AKS_AI_RUNTIME_FLEX_NIGHTLY_A100_SITE)
          FLEX_NIGHTLY_H100_SITE: $(AKS_AI_RUNTIME_FLEX_NIGHTLY_H100_SITE)
          FLEX_NIGHTLY_H200_SITE: $(AKS_AI_RUNTIME_FLEX_NIGHTLY_H200_SITE)
          INCLUDE_DGX: ${{ parameters.includeDGXSpark }}
          RAY_E2E_IMAGE: $(AKS_AI_RUNTIME_RAY_E2E_IMAGE)

      - bash: mkdir -p "$(Build.ArtifactStagingDirectory)/preflight"
        displayName: Ensure hardware contract directory exists
        condition: always()

      - task: PublishPipelineArtifact@1
        displayName: Publish hardware contract
        condition: always()
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/preflight
          artifact: taugrid-flex-hardware-contract

  - job: build_images
    displayName: Publish immutable TauGrid images
    dependsOn: preflight
    timeoutInMinutes: 180
    steps:
      - checkout: self

      - task: AzureCLI@2
        displayName: Build, publish, and verify deployment images
        inputs:
          azureSubscription: $(azureRegistryServiceConnection)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail

            require_value() {
              local name="$1"
              local value="${!name:-}"
              if [[ -z "${value}" || "${value}" == '$('* ]]; then
                echo "##vso[task.logissue type=error]${name} must be configured in Azure DevOps"
                exit 1
              fi
            }

            require_value FLEX_ACR_NAME
            require_value NIGHTLY_IMAGE_REPOSITORY_PREFIX

            registry="${FLEX_ACR_NAME}.azurecr.io"
            image_tag="nightly-${BUILD_SOURCEVERSION:0:12}-${BUILD_BUILDID}"
            artifact_dir="$(Build.ArtifactStagingDirectory)/images"
            mkdir -p "${artifact_dir}"

            az acr login --name "${FLEX_ACR_NAME}"
            builder="taugrid-flex-nightly-${BUILD_BUILDID}-${SYSTEM_JOBATTEMPT:-1}"
            docker buildx create --name "${builder}" --driver docker-container --use
            trap 'docker buildx rm "${builder}" >/dev/null 2>&1 || true' EXIT

            controller_image="${registry}/${NIGHTLY_IMAGE_REPOSITORY_PREFIX}/tau-core-controller:${image_tag}"
            portal_image="${registry}/${NIGHTLY_IMAGE_REPOSITORY_PREFIX}/taugrid-portal:${image_tag}"
            collector_image="${registry}/${NIGHTLY_IMAGE_REPOSITORY_PREFIX}/gpu-metrics-collector:${image_tag}"

            make -C images/tau-core-controller docker-push \
              IMG="${controller_image}" \
              TAG="${image_tag}" \
              PLATFORMS=linux/amd64,linux/arm64
            make -C images/taugrid-portal docker-push \
              IMG="${portal_image}" \
              TAG="${image_tag}" \
              VERSION="${image_tag}" \
              COMMIT="${BUILD_SOURCEVERSION}" \
              DATE="$(git show -s --format=%cI "${BUILD_SOURCEVERSION}")" \
              PLATFORMS=linux/amd64,linux/arm64
            make -C images/gpu-metrics-collector docker-push \
              ACR_REGISTRY="${registry}" \
              PUSH_IMG="${collector_image}" \
              TAG="${image_tag}" \
              PLATFORMS=linux/amd64,linux/arm64

            for image in \
              "${NIGHTLY_IMAGE_REPOSITORY_PREFIX}/tau-core-controller:${image_tag}" \
              "${NIGHTLY_IMAGE_REPOSITORY_PREFIX}/taugrid-portal:${image_tag}" \
              "${NIGHTLY_IMAGE_REPOSITORY_PREFIX}/gpu-metrics-collector:${image_tag}"; do
              digest="$(az acr repository show \
                --name "${FLEX_ACR_NAME}" \
                --image "${image}" \
                --query digest \
                --output tsv)"
              if [[ -z "${digest}" ]]; then
                echo "##vso[task.logissue type=error]Published image ${image} has no registry digest"
                exit 1
              fi
            done

            jq -n \
              --arg registry "${registry}" \
              --arg repositoryPrefix "${NIGHTLY_IMAGE_REPOSITORY_PREFIX}" \
              --arg tag "${image_tag}" \
              --arg sourceVersion "${BUILD_SOURCEVERSION}" \
              '{
                registry: $registry,
                repository_prefix: $repositoryPrefix,
                tag: $tag,
                source_version: $sourceVersion
              }' >"${artifact_dir}/images.json"
        env:
          FLEX_ACR_NAME: $(FLEX_NIGHTLY_ACR_NAME)
          NIGHTLY_IMAGE_REPOSITORY_PREFIX: $(FLEX_NIGHTLY_IMAGE_REPOSITORY_PREFIX)

      - bash: mkdir -p "$(Build.ArtifactStagingDirectory)/images"
        displayName: Ensure image contract directory exists
        condition: always()

      - task: PublishPipelineArtifact@1
        displayName: Publish immutable image contract
        condition: always()
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/images
          artifact: taugrid-flex-images

  - deployment: deploy_flex
    displayName: Deploy current TauGrid main to Flex
    environment: flex
    dependsOn: build_images
    timeoutInMinutes: 90
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - task: GoTool@0
              displayName: Use Go 1.26.9
              inputs:
                version: 1.26.9

            - task: DownloadPipelineArtifact@2
              displayName: Download immutable image contract
              inputs:
                artifact: taugrid-flex-images
                path: $(Pipeline.Workspace)/taugrid-flex-images

            - task: AzureCLI@2
              displayName: Upgrade and validate TauGrid on Flex
              inputs:
                azureSubscription: $(azureClusterServiceConnection)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail

                  require_value() {
                    local name="$1"
                    local value="${!name:-}"
                    if [[ -z "${value}" || "${value}" == '$('* ]]; then
                      echo "##vso[task.logissue type=error]${name} must be configured in Azure DevOps"
                      exit 1
                    fi
                  }

                  require_value FLEX_RESOURCE_GROUP
                  require_value FLEX_CLUSTER_NAME
                  require_value TAUGRID_RELEASE
                  require_value TAUGRID_SYSTEM_NAMESPACE
                  require_value TAU_NAMESPACE
                  require_value TAU_QUEUE
                  require_value TAU_PROFILE

                  image_contract="$(Pipeline.Workspace)/taugrid-flex-images/images.json"
                  test -s "${image_contract}"
                  registry="$(jq -r '.registry' "${image_contract}")"
                  repository_prefix="$(jq -r '.repository_prefix' "${image_contract}")"
                  image_tag="$(jq -r '.tag' "${image_contract}")"
                  source_version="$(jq -r '.source_version' "${image_contract}")"
                  [[ "${source_version}" == "${BUILD_SOURCEVERSION}" ]]

                  artifact_dir="$(Build.ArtifactStagingDirectory)/deployment"
                  diagnostics_dir="${artifact_dir}/diagnostics"
                  result_file="${artifact_dir}/deployment-result.json"
                  values_file="$(Agent.TempDirectory)/flex-values.json"
                  render_file="$(Agent.TempDirectory)/flex-render.txt"
                  mkdir -p "${diagnostics_dir}"

                  export KUBECONFIG="$(Agent.TempDirectory)/flex-kubeconfig"
                  tools_dir="$(Agent.TempDirectory)/taugrid-nightly-tools"
                  mkdir -p "${tools_dir}"
                  if ! command -v kubelogin >/dev/null 2>&1; then
                    az aks install-cli \
                      --install-location "${tools_dir}/kubectl" \
                      --kubelogin-install-location "${tools_dir}/kubelogin"
                    export PATH="${tools_dir}:${PATH}"
                  fi

                  write_result() {
                    local status="$1"
                    local reason="$2"
                    local previous_revision="${3:-}"
                    local current_revision="${4:-}"
                    jq -n \
                      --arg environment flex \
                      --arg status "${status}" \
                      --arg reason "${reason}" \
                      --arg sourceVersion "${source_version}" \
                      --arg imageTag "${image_tag}" \
                      --arg previousRevision "${previous_revision}" \
                      --arg currentRevision "${current_revision}" \
                      '{
                        environment: $environment,
                        status: $status,
                        reason: $reason,
                        source_version: $sourceVersion,
                        image_tag: $imageTag,
                        previous_revision: $previousRevision,
                        current_revision: $currentRevision
                      }' >"${result_file}"
                  }

                  cleanup() {
                    rc=$?
                    trap - EXIT
                    set +e
                    helm status "${TAUGRID_RELEASE}" \
                      --namespace "${TAUGRID_SYSTEM_NAMESPACE}" \
                      --kube-context flex-nightly \
                      --output json 2>"${diagnostics_dir}/helm-status-error.txt" |
                      jq '{
                        name: .name,
                        namespace: .namespace,
                        revision: .version,
                        status: .info.status,
                        description: .info.description,
                        first_deployed: .info.first_deployed,
                        last_deployed: .info.last_deployed,
                        deleted: .info.deleted
                      }' >"${diagnostics_dir}/helm-status.json"
                    helm history "${TAUGRID_RELEASE}" \
                      --namespace "${TAUGRID_SYSTEM_NAMESPACE}" \
                      --kube-context flex-nightly \
                      --output yaml >"${diagnostics_dir}/helm-history.yaml" 2>&1
                    kubectl --context flex-nightly \
                      --namespace "${TAUGRID_SYSTEM_NAMESPACE}" \
                      get deployments,daemonsets,statefulsets,pods -o wide \
                      >"${diagnostics_dir}/resources.txt" 2>&1
                    kubectl --context flex-nightly \
                      --namespace "${TAUGRID_SYSTEM_NAMESPACE}" \
                      get events --sort-by=.lastTimestamp \
                      >"${diagnostics_dir}/events.txt" 2>&1
                    if [[ ! -s "${result_file}" ]]; then
                      write_result failed "deployment command failed; Helm atomic rollback was requested"
                    fi
                    rm -f "${values_file}" "${render_file}" "${KUBECONFIG}"
                    exit "${rc}"
                  }
                  trap cleanup EXIT

                  az aks get-credentials \
                    --subscription "${FLEX_NIGHTLY_CLUSTER_SUBSCRIPTION_ID}" \
                    --resource-group "${FLEX_RESOURCE_GROUP}" \
                    --name "${FLEX_CLUSTER_NAME}" \
                    --context flex-nightly \
                    --file "${KUBECONFIG}" \
                    --overwrite-existing
                  kubelogin convert-kubeconfig --kubeconfig "${KUBECONFIG}" --login azurecli
                  kubectl --context flex-nightly version

                  release_state="$(
                    TAUGRID_RELEASE="${TAUGRID_RELEASE}" \
                      TAUGRID_SYSTEM_NAMESPACE="${TAUGRID_SYSTEM_NAMESPACE}" \
                      TAUGRID_KUBE_CONTEXT=flex-nightly \
                      scripts/ci/taugrid-unbounded-stable-nightly-recover.sh inspect
                  )"
                  previous_revision="$(jq -r '.revision' <<<"${release_state}")"
                  if [[ "$(jq -r '.exists' <<<"${release_state}")" != "true" ]]; then
                    echo "##vso[task.logissue type=error]The managed Flex TauGrid release is absent; bootstrap it through the reviewed platform installation before enabling nightly upgrades"
                    exit 1
                  fi
                  if [[ "$(jq -r '.status' <<<"${release_state}")" != "deployed" ]]; then
                    echo "##vso[task.logissue type=error]Existing TauGrid release is not deployed; repair it before running the nightly"
                    exit 1
                  fi
                  helm get values "${TAUGRID_RELEASE}" \
                    --namespace "${TAUGRID_SYSTEM_NAMESPACE}" \
                    --kube-context flex-nightly \
                    --output json >"${values_file}"

                  live_values="$(helm get values "${TAUGRID_RELEASE}" \
                    --namespace "${TAUGRID_SYSTEM_NAMESPACE}" \
                    --kube-context flex-nightly \
                    --all \
                    --output json)"
                  if ! jq -e '
                    .components.kueue.enabled == false
                    and .components.kuberayOperator.enabled == false
                    and .baselineQueue.enabled == false
                    and .["tau-core-controller"].tauCluster.create == false
                  ' <<<"${live_values}" >/dev/null; then
                    echo "##vso[task.logissue type=error]The existing Flex release must already use external Kueue, external KubeRay, external queue policy, and an external TauCluster; refusing to transfer ownership during a nightly"
                    exit 1
                  fi
                  if jq -e '.["taugrid-core"].lifecycleRecorder.enabled == true' \
                    <<<"${live_values}" >/dev/null; then
                    echo "##vso[task.logissue type=error]The nightly cannot replace the lifecycle recorder with an unpublished image; use a released MCR image or disable the recorder before enabling this deployment"
                    exit 1
                  fi

                  nightly_profile="$(jq -cn \
                    --arg name "${TAU_PROFILE}" \
                    --arg namespace "${TAU_NAMESPACE}" \
                    --arg queue "${TAU_QUEUE}" \
                    '{
                      name:$name,
                      description:"TauGrid Flex nightly CPU command lifecycle.",
                      applicability:{
                        teams:[],
                        lanes:["training"],
                        namespaces:[$namespace]
                      },
                      gpusPerWorker:0,
                      workerCount:1,
                      mode:"fixed",
                      placement:"unconstrained",
                      defaultLocalQueue:$queue,
                      executionTarget:"singleCluster",
                      priorities:{
                        workloadPriorityClassName:"tau-train-default",
                        podPriorityClassName:"tau-train-default"
                      }
                    }')"
                  kubectl --context flex-nightly get clusters.tau.azure.com cluster \
                    -o json >"${diagnostics_dir}/taucluster-before-deploy.json"
                  current_profiles="$(jq -c \
                    '.spec.workloadProfiles // []' \
                    "${diagnostics_dir}/taucluster-before-deploy.json")"
                  updated_profiles="$(jq -c \
                    --argjson profile "${nightly_profile}" \
                    'map(select(.name != $profile.name)) + [$profile]' \
                    <<<"${current_profiles}")"
                  jq --argjson profiles "${updated_profiles}" \
                    '.["tau-core-controller"].tauCluster.workloadProfiles = $profiles' \
                    "${values_file}" >"${values_file}.tmp"
                  mv "${values_file}.tmp" "${values_file}"
                  jq '.["tau-core-controller"].tauCluster.workloadProfiles' \
                    "${values_file}" >"${diagnostics_dir}/workload-profiles.json"

                  make -C cli build
                  scripts/ci/vendor-taugrid-dependencies.sh charts/taugrid

                  install_args=(
                    cluster install
                    --context flex-nightly
                    --release "${TAUGRID_RELEASE}"
                    --namespace "${TAUGRID_SYSTEM_NAMESPACE}"
                    --chart charts/taugrid
                    --version "$(awk '$1 == "version:" { print $2; exit }' charts/taugrid/Chart.yaml)"
                    --values "${values_file}"
                    --timeout 20m
                    --wait
                    --atomic
                    --set "components.kueue.enabled=false"
                    --set "components.kuberayOperator.enabled=false"
                    --set "baselineQueue.enabled=false"
                    --set-string "tau-core-controller.image.repository=${registry}/${repository_prefix}/tau-core-controller"
                    --set-string "tau-core-controller.image.tag=${image_tag}"
                    --set-string "tau-core-controller.image.digest="
                    --set-string "tau-core-controller.image.pullPolicy=Always"
                    --set-string "taugrid-core.portal.image.repository=${registry}/${repository_prefix}/taugrid-portal"
                    --set-string "taugrid-core.portal.image.tag=${image_tag}"
                    --set-string "taugrid-core.portal.image.digest="
                    --set-string "taugrid-core.portal.image.pullPolicy=Always"
                    --set-string "taugrid-core.stellar.image.repository=${registry}/${repository_prefix}/taugrid-portal"
                    --set-string "taugrid-core.stellar.image.tag=${image_tag}"
                    --set-string "taugrid-core.stellar.image.pullPolicy=Always"
                    --set-string "gpu-monitoring.metricsCollector.image.repository=${registry}/${repository_prefix}/gpu-metrics-collector"
                    --set-string "gpu-monitoring.metricsCollector.image.tag=${image_tag}"
                    --set-string "gpu-monitoring.metricsCollector.image.digest="
                  )

                  cli/bin/tau "${install_args[@]}" --dry-run \
                    >"${render_file}" 2>&1
                  printf 'Dry-run rendering completed successfully for source %s.\n' \
                    "${source_version}" >"${diagnostics_dir}/render-summary.txt"
                  recover_failed_deployment() {
                    local failure_reason="$1"
                    local recovery_reason
                    if recovery_reason="$(
                      TAUGRID_RELEASE="${TAUGRID_RELEASE}" \
                        TAUGRID_SYSTEM_NAMESPACE="${TAUGRID_SYSTEM_NAMESPACE}" \
                        TAUGRID_KUBE_CONTEXT=flex-nightly \
                        TAUGRID_PREVIOUS_REVISION="${previous_revision}" \
                        TAUGRID_DIAGNOSTICS_DIR="${diagnostics_dir}" \
                        scripts/ci/taugrid-unbounded-stable-nightly-recover.sh recover
                    )"; then
                      write_result failed \
                        "${failure_reason}; ${recovery_reason}" \
                        "${previous_revision}"
                    else
                      write_result failed \
                        "${failure_reason}; recovery failed" \
                        "${previous_revision}"
                    fi
                  }
                  if ! cli/bin/tau "${install_args[@]}" \
                    >"${diagnostics_dir}/install-output.txt" 2>&1; then
                    recover_failed_deployment \
                      "installation or embedded readiness validation failed"
                    exit 1
                  fi

                  current_revision="$(helm status "${TAUGRID_RELEASE}" \
                    --namespace "${TAUGRID_SYSTEM_NAMESPACE}" \
                    --kube-context flex-nightly \
                    --output json | jq -r '.version | tostring')"
                  FLEX_NIGHTLY_TAUCLUSTER_ARTIFACT_DIR="${diagnostics_dir}/taucluster-reconcile" \
                    FLEX_NIGHTLY_TAU_PROFILE="${TAU_PROFILE}" \
                    FLEX_NIGHTLY_TAU_NAMESPACE="${TAU_NAMESPACE}" \
                    FLEX_NIGHTLY_TAU_QUEUE="${TAU_QUEUE}" \
                    scripts/ci/taugrid-flex-nightly-taucluster-reconcile.sh
                  if ! cli/bin/tau cluster validate installation \
                    --context flex-nightly \
                    --release "${TAUGRID_RELEASE}" \
                    --namespace "${TAUGRID_SYSTEM_NAMESPACE}" \
                    --timeout 10m \
                    >"${diagnostics_dir}/validation.txt" 2>&1; then
                    recover_failed_deployment "post-install readiness validation failed"
                    exit 1
                  fi

                  write_result passed "" "${previous_revision}" "${current_revision}"
              env:
                FLEX_RESOURCE_GROUP: $(AKS_AI_RUNTIME_FLEX_RESOURCE_GROUP)
                FLEX_CLUSTER_NAME: $(AKS_AI_RUNTIME_FLEX_CLUSTER_NAME)
                TAUGRID_RELEASE: $(FLEX_NIGHTLY_TAUGRID_RELEASE)
                TAUGRID_SYSTEM_NAMESPACE: $(FLEX_NIGHTLY_TAUGRID_SYSTEM_NAMESPACE)
                TAU_NAMESPACE: $(FLEX_NIGHTLY_TAU_NAMESPACE)
                TAU_QUEUE: $(FLEX_NIGHTLY_TAU_QUEUE)
                TAU_PROFILE: $(FLEX_NIGHTLY_TAU_JOB_PROFILE)

            - bash: mkdir -p "$(Build.ArtifactStagingDirectory)/deployment"
              displayName: Ensure deployment diagnostics directory exists
              condition: always()

            - task: PublishPipelineArtifact@1
              displayName: Publish deployment diagnostics
              condition: always()
              inputs:
