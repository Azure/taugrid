apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: e2e-fineweb-16xh200-ib
  namespace: {{STACK_NAMESPACE}}
  labels:
    kueue.x-k8s.io/queue-name: {{STACK_LARGE_GPU_QUEUE}}
  annotations:
    tau.azure.com/payload-digest: "{{FINEWEB_SCRIPT_PAYLOAD_DIGEST}}"
spec:
  entrypoint: python /script/fineweb_ray_train.py
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 600
  submitterPodTemplate:
    spec:
      restartPolicy: Never
      nodeSelector:
        {{RAY_SUBMITTER_NODE_SELECTOR_KEY}}: {{RAY_SUBMITTER_NODE_SELECTOR_VALUE}}
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
        effect: NoSchedule
      containers:
      - name: ray-job-submitter
        image: {{RAY_IMAGE}}
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
  runtimeEnvYAML: |
    pip:
      packages:
        - {{FINEWEB_TORCH_SPEC}}
        - numpy==2.1.3
      pip_install_options:
        - --no-cache-dir
        - --index-url
        - {{FINEWEB_TORCH_INDEX_URL}}
        - --extra-index-url
        - https://pypi.org/simple
      pip_check: false
    env_vars:
      FINEWEB_DATA_MODE: "{{FINEWEB_DATA_MODE}}"
      FINEWEB_DATASET_URIS: "{{FINEWEB_DATASET_URIS}}"
      FINEWEB_DATASET_SHA256S: "{{FINEWEB_DATASET_SHA256S}}"
      FINEWEB_DATASET_TOKEN_COUNTS: "{{FINEWEB_DATASET_TOKEN_COUNTS}}"
      FINEWEB_MIN_TOTAL_TOKENS: "{{FINEWEB_MIN_TOTAL_TOKENS}}"
      FINEWEB_TRAIN_WORKERS: "{{FINEWEB_TRAIN_WORKERS}}"
      FINEWEB_TRAIN_STEPS: "{{FINEWEB_TRAIN_STEPS}}"
      FINEWEB_CHECKPOINT_INTERVAL: "{{FINEWEB_CHECKPOINT_INTERVAL}}"
      FINEWEB_CHECKPOINT_DIR: "{{FINEWEB_CHECKPOINT_DIR}}"
      FINEWEB_BATCH_SIZE: "{{FINEWEB_BATCH_SIZE}}"
      FINEWEB_BLOCK_SIZE: "{{FINEWEB_BLOCK_SIZE}}"
      FINEWEB_VOCAB_SIZE: "{{FINEWEB_VOCAB_SIZE}}"
      FINEWEB_N_LAYER: "{{FINEWEB_N_LAYER}}"
      FINEWEB_N_HEAD: "{{FINEWEB_N_HEAD}}"
      FINEWEB_N_EMBD: "{{FINEWEB_N_EMBD}}"
      FINEWEB_REPORT_EVERY: "{{FINEWEB_REPORT_EVERY}}"
      NCCL_IB_HCA: "{{FINEWEB_NCCL_IB_HCA}}"
      NCCL_SOCKET_IFNAME: "{{FINEWEB_NCCL_SOCKET_IFNAME}}"
      NCCL_DEBUG: "{{FINEWEB_NCCL_DEBUG}}"
      TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  rayClusterSpec:
    rayVersion: "{{RAY_VERSION}}"
    enableInTreeAutoscaling: false
    headGroupSpec:
      rayStartParams:
        num-cpus: "0"
        dashboard-host: "0.0.0.0"
      template:
        metadata:
          annotations:
            adx-mon/log-destination: "Logs:ContainerLogs"
        spec:
          initContainers:
          - name: prepare-ray-tmp
            image: {{RAY_IMAGE}}
            command: ["/bin/sh", "-c", "mkdir -p /tmp/ray && chmod 1777 /tmp/ray"]
            securityContext:
              runAsUser: 0
            env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            volumeMounts:
            - name: ray-tmp
              mountPath: /tmp/ray
              subPathExpr: $(POD_NAME)
          - name: tau-payload
            image: {{RAY_IMAGE}}
            command:
            - python3
            - -c
            - |
              import base64
              import hashlib
              import json
              import os
              import sys

              raw_b64 = os.environ["TAU_PAYLOAD_B64"]
              want_digest = os.environ["TAU_PAYLOAD_DIGEST"]
              target_dir = os.environ["TAU_PAYLOAD_TARGET_DIR"]

              raw = base64.b64decode(raw_b64)
              got_digest = hashlib.sha256(raw).hexdigest()
              if got_digest != want_digest:
                  sys.stderr.write(
                      "tau-payload: integrity check failed: digest=%s want=%s\n" % (got_digest, want_digest)
                  )
                  sys.exit(1)

              envelope = json.loads(raw)
              files = envelope.get("files", [])
              os.makedirs(target_dir, exist_ok=True)
              for f in files:
                  name = f["name"]
                  if not name or name in (".", "..") or "/" in name or "\\" in name:
                      sys.stderr.write("tau-payload: rejecting unsafe file name %r\n" % (name,))
                      sys.exit(1)
                  data = base64.b64decode(f["data"])
                  path = os.path.join(target_dir, name)
                  with open(path, "wb") as fh:
                      fh.write(data)
                  os.chmod(path, 0o644)

              sys.stderr.write("tau-payload: wrote %d file(s) to %s\n" % (len(files), target_dir))
            env:
            - name: TAU_PAYLOAD_B64
              value: "{{FINEWEB_SCRIPT_PAYLOAD_B64}}"
            - name: TAU_PAYLOAD_DIGEST
              value: "{{FINEWEB_SCRIPT_PAYLOAD_DIGEST}}"
            - name: TAU_PAYLOAD_TARGET_DIR
              value: /script
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 250m
                memory: 128Mi
            volumeMounts:
            - name: script
              mountPath: /script
          containers:
          - name: ray-head
            image: {{RAY_IMAGE}}
            env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            resources:
              requests:
                cpu: "2"
                memory: "8Gi"
              limits:
                cpu: "2"
                memory: "8Gi"
            startupProbe:
              httpGet:
                path: /api/version
                port: 8265
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 90
            lifecycle:
              preStop:
                exec:
                  command: ["/bin/sh", "-c", "rm -rf /tmp/ray/* || true"]
            volumeMounts:
            - name: ray-tmp
              mountPath: /tmp/ray
              subPathExpr: $(POD_NAME)
            - name: script
              mountPath: /script
              readOnly: true
          - name: ray-driver-log-offload
            image: {{RAY_IMAGE}}
            command: ["/bin/bash", "-lc", "--"]
            args:
            - |
              set -euo pipefail
              ray_root="${TAU_RAY_TMP:-/tmp/ray}"
              poll_seconds="${TAU_RAY_LOG_POLL_SECONDS:-1}"
              seen_paths=""
              tail_pids=()
              canonical_path() {
                local path="$1"
                local dir base
                dir="$(cd -P "$(dirname "$path")" && pwd)"
                base="$(basename "$path")"
                printf '%s/%s\n' "$dir" "$base"
              }
              has_seen() {
                local needle="$1"
                local seen
                while IFS= read -r seen; do
                  [[ "$seen" == "$needle" ]] && return 0
                done <<< "$seen_paths"
                return 1
              }
              start_tail() {
                local real="$1"
                seen_paths="${seen_paths}${real}"$'\n'
                tail -n +1 -F "$real" &
                tail_pids+=("$!")
              }
              discover_logs() {
                local entry candidate real
                local -a roots=("$ray_root/session_latest/logs")
                shopt -s nullglob
                for entry in "$ray_root"/session_*/logs; do
                  [[ -d "$entry" ]] && roots+=("$entry")
                done
                shopt -u nullglob
                for entry in "${roots[@]}"; do
                  [[ -d "$entry" ]] || continue
                  shopt -s nullglob
                  for candidate in "$entry"/job-driver-*.log; do
                    [[ -f "$candidate" ]] || continue
                    real="$(canonical_path "$candidate")"
                    if has_seen "$real"; then
                      continue
                    fi
                    start_tail "$real"
                  done
                  shopt -u nullglob
                done
              }
              cleanup() {
                local pid
                for pid in "${tail_pids[@]:-}"; do
                  kill "$pid" 2>/dev/null || true
                done
                wait || true
              }
              trap cleanup EXIT INT TERM
              while true; do
                discover_logs
                sleep "$poll_seconds"
              done
            env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            resources:
              requests:
                cpu: "10m"
                memory: "32Mi"
              limits:
                cpu: "100m"
                memory: "128Mi"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              capabilities:
                drop:
                - ALL
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
            - name: ray-tmp
              mountPath: /tmp/ray
              subPathExpr: $(POD_NAME)
              readOnly: true
          volumes:
          - name: ray-tmp
            hostPath:
              path: /mnt/taugrid-ray-tmp
              type: DirectoryOrCreate
          - name: script
            emptyDir: {}
          nodeSelector:
            {{RAY_SUBMITTER_NODE_SELECTOR_KEY}}: {{RAY_SUBMITTER_NODE_SELECTOR_VALUE}}
          tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
            effect: NoSchedule
    workerGroupSpecs:
    - groupName: fineweb-workers
      replicas: {{FINEWEB_TRAIN_WORKERS}}
      minReplicas: {{FINEWEB_TRAIN_WORKERS}}
      maxReplicas: {{FINEWEB_TRAIN_WORKERS}}
      rayStartParams: {}
      template:
        metadata:
          labels:
            e2e-test: fineweb-16xh200-ib
          {{FINEWEB_TAS_ANNOTATIONS}}
        spec:
          initContainers:
          - name: inject-ib-libs
            image: mcr.microsoft.com/azurelinux/base/core:3.0
            command:
            - /bin/sh
            - -c
            - |
              set -eu
              tdnf install -y libibverbs librdmacm libnl3
              mkdir -p /ib/lib /ib/providers /ib/drivers
              cp -aP /usr/lib/libibverbs.so* /ib/lib/
              cp -aP /usr/lib/librdmacm.so* /ib/lib/
              cp -aP /usr/lib/libnl-3.so.200* /ib/lib/
              cp -aP /usr/lib/libnl-route-3.so.200* /ib/lib/
              cp -aL /usr/lib/libibverbs/* /ib/providers/
              cp -aP /etc/libibverbs.d/* /ib/drivers/
              ls -la /ib/lib /ib/providers /ib/drivers
            securityContext:
              runAsUser: 0
            volumeMounts:
            - name: ib-libs
              mountPath: /ib
          - name: prepare-ray-tmp
            image: {{RAY_IMAGE}}
            command: ["/bin/sh", "-c", "mkdir -p /tmp/ray && chmod 1777 /tmp/ray && mkdir -p /mnt/fineweb-ckpt && chmod 1777 /mnt/fineweb-ckpt"]
            securityContext:
              runAsUser: 0
            env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            volumeMounts:
            - name: ray-tmp
              mountPath: /tmp/ray
              subPathExpr: $(POD_NAME)
            - name: fineweb-ckpt
              mountPath: /mnt/fineweb-ckpt
          containers:
          - name: ray-worker
            image: {{RAY_IMAGE}}
            securityContext:
              runAsUser: 0
              capabilities:
                add:
                - IPC_LOCK
            env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LD_LIBRARY_PATH
              value: /opt/ib/lib
            - name: IBV_DRIVERS_PATH
              value: /usr/lib/libibverbs
            resources:
              requests:
                cpu: "4"
                memory: "48Gi"
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: "48Gi"
                nvidia.com/gpu: "1"
            startupProbe:
              httpGet:
                path: /api/healthz
                port: 52365
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 90
            lifecycle:
              preStop:
                exec:
                  command: ["/bin/sh", "-c", "rm -rf /tmp/ray/* || true"]
            volumeMounts:
            - name: ray-tmp
              mountPath: /tmp/ray
              subPathExpr: $(POD_NAME)
            - name: dshm
              mountPath: /dev/shm
            - name: fineweb-ckpt
              mountPath: /mnt/fineweb-ckpt
            - name: ib-libs
              mountPath: /opt/ib/lib
              subPath: lib
            - name: ib-libs
              mountPath: /usr/lib/libibverbs
              subPath: providers
            - name: ib-libs
              mountPath: /etc/libibverbs.d
              subPath: drivers
          volumes:
          - name: ray-tmp
            hostPath:
              path: /mnt/taugrid-ray-tmp
              type: DirectoryOrCreate
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi
          - name: fineweb-ckpt
            hostPath:
              path: /mnt/taugrid-fineweb-ckpt
              type: DirectoryOrCreate
          - name: ib-libs
            emptyDir: {}
          nodeSelector:
            {{GPU_NODE_SELECTOR_KEY}}: {{GPU_NODE_SELECTOR_VALUE}}
          topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                e2e-test: fineweb-16xh200-ib
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          - key: sku
            operator: Exists
            effect: NoSchedule
