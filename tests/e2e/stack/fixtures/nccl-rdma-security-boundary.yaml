      object.spec.selector.matchLabels["e2e.taugrid.azure.com/diagnostic"] ==
        "nccl-rdma-2x1xh200" &&
      object.spec.selector.matchLabels["e2e.taugrid.azure.com/invocation"] ==
        object.metadata.labels["e2e.taugrid.azure.com/invocation"] &&
      (!has(object.spec.selector.matchExpressions) ||
       object.spec.selector.matchExpressions.size() == 0) &&
      !has(object.spec.podFailurePolicy) &&
      !has(object.spec.successPolicy) &&
      (
        (request.operation == "CREATE" && !has(object.spec.podReplacementPolicy)) ||
        (request.operation == "UPDATE" &&
         object.spec.podReplacementPolicy == "TerminatingOrFailed")
      ) &&
      !has(object.spec.managedBy)
    message: Indexed Job shape, suspension, retries, deadline, and TTL must remain bounded.
  - expression: >-
      object.spec.template.metadata.labels.size() == 4 &&
      object.spec.template.metadata.labels["app.kubernetes.io/name"] == "nccl-rdma-diagnostic" &&
      object.spec.template.metadata.labels["batch.kubernetes.io/job-name"] ==
        "e2e-nccl-rdma-2x1xh200" &&
      object.spec.template.metadata.labels["e2e.taugrid.azure.com/diagnostic"] == "nccl-rdma-2x1xh200" &&
      object.spec.template.metadata.labels["e2e.taugrid.azure.com/invocation"] ==
        object.metadata.labels["e2e.taugrid.azure.com/invocation"] &&
      object.spec.selector.matchLabels.all(
