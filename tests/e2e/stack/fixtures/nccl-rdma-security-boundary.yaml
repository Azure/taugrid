# Repository source for the standard batch/v1 Indexed Job 2-GPU inter-node
# RDMA admission boundary. APPROVED_* sentinels intentionally block activation
# until exact platform identities and infrastructure values are supplied.
# No Role or RoleBinding grants workload creation to an untrusted submitter.
apiVersion: v1
kind: Namespace
metadata:
  name: taugrid-rdma-diagnostic
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    tau.azure.com/nccl-rdma-security-boundary: v3
  annotations:
    tau.azure.com/nccl-rdma-diagnostic-approved: "true"
    tau.azure.com/owner-role: tau-platform-admins
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: nccl-rdma-shape
  namespace: taugrid-rdma-diagnostic
spec:
  hard:
    pods: "2"
    requests.cpu: "8"
    limits.cpu: "16"
    requests.memory: 32Gi
    limits.memory: 64Gi
    requests.nvidia.com/gpu: "2"
    limits.nvidia.com/gpu: "2"
    requests.rdma/rdma_shared_device_a: "2"
    limits.rdma/rdma_shared_device_a: "2"
    count/jobs.batch: "1"
    count/workloads.kueue.x-k8s.io: "1"
    count/configmaps: "2"
    count/secrets: "1"
    count/services: "1"
    count/serviceaccounts: "2"
    count/networkpolicies.networking.k8s.io: "1"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: h200-rdma
  namespace: taugrid-rdma-diagnostic
  labels:
    app.kubernetes.io/managed-by: platform-gitops
    app.kubernetes.io/part-of: taugrid-rdma-diagnostics
spec:
  clusterQueue: APPROVED_OWNED_DIAGNOSTIC_CLUSTER_QUEUE
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: taugrid-nccl-rdma-job-boundary
  labels:
    app.kubernetes.io/name: nccl-rdma-diagnostic
    app.kubernetes.io/managed-by: platform-gitops
    tau.azure.com/nccl-rdma-security-boundary: v3
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "jobs/status"]
  matchConditions:
  - name: diagnostic-namespace-only
    expression: object.metadata.namespace == "taugrid-rdma-diagnostic"
  variables:
  - name: pod
    expression: object.spec.template.spec
  - name: container
    expression: variables.pod.containers[0]
  validations:
  - expression: >-
      (request.operation == "CREATE" &&
       request.userInfo.username == "APPROVED_OPERATOR_USERNAME") ||
      (request.operation == "UPDATE" &&
       (
         request.userInfo.username in [
           "APPROVED_KUEUE_CONTROLLER_USERNAME",
           "APPROVED_JOB_CONTROLLER_USERNAME"
         ] ||
         (
           request.userInfo.username == "APPROVED_GARBAGE_COLLECTOR_USERNAME" &&
           has(oldObject.metadata.deletionTimestamp) &&
           has(oldObject.metadata.finalizers) &&
           oldObject.metadata.finalizers == ["foregroundDeletion"] &&
           (!has(object.metadata.finalizers) || object.metadata.finalizers.size() == 0)
         )
       ))
    message: Only the approved operator may create; only Kueue, the Job controller, or the garbage collector's deletion-finalizer transition may update the diagnostic Job.
  - expression: >-
      object.metadata.name == "e2e-nccl-rdma-2x1xh200" &&
      object.metadata.namespace == "taugrid-rdma-diagnostic" &&
      object.metadata.labels.size() == 5 &&
      object.metadata.labels["app.kubernetes.io/name"] == "nccl-rdma-diagnostic" &&
      object.metadata.labels["app.kubernetes.io/managed-by"] == "taugrid-e2e" &&
      object.metadata.labels["e2e.taugrid.azure.com/diagnostic"] == "nccl-rdma-2x1xh200" &&
      object.metadata.labels["e2e.taugrid.azure.com/invocation"].matches(
        "^nccl-rdma-[0-9a-f]{32}$"
      ) &&
      object.metadata.labels["kueue.x-k8s.io/queue-name"] == "h200-rdma" &&
      (!has(object.metadata.annotations) || object.metadata.annotations.size() == 0) &&
      (!has(object.metadata.finalizers) || object.metadata.finalizers.size() == 0) &&
      (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0)
    message: Job identity, queue, invocation, and ownership must be exact.
  - expression: >-
      has(object.spec.suspend) &&
      (request.operation != "CREATE" || object.spec.suspend == true) &&
      object.spec.completions == 2 &&
      object.spec.parallelism == 2 &&
      object.spec.completionMode == "Indexed" &&
      object.spec.backoffLimit == 0 &&
      object.spec.activeDeadlineSeconds == 900 &&
      object.spec.ttlSecondsAfterFinished == 600 &&
      (!has(object.spec.backoffLimitPerIndex) || object.spec.backoffLimitPerIndex == 0) &&
      (!has(object.spec.maxFailedIndexes) || object.spec.maxFailedIndexes == 0) &&
