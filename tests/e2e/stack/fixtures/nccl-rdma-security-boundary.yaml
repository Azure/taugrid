      (!has(variables.pod.imagePullSecrets) || variables.pod.imagePullSecrets.size() == 0) &&
      (!has(variables.pod.schedulingGates) || variables.pod.schedulingGates.size() == 0) &&
      !has(variables.pod.dnsConfig) &&
      (!has(variables.pod.hostname) || variables.pod.hostname == "") &&
