       object.spec.template.metadata.annotations.size() == 0) &&
      (!has(object.spec.template.metadata.finalizers) ||
       object.spec.template.metadata.finalizers.size() == 0) &&
      (!has(object.spec.template.metadata.ownerReferences) ||
       object.spec.template.metadata.ownerReferences.size() == 0) &&
      (!has(object.spec.template.metadata.name) || object.spec.template.metadata.name == "") &&
