---
# Namespace for the stack integration test.
apiVersion: v1
kind: Namespace
metadata:
  name: e2e-stack
---
# ResourceFlavor — represents CPU hardware for the stack test.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: e2e-stack-flavor
spec: {}
---
# ClusterQueue — sized to admit both the CPU-only inference job (head 2 + 2 workers × 1 CPU + submitter)
# and the GPU variant (head 1 + 1 worker × 2 CPU + 1 GPU + submitter). GPU quota is only exercised
# on GPU-capable clusters; on CPU clusters workloads that don't request GPU are unaffected.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: e2e-stack-cluster-queue
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
    flavors:
    - name: e2e-stack-flavor
      resources:
      - name: cpu
        nominalQuota: 6
      - name: memory
        nominalQuota: 20Gi
      - name: nvidia.com/gpu
        nominalQuota: 2
---
# LocalQueue — RayJobs must carry label kueue.x-k8s.io/queue-name: e2e-stack-queue
# to be managed by Kueue.
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: e2e-stack-queue
  namespace: e2e-stack
spec:
  clusterQueue: e2e-stack-cluster-queue
---
# Separate 16-GPU queue for the manual large Ray Train conformance path.
# The regular stack queue stays small so the PR/hourly smoke tests keep their
# existing quota contract; this queue is only used by nanogpt-rayjob-large-gpu.yaml.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: e2e-stack-large-gpu-flavor
spec: {}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: e2e-stack-large-gpu-cluster-queue
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources: ["cpu", "memory", "nvidia.com/gpu", "rdma/rdma_shared_device_a"]
    flavors:
    - name: e2e-stack-large-gpu-flavor
      resources:
      - name: cpu
        nominalQuota: 96
      - name: memory
        # 16 workers × 48Gi + head 8Gi, with headroom. The 1.7B FSDP job needs
        # far more per-worker memory than nanoGPT (rank0 FULL_STATE_DICT CPU gather
        # + a 16Gi /dev/shm tmpfs that counts against the pod). nanoGPT requests
        # only 16Gi/worker so the larger ceiling does not affect its admission.
        nominalQuota: 832Gi
      - name: nvidia.com/gpu
        nominalQuota: 16
      # InfiniBand extended resource advertised by the RDMA shared device plugin
      # (only present once enable-infiniband.sh has run on the H200 nodes). The
      # FineWeb IB job requests 1 per worker; without this covered resource the
      # Workload would stay Pending. nanoGPT requests no rdma so it is unaffected.
      - name: rdma/rdma_shared_device_a
        nominalQuota: 32
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: e2e-stack-large-gpu-queue
  namespace: e2e-stack
spec:
  clusterQueue: e2e-stack-large-gpu-cluster-queue
