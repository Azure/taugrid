---
apiVersion: v1
kind: Namespace
metadata:
  name: e2e-stack
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: e2e-stack-flavor
spec: {}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: e2e-stack-cluster-queue
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
    flavors:
    - name: e2e-stack-flavor
      resources:
      - name: cpu
        nominalQuota: 6
      - name: memory
        nominalQuota: 20Gi
      - name: nvidia.com/gpu
        nominalQuota: 2
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: e2e-stack-queue
  namespace: e2e-stack
spec:
  clusterQueue: e2e-stack-cluster-queue
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: Topology
metadata:
  name: e2e-stack-gpu-topology
spec:
  levels:
  - nodeLabel: tau.azure.com/network-domain
  - nodeLabel: tau.azure.com/accelerator-domain
  - nodeLabel: kubernetes.io/hostname
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: e2e-stack-large-gpu-flavor
spec:
  nodeLabels:
    {{GPU_NODE_SELECTOR_KEY}}: {{GPU_NODE_SELECTOR_VALUE}}
  topologyName: e2e-stack-gpu-topology
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: e2e-stack-large-gpu-cluster-queue
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
    flavors:
    - name: e2e-stack-large-gpu-flavor
      resources:
      - name: cpu
        nominalQuota: 96
      - name: memory
        nominalQuota: 832Gi
      - name: nvidia.com/gpu
        nominalQuota: 16
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: e2e-stack-large-gpu-queue
  namespace: e2e-stack
spec:
  clusterQueue: e2e-stack-large-gpu-cluster-queue
