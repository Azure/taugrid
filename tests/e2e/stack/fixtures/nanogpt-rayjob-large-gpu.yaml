# Large GPU conformance RayJob: Kueue admits a 16-worker Ray Train job and each
# worker consumes one selected GPU while running a bounded nanoGPT-style workload.
#
# The driver script is embedded directly (head-only initContainer + emptyDir at
# /home/ray/scripts, the same mount path the ConfigMap previously used) instead
# of mounted from a ConfigMap, matching PR1's cli/internal/payload
# wire contract (issues #869/#871 PR3b): the NANOGPT_SCRIPT_PAYLOAD_B64 /
# NANOGPT_SCRIPT_PAYLOAD_DIGEST env values set below are computed from the real
# fixtures/nanogpt_ray_train.py file at test time (see readFixture in
# tests/e2e/testcontext.go), so MultiKueue's worker-cluster dispatch -- which
# does not replicate ConfigMaps -- has everything the head pod needs inside the
# RayJob spec it copies over.
#
# NOTE: this comment intentionally does NOT spell the placeholder names in
# {{DOUBLE_BRACE}} form -- readFixture's substitution is a blind text replace
# of every "{{NAME}}" occurrence in the file, so writing the literal token
# here would duplicate the (potentially large) base64 payload into this
# comment on every substitution. The duplicate text is harmless to the
# resulting Kubernetes object (YAML comments are dropped on parse, never
# reach the API server), but it needlessly bloats the rendered fixture size
# measured in tests -- see TestPayloadFixturesStayUnderSizeLimits in
# tests/e2e/stack/payload_fixtures_test.go, which sizes the parsed+
# JSON-marshaled object rather than raw YAML bytes for exactly this reason.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: e2e-nanogpt-large-gpu
  namespace: {{STACK_NAMESPACE}}
  labels:
    kueue.x-k8s.io/queue-name: {{STACK_LARGE_GPU_QUEUE}}
  annotations:
    tau.azure.com/payload-digest: "{{NANOGPT_SCRIPT_PAYLOAD_DIGEST}}"
spec:
  entrypoint: python /home/ray/scripts/nanogpt_ray_train.py
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 600
  submitterPodTemplate:
    metadata:
      annotations:
        {{NANOGPT_TAS_ANNOTATION}}
    spec:
      restartPolicy: Never
      nodeSelector:
        {{RAY_SUBMITTER_NODE_SELECTOR_KEY}}: {{RAY_SUBMITTER_NODE_SELECTOR_VALUE}}
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
        effect: NoSchedule
      containers:
      - name: ray-job-submitter
        image: {{RAY_IMAGE}}
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
  runtimeEnvYAML: |
    pip:
      packages:
        - {{NANOGPT_TORCH_SPEC}}
        - numpy==2.1.3
      pip_install_options:
        - --no-cache-dir
        - --index-url
        - {{NANOGPT_TORCH_INDEX_URL}}
        - --extra-index-url
        - https://pypi.org/simple
      pip_check: false
    env_vars:
      NANOGPT_DATASET_URIS: "{{NANOGPT_DATASET_URIS}}"
      NANOGPT_DATASET_SHA256S: "{{NANOGPT_DATASET_SHA256S}}"
      NANOGPT_DATASET_TOKEN_COUNTS: "{{NANOGPT_DATASET_TOKEN_COUNTS}}"
      NANOGPT_MIN_TOTAL_TOKENS: "{{NANOGPT_MIN_TOTAL_TOKENS}}"
      NANOGPT_TRAIN_WORKERS: "{{NANOGPT_TRAIN_WORKERS}}"
      NANOGPT_TRAIN_STEPS: "{{NANOGPT_TRAIN_STEPS}}"
      NANOGPT_BATCH_SIZE: "{{NANOGPT_BATCH_SIZE}}"
      NANOGPT_BLOCK_SIZE: "{{NANOGPT_BLOCK_SIZE}}"
      NANOGPT_VOCAB_SIZE: "{{NANOGPT_VOCAB_SIZE}}"
      NANOGPT_REPORT_EVERY: "{{NANOGPT_REPORT_EVERY}}"
      NCCL_SOCKET_IFNAME: "{{NANOGPT_NCCL_SOCKET_IFNAME}}"
      NCCL_IB_DISABLE: "{{NANOGPT_NCCL_IB_DISABLE}}"
      NCCL_DEBUG: "{{NANOGPT_NCCL_DEBUG}}"
      TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  rayClusterSpec:
    rayVersion: "{{RAY_VERSION}}"
    enableInTreeAutoscaling: false
    headGroupSpec:
      rayStartParams:
        num-cpus: "0"
        dashboard-host: "0.0.0.0"
      template:
        metadata:
          annotations:
            {{NANOGPT_TAS_ANNOTATION}}
            # Ray Job driver stdout lives in head-local /tmp/ray session logs,
            # not the ray-head container stdout stream. This sidecar tails the
            # driver log files into its own stdout so adx-mon can ship them via
            # the existing Logs/ContainerLogs path without cluster credentials.
            adx-mon/log-destination: "Logs:ContainerLogs"
        spec:
          initContainers:
          - name: prepare-ray-tmp
            image: {{RAY_IMAGE}}
            command: ["/bin/sh", "-c", "mkdir -p /tmp/ray && chmod 1777 /tmp/ray"]
            securityContext:
              runAsUser: 0
            env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            volumeMounts:
            - name: ray-tmp
              mountPath: /tmp/ray
              subPathExpr: $(POD_NAME)
          - name: tau-payload
            image: {{RAY_IMAGE}}
            command:
            - python3
            - -c
            - |
              import base64
              import hashlib
              import json
              import os
              import sys

              raw_b64 = os.environ["TAU_PAYLOAD_B64"]
              want_digest = os.environ["TAU_PAYLOAD_DIGEST"]
              target_dir = os.environ["TAU_PAYLOAD_TARGET_DIR"]

              raw = base64.b64decode(raw_b64)
              got_digest = hashlib.sha256(raw).hexdigest()
              if got_digest != want_digest:
                  sys.stderr.write(
                      "tau-payload: integrity check failed: digest=%s want=%s\n" % (got_digest, want_digest)
                  )
                  sys.exit(1)

              envelope = json.loads(raw)
              files = envelope.get("files", [])
              os.makedirs(target_dir, exist_ok=True)
              for f in files:
                  name = f["name"]
                  if not name or name in (".", "..") or "/" in name or "\\" in name:
                      sys.stderr.write("tau-payload: rejecting unsafe file name %r\n" % (name,))
                      sys.exit(1)
                  data = base64.b64decode(f["data"])
                  path = os.path.join(target_dir, name)
                  with open(path, "wb") as fh:
                      fh.write(data)
                  os.chmod(path, 0o644)

              sys.stderr.write("tau-payload: wrote %d file(s) to %s\n" % (len(files), target_dir))
            env:
            - name: TAU_PAYLOAD_B64
              value: "{{NANOGPT_SCRIPT_PAYLOAD_B64}}"
            - name: TAU_PAYLOAD_DIGEST
              value: "{{NANOGPT_SCRIPT_PAYLOAD_DIGEST}}"
            - name: TAU_PAYLOAD_TARGET_DIR
              value: /home/ray/scripts
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 250m
                memory: 128Mi
            volumeMounts:
            - name: script
              mountPath: /home/ray/scripts
          containers:
          - name: ray-head
            image: {{RAY_IMAGE}}
            env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            resources:
              requests:
                cpu: "2"
                memory: "8Gi"
              limits:
                cpu: "2"
                memory: "8Gi"
            startupProbe:
              httpGet:
                path: /api/version
                port: 8265
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 90
            lifecycle:
              preStop:
                exec:
                  command: ["/bin/sh", "-c", "rm -rf /tmp/ray/* || true"]
            volumeMounts:
            - name: ray-tmp
              mountPath: /tmp/ray
              subPathExpr: $(POD_NAME)
            - name: script
              mountPath: /home/ray/scripts
              readOnly: true
          - name: ray-driver-log-offload
            image: {{RAY_IMAGE}}
            command: ["/bin/bash", "-lc", "--"]
            args:
            - |
              set -euo pipefail
              ray_root="${TAU_RAY_TMP:-/tmp/ray}"
              poll_seconds="${TAU_RAY_LOG_POLL_SECONDS:-1}"
              seen_paths=""
              tail_pids=()
              canonical_path() {
                local path="$1"
                local dir base
                dir="$(cd -P "$(dirname "$path")" && pwd)"
                base="$(basename "$path")"
                printf '%s/%s\n' "$dir" "$base"
              }
              has_seen() {
                local needle="$1"
                local seen
                while IFS= read -r seen; do
                  [[ "$seen" == "$needle" ]] && return 0
                done <<< "$seen_paths"
                return 1
              }
              start_tail() {
                local real="$1"
                seen_paths="${seen_paths}${real}"$'\n'
                tail -n +1 -F "$real" &
                tail_pids+=("$!")
              }
              discover_logs() {
                local entry candidate real
                local -a roots=("$ray_root/session_latest/logs")
                # Default contract: tail /tmp/ray/session_latest/logs/job-driver-*.log,
                # plus concrete session_* directories so session_latest flips do not drop logs.
                shopt -s nullglob
                for entry in "$ray_root"/session_*/logs; do
                  [[ -d "$entry" ]] && roots+=("$entry")
                done
                shopt -u nullglob
                for entry in "${roots[@]}"; do
                  [[ -d "$entry" ]] || continue
                  shopt -s nullglob
                  for candidate in "$entry"/job-driver-*.log; do
                    [[ -f "$candidate" ]] || continue
                    real="$(canonical_path "$candidate")"
                    if has_seen "$real"; then
                      continue
                    fi
                    start_tail "$real"
                  done
                  shopt -u nullglob
                done
              }
              cleanup() {
                local pid
                for pid in "${tail_pids[@]:-}"; do
                  kill "$pid" 2>/dev/null || true
                done
                wait || true
              }
              trap cleanup EXIT INT TERM
              while true; do
                discover_logs
                sleep "$poll_seconds"
              done
            env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            resources:
              requests:
                cpu: "10m"
                memory: "32Mi"
              limits:
                cpu: "100m"
                memory: "128Mi"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              capabilities:
                drop:
                - ALL
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
            - name: ray-tmp
              mountPath: /tmp/ray
              subPathExpr: $(POD_NAME)
              readOnly: true
          volumes:
          - name: ray-tmp
            emptyDir: {}
          - name: script
            emptyDir: {}
          nodeSelector:
            {{RAY_SUBMITTER_NODE_SELECTOR_KEY}}: {{RAY_SUBMITTER_NODE_SELECTOR_VALUE}}
          tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
            effect: NoSchedule
    workerGroupSpecs:
    - groupName: nanogpt-workers
      replicas: {{NANOGPT_TRAIN_WORKERS}}
      minReplicas: {{NANOGPT_TRAIN_WORKERS}}
      maxReplicas: {{NANOGPT_TRAIN_WORKERS}}
      rayStartParams: {}
      template:
        metadata:
          annotations:
            {{NANOGPT_TAS_ANNOTATION}}
        spec:
          initContainers:
          - name: prepare-ray-tmp
            image: {{RAY_IMAGE}}
            command: ["/bin/sh", "-c", "mkdir -p /tmp/ray && chmod 1777 /tmp/ray"]
            securityContext:
              runAsUser: 0
            env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            volumeMounts:
            - name: ray-tmp
              mountPath: /tmp/ray
              subPathExpr: $(POD_NAME)
          containers:
          - name: ray-worker
            image: {{RAY_IMAGE}}
            env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            resources:
              requests:
                cpu: "4"
                memory: "16Gi"
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: "16Gi"
                nvidia.com/gpu: "1"
            startupProbe:
              httpGet:
                path: /api/healthz
                port: 52365
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 90
            lifecycle:
              preStop:
                exec:
                  command: ["/bin/sh", "-c", "rm -rf /tmp/ray/* || true"]
            volumeMounts:
            - name: ray-tmp
              mountPath: /tmp/ray
              subPathExpr: $(POD_NAME)
          volumes:
          - name: ray-tmp
            emptyDir: {}
          nodeSelector:
            {{GPU_NODE_SELECTOR_KEY}}: {{GPU_NODE_SELECTOR_VALUE}}
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          - key: sku
            operator: Exists
            effect: NoSchedule
