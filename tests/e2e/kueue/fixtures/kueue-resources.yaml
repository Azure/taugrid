---
apiVersion: v1
kind: Namespace
metadata:
  name: e2e-kueue
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: default-cpu
spec: {}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: e2e-cluster-queue
spec:
  namespaceSelector: {}
  resourceGroups:
  - coveredResources:
    - "cpu"
    flavors:
    - name: default-cpu
      resources:
      - name: "cpu"
        nominalQuota: 3
  queueingStrategy: BestEffortFIFO
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: e2e-queue
  namespace: e2e-kueue
spec:
  clusterQueue: e2e-cluster-queue
