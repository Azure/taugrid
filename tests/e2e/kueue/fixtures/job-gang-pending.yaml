apiVersion: batch/v1
kind: Job
metadata:
  name: e2e-gang-pending
  namespace: e2e-kueue
  labels:
    kueue.x-k8s.io/queue-name: e2e-queue
spec:
  suspend: true
  parallelism: 2
  completions: 2
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "sleep infinity"]
        resources:
          requests:
            cpu: "1"
