# Gang scheduling test — PENDING (insufficient unused quota) scenario
#
# This Job needs 2 pods × 1 CPU = 2 CPU total.
# The ClusterQueue has 3 CPU quota — this COULD fit in an empty queue.
# But when job-gang-fits is admitted (using 2 CPU), only 1 CPU remains.
# Kueue will NOT admit this Job — "insufficient unused quota".
apiVersion: batch/v1
kind: Job
metadata:
  name: e2e-gang-pending
  namespace: e2e-kueue
  labels:
    kueue.x-k8s.io/queue-name: e2e-queue
spec:
  suspend: true
  parallelism: 2
  completions: 2
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "sleep infinity"]
        resources:
          requests:
            cpu: "1"  # 1 CPU per pod → 2 × 1 = 2 CPU total ≤ 3 CPU capacity, but only 1 unused
