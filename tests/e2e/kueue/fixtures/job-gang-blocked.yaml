# Gang scheduling test — BLOCKED scenario
#
# This Job needs 2 pods × 2 CPU = 4 CPU total.
# The ClusterQueue only has 3 CPU quota.
# Kueue will NOT admit this Job — zero pods will be created.
# This demonstrates gang scheduling: all-or-nothing.
apiVersion: batch/v1
kind: Job
metadata:
  name: e2e-gang-blocked
  namespace: e2e-kueue
  labels:
    kueue.x-k8s.io/queue-name: e2e-queue
spec:
  suspend: true
  parallelism: 2
  completions: 2
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "sleep infinity"]
        resources:
          requests:
            cpu: "2"    # 2 CPU per pod → 2 × 2 = 4 CPU total > 3 CPU quota
