---
apiVersion: v1
kind: Namespace
metadata:
  name: e2e-kuberay
---
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: e2e-raycluster
  namespace: e2e-kuberay
spec:
  rayVersion: "{{RAY_VERSION}}"
  headGroupSpec:
    rayStartParams:
      dashboard-host: "0.0.0.0"
    template:
      spec:
        containers:
        - name: ray-head
          image: {{RAY_IMAGE}}
          ports:
          - containerPort: 6379
            name: gcs
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "1"
              memory: "4Gi"
          startupProbe:
            httpGet:
              path: /api/version
              port: 8265
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
  workerGroupSpecs:
  - groupName: workers
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    rayStartParams: {}
    template:
      spec:
        containers:
        - name: ray-worker
          image: {{RAY_IMAGE}}
          resources:
            requests:
              cpu: "1"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /api/healthz
              port: 52365
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
