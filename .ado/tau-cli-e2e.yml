name: tau-cli-e2e_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - .ado/tau-cli-e2e.yml
      - .ado/templates/install-kind.yml
      - charts/tau-core-controller/**
      - charts/taugrid-core/**
      - charts/taugrid/**
      - cli/**
      - core/**

pr:
  autoCancel: true
  branches:
    include:
      - main
  paths:
    include:
      - .ado/tau-cli-e2e.yml
      - .ado/templates/install-kind.yml
      - charts/tau-core-controller/**
      - charts/taugrid-core/**
      - charts/taugrid/**
      - cli/**
      - core/**

pool:
  vmImage: ubuntu-24.04

variables:
  goVersion: 1.26.5
  helmVersion: 3.18.6
  kindVersion: v0.32.0
  kubectlVersion: 1.36.3

jobs:
  - job: tau_cli_kind_e2e
    displayName: Tau CLI Kind E2E
    timeoutInMinutes: 45
    steps:
      - checkout: self
        clean: true
        fetchDepth: 1

      - task: GoTool@0
        displayName: Install Go $(goVersion)
        inputs:
          version: $(goVersion)

      - task: KubectlInstaller@0
        displayName: Install kubectl $(kubectlVersion)
        inputs:
          kubectlVersion: $(kubectlVersion)

      - task: HelmInstaller@1
        displayName: Install Helm $(helmVersion)
        inputs:
          helmVersionToInstall: $(helmVersion)

      - template: templates/install-kind.yml
        parameters:
          version: $(kindVersion)

      - bash: |
          set -euo pipefail
          docker info >/dev/null
          go version
          kind version
          kubectl version --client
          helm version --short
        displayName: Verify E2E prerequisites

      - bash: make -C cli test-kind-e2e
        displayName: Run Tau CLI Kind E2E
        env:
          TAU_KIND_DELETE_CLUSTER: "1"

      - bash: kind delete cluster --name tau-kind || true
        displayName: Clean up Kind cluster
        condition: always()
