name: market-policy
engine: ray
entrypoint: train.py

experiment:
  project: Tau examples
  name: market-policy-training
  group: browser-inference

runtime:
  # Immutable Ray image with PyTorch + CUDA already installed. Flex workers do
  # not have PyPI egress, so runtime.pip would fail after admission.
  image: rayproject/ray-llm@sha256:296d0c9d6b5d3f41a645b77989ec2fabadd1425a0c2052da5b1943dfc8b31b51
  env:
    MARKET_POLICY_REQUIRE_CUDA: "1"
    MARKET_POLICY_USE_RAY: "1"
    MARKET_POLICY_TRAINING_EXAMPLES: "8000"
    MARKET_POLICY_VALIDATION_EXAMPLES: "2000"
    MARKET_POLICY_STEPS: "4000"
    MARKET_POLICY_BATCH_SIZE: "256"
    MARKET_POLICY_OUTPUT: /data/tau-workspaces/default/market-policy/tau-market-policy.json
    MARKET_POLICY_SEED: "20260626"

compute:
  workers: 1
  gpus_per_worker: 1

storage:
  data_pvc: blob-training
  output: /data/tau-workspaces/default/market-policy

policy:
  workspace: default
  namespace: tau-default
  queue: jobqueue
  gpu_class: any
  topology: single-node-nvlink
  node_selector:
    kueue.azure.com/gpu-series: nd-h200-v5
  disable_default_priorities: true
