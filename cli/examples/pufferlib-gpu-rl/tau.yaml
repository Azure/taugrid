name: pufferlib-gpu-rl
engine: ray
entrypoint: train.py

experiment:
  project: Tau examples
  name: pufferlib-gpu-rl-market-making
  group: gpu-rl

runtime:
  pip:
    - pufferlib==3.0.0
    - gymnasium==0.29.1
  env:
    PUFFER_REQUIRE_CUDA: "1"
    PUFFER_NUM_ENVS: "1"
    PUFFER_NUM_WORKERS: "1"
    PUFFER_AGENTS_PER_ENV: "8192"
    PUFFER_UPDATES: "2000"
    PUFFER_HIDDEN_SIZE: "1024"
    PUFFER_AUX_LOSS_COEF: "0.05"
    PUFFER_SEED: "20260626"

compute:
  workers: 1
  gpus_per_worker: 1

policy:
  namespace: ray
  queue: dev
  gpu_class: any
  node_selector:
    agentpool: h200pool
  disable_default_priorities: true
