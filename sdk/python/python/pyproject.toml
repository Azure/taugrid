[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tau"
dynamic = ["version"]
description = "Python-first Tau SDK. Researchers write Python; the Go tau CLI remains the canonical Kubernetes, Kueue, Ray, and expstore executor."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "TauGrid maintainers" }]
dependencies = [
    "PyYAML>=6.0.3",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
widgets = [
    "kubernetes>=30.1.0",
    "ipywidgets>=8.1.0",
    "ipython>=8.0.0",
    "jupyter_server>=2.0.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff==0.16.8",
]
lightning = [
    "lightning>=2.6.6",
]

[project.entry-points."ipython.extensions"]
taugrid = "tau.widgets.ipython:load_ipython_extension"

[project.entry-points."jupyter_server.extension"]
taugrid = "tau.jupyter"

[tool.setuptools.packages.find]
include = ["tau*"]

[tool.setuptools.package-data]
tau = ["labextension/**"]

[tool.setuptools.dynamic]
version = { attr = "tau.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
