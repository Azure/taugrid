# staticcheck configuration, shared by the taucore, tau, and taugrid-portal modules.
#
# The baseline is zero findings. A linter introduced with pre-existing violations
# grandfathered in is a linter people learn to scroll past, so anything we are not
# willing to act on is disabled here with a reason rather than left to accumulate.

checks = [
    # staticcheck's documented default set. Spelled out rather than inherited so
    # that the two removals below are visibly additions to a known baseline, and
    # so a future staticcheck release cannot silently widen what CI enforces.
    "all",
    "-ST1000", # doc comment on every package -- busywork for internal packages
    "-ST1003", # naming conventions; overlaps the acronym handling we already do
    "-ST1016", # consistent receiver names
    "-ST1020", # comment on exported function
    "-ST1021", # comment on exported type
    "-ST1022", # comment on exported variable
    "-ST1023", # omit redundant type from variable declaration

    # ST1005: "error strings should not be capitalized".
    #
    # The rule exists because errors get wrapped mid-sentence
    # (fmt.Errorf("doing x: %w", err)), where a capital letter reads wrong. But
    # every occurrence in this repo starts with a proper noun -- Helm, Git, Tau,
    # Kueue, Kusto, Stellar -- or a literal config field name (Replicas,
    # Autoscaling). Those are correctly capitalized mid-sentence. staticcheck
    # matches against a hardcoded list of known initialisms and has no way to
    # learn our product names, so it flags all of them.
    #
    # Complying would make the messages worse ("kusto endpoint is required",
    # "helm is required"), so we drop the check instead of the capitalization.
    "-ST1005",

    # S1016: "should convert x to T instead of using struct literal".
    #
    # Both occurrences convert a JSON wire type into an exported API type whose
    # field sets happen to coincide today (core/runs jobCondition -> StatusCondition,
    # portal/internal/autocapture kubeCondition -> Condition). The conversion
    # compiles precisely because the shapes match, and that is the problem: it
    # welds them together, so adding a field to the Kubernetes JSON subset we
    # decode would force a lockstep change to a public API type. The explicit
    # struct literal is the seam between the two, and we want to keep paying its
    # small cost.
    "-S1016",
]
