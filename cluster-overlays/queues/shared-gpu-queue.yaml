  name: test-team-c
  namespace: ray
  labels:
    tau.azure.com/managed-by: tau-shared-gpu
    tau.azure.com/queue-role: test-team
spec:
  clusterQueue: tau-gpu-cq
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: backfill
  namespace: ray
  labels:
    tau.azure.com/managed-by: tau-shared-gpu
    tau.azure.com/queue-role: backfill
spec:
  clusterQueue: tau-gpu-cq
