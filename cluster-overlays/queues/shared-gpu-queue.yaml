kind: WorkloadPriorityClass
metadata:
  name: tau-eval-default
  labels:
    tau.azure.com/managed-by: tau-shared-gpu
value: 700
description: Default Kueue priority for Tau evaluation work.
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
