---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: serving-cq
  labels:
    tau.azure.com/managed-by: tau-serving-dra
spec:
  preemption:
    reclaimWithinCohort: Never
    borrowWithinCohort:
      policy: Never
    withinClusterQueue: Never
  resourceGroups:
    - coveredResources: [cpu, memory, gpu.nvidia.com, nvidia.com/gpu]
      flavors:
        - name: gpu-any
          resources:
            - name: cpu
              nominalQuota: "16"
            - name: memory
              nominalQuota: 80Gi
            - name: gpu.nvidia.com
              nominalQuota: "2"
            - name: nvidia.com/gpu
              nominalQuota: "2"
