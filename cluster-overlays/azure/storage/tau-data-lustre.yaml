---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: amlfs-rwx
provisioner: azurelustre.csi.azure.com
parameters:
  sku-name: AMLFS-Durable-Premium-250
  zone: REPLACE_ZONE
  maintenance-day-of-week: Sunday
  maintenance-time-of-day-utc: "22:00"
  # Region the AMLFS cluster is created in. MUST match the GPU region you pin jobs
  location: REPLACE_REGION
  resource-group-name: REPLACE_RG
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - noatime
  - flock
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blob-training
  namespace: ray
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: amlfs-rwx
  resources:
    requests:
      storage: 4Ti
