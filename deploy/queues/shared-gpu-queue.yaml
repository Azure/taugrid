apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: tau-gpu-cq
  labels:
    tau.azure.com/managed-by: tau-shared-gpu
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ray
  queueingStrategy: BestEffortFIFO
  preemption:
    withinClusterQueue: LowerPriority
  resourceGroups:
    - coveredResources: [cpu, memory, gpu.nvidia.com, nvidia.com/gpu]
      flavors:
        - name: tau-system
          resources:
            - { name: cpu,    nominalQuota: "10000" }
            - { name: memory, nominalQuota: 100Ti   }
            - { name: gpu.nvidia.com, nominalQuota: "0" }
            - { name: nvidia.com/gpu, nominalQuota: "0" }
        - name: tau-gpu-a100-80gb-v2
          resources: &gpu-quota
            - { name: cpu,            nominalQuota: "10000" }
            - { name: memory,         nominalQuota: 100Ti   }
            - { name: gpu.nvidia.com, nominalQuota: "64"    }
            - { name: nvidia.com/gpu, nominalQuota: "64"    }
        - name: tau-gpu-h100-95gb-v2
          resources: *gpu-quota
        - name: tau-gpu-h200-141gb-v2
          resources: *gpu-quota
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: admin
  namespace: ray
  labels:
    tau.azure.com/managed-by: tau-shared-gpu
    tau.azure.com/queue-role: admin
spec:
  clusterQueue: tau-gpu-cq
---
