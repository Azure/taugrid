name: sweep-long-run
engine: rayjob
run:
  entrypoint: train.py
  working_dir: .
compute:
  workers: 2
  gpus_per_worker: 0
  head_cpu_request: "1"
  head_memory_request: 4Gi
  head_memory_limit: 4Gi
  worker_cpu_request: "2"
  worker_memory_request: 4Gi
  worker_memory_limit: 4Gi
runtime:
  image: mcr.microsoft.com/aks/ai-runtime/ray:py3.12-ray2.54.0
  pip:
    - torch>=2.4.0
  env:
    DEMO_EXPERIMENT: "schedule-study"
    DEMO_VARIANT: "steps-96"
    DEMO_LR: "2e-3"
    DEMO_STEPS: "96"
