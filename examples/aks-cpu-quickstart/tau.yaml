schema_version: 1
name: aks-cpu-quickstart
run:
  entrypoint: ../cpu-multi-interest-ray/train.py
  workload_kind: rayjob
resource_naming:
  prefix: tau
compute:
  gpus: 0
  cpus: 1
  memory: 12Gi
  workers: 5
  worker_cpus: 2
  worker_memory: 4Gi
runtime:
  image: mcr.microsoft.com/aks/ai-runtime/ray:py3.12-ray2.54.0
  pip:
    - PyYAML>=6.0
    - torch>=2.4.0
