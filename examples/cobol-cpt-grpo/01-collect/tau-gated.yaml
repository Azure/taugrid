name: cobol-collect-gated
engine: job
entrypoint: collect-gated.py

experiment:
  project: cobol-cpt-grpo
  name: collect-gated
  group: data

runtime:
  image: python:3.11.17-bookworm@sha256:c255868cf24d6ca01031d262fa952f59b108b96776625f3d7f1af85d5f28e26a
  env:
    DATA_ROOT: /data/datasets/cobol
    HF_HOME: /tmp/hf-cache
    PYTHONUNBUFFERED: "1"
  env_secret:
    HF_TOKEN: hf-token:token

compute:
  gpus: 0
  cpu_request: "4"
  memory_request: 16Gi
  cpu_limit: "8"
  memory_limit: 32Gi

storage:
  data_pvc: workspace-data
  output: /data/projects/taugrid-default/runs/cobol-cpt-grpo/collect-gated

policy:
  workspace: taugrid-default
