name: cobol-data-prep
engine: job
entrypoint: prepare_data.py

experiment:
  project: cobol-cpt-grpo
  name: data-prep
  group: data

runtime:
  image: python:3.11.17-bookworm@sha256:c255868cf24d6ca01031d262fa952f59b108b96776625f3d7f1af85d5f28e26a
  env:
    RAW: /data/datasets/cobol/raw
    OUT: /data/datasets/cobol/prepared
    REPORT: /data/datasets/cobol/prepared/prep-report.json
    PYTHONUNBUFFERED: "1"

compute:
  gpus: 0
  cpu_request: "1"
  memory_request: 4Gi
  cpu_limit: "4"
  memory_limit: 8Gi

storage:
  data_pvc: workspace-data
  output: /data/projects/taugrid-default/runs/cobol-cpt-grpo/data-prep

policy:
  workspace: taugrid-default
