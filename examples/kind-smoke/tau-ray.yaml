name: tau-kind-ray
engine: rayjob
entrypoint: ray_train.py
runtime:
  image: mcr.microsoft.com/aks/ai-runtime/ray:py3.12-ray2.54.0
  env:
    KIND_RAY_MARKER: tau-kind-ray
compute:
  workers: 2
  gpus_per_worker: 0
  head_cpu_request: 20m
  head_memory_request: 512Mi
  head_cpu_limit: "1"
  head_memory_limit: 6Gi
  worker_cpu_request: 50m
  worker_memory_request: 256Mi
  worker_cpu_limit: "1"
  worker_memory_limit: 768Mi
policy:
  namespace: ray
  profile: kind-cpu-ray
  queue: kind-cpu
  lane: training
experiment:
  project: Tau Local
  name: kind-ray-smoke
  group: local-kind
