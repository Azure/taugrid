name: Feature request
description: Propose an improvement to TauGrid
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before proposing an implementation. Significant changes may require a design discussion before code is accepted.

  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who needs this, what are they trying to do, and what blocks them today?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior or outcome you would like to see.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: If you have an approach in mind, describe it and any public API, CLI, CRD, compatibility, or migration impact.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing features, workarounds, or other approaches you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, links, or related projects. Do not include confidential or sensitive information.

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and roadmap items for this request.
          required: true
        - label: This request does not include confidential or security-sensitive information.
          required: true
