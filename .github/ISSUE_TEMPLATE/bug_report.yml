name: Bug report
description: Report a reproducible problem in TauGrid
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Search existing issues first and do not include secrets, private endpoints, customer data, or security vulnerabilities.

  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect to happen?
      placeholder: Describe the observed and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest configuration and steps that reproduce the problem.
      placeholder: |
        1. Install or configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: TauGrid or tau version
      description: Provide a release version, image/chart version, or commit SHA.
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant Kubernetes, Helm, cloud/provider, GPU, OS, and architecture versions.
      placeholder: Kubernetes 1.x, Helm 3.x, Linux amd64, GPU model, installation method
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Add sanitized logs, events, status, or rendered resources. Remove credentials and private identifiers.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context, suspected cause, or workaround.

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets, private endpoints, customer data, and other sensitive information.
          required: true
        - label: This is not a security vulnerability.
          required: true
