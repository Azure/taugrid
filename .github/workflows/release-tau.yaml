name: Release tau CLI

run-name: Release tau CLI ${{ github.ref_type == 'tag' && github.ref_name || 'v0.3.0' }}

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated SemVer tag matching the dispatch ref
        required: true
        type: string
      allow_main_release_notes:
        description: Recover the v0.3.0 release notes from main
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.3.0' }}
  RELEASE_SOURCE_REF: ${{ github.ref_type == 'tag' && github.sha || 'cbf4e83ee30fdb5764040a02ee948aba8dd42e83' }}

concurrency:
  group: release-tau-${{ github.ref_type == 'tag' && github.ref_name || 'v0.3.0' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Validate immutable release inputs
        env:
          ALLOW_MAIN_RELEASE_NOTES: ${{ inputs.allow_main_release_notes }}
          DISPATCH_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              case "$GITHUB_REF_TYPE:$GITHUB_REF" in
                tag:*)
                  if [[ "$DISPATCH_TAG" != "$GITHUB_REF_NAME" ]]; then
                    echo "tag input must match the dispatch ref $GITHUB_REF_NAME" >&2
                    exit 1
                  fi
                  if [[ "$ALLOW_MAIN_RELEASE_NOTES" == "true" ]]; then
                    echo "allow_main_release_notes is only valid for the v0.3.0 recovery" >&2
                    exit 1
                  fi
                  ;;
                branch:refs/heads/main)
                  if [[ "$DISPATCH_TAG" != "v0.3.0" ||
                        "$ALLOW_MAIN_RELEASE_NOTES" != "true" ]]; then
                    echo "main dispatch is only supported for the v0.3.0 recovery" >&2
                    exit 1
                  fi
                  ;;
                *)
                  echo "Dispatch from the release tag, not $GITHUB_REF" >&2
                  exit 1
                  ;;
              esac
              TAG="$DISPATCH_TAG"
              ;;
            push)
              if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
                echo "Expected a tag push, got $GITHUB_REF" >&2
                exit 1
              fi
              TAG="$GITHUB_REF_NAME"
              ;;
            *)
              echo "Unsupported release event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9]*[A-Za-z-][0-9A-Za-z-]*)))*)?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! "$TAG" =~ $semver_re ]]; then
            echo "tag must be SemVer with a v prefix, got '$TAG'" >&2
            exit 1
          fi
          if [[ "$TAG" != "$RELEASE_TAG" ]]; then
            echo "tag $TAG does not match release ref $RELEASE_TAG" >&2
            exit 1
          fi

          git fetch --force origin main "refs/tags/$TAG:refs/tags/$TAG"
          if [[ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]]; then
            echo "$TAG must be an annotated tag" >&2
            exit 1
          fi

          commit="$(git rev-parse "$TAG^{commit}")"
          source_commit="$(git rev-parse "$RELEASE_SOURCE_REF^{commit}")"
          if [[ "$commit" != "$source_commit" ]]; then
            echo "$TAG points to $commit, not the workflow source $source_commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "$TAG points to $commit, which is not on main" >&2
            exit 1
          fi

          notes_path="cli/releases/$TAG.md"
          notes_source="$commit"
          if ! git cat-file -e "$notes_source:$notes_path"; then
            if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ||
                  "$ALLOW_MAIN_RELEASE_NOTES" != "true" ]]; then
              echo "$notes_path is required in the tagged commit" >&2
              exit 1
            fi
            if ! git cat-file -e "origin/main:$notes_path"; then
              echo "$notes_path is also missing from main" >&2
              exit 1
            fi
            notes_source="$(git rev-parse 'origin/main^{commit}')"
          fi
          git show "$notes_source:$notes_path" > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

          status="$(
            curl --silent --show-error --output "$RUNNER_TEMP/existing-release.json" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG"
          )"
          case "$status" in
            404)
              ;;
            200)
              echo "Published GitHub Release $TAG already exists; releases are never overwritten" >&2
              exit 1
              ;;
            *)
              echo "cannot verify whether GitHub Release $TAG exists (HTTP $status)" >&2
              exit 1
              ;;
          esac

          date="$(git show -s --format=%cI "$commit")"
          {
            echo "### Validated release input"
            echo
            echo "- Tag: \`$TAG\`"
            echo "- Commit: \`$commit\`"
            echo "- Commit date: \`$date\`"
            echo "- Release notes source: \`$notes_source\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validated release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tau-release-notes-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 1

  gates:
    name: Run release gates
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Test Go release modules
        run: |
          set -euo pipefail
          (cd core && go test ./...)
          (cd cli && go test ./...)

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test Python SDK compatibility
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e "./sdk/python/python[dev]"
          python -m pytest sdk/python/python/tests

      - name: Test release installer
        run: |
          shellcheck cli/scripts/install-tau.sh cli/scripts/test-install-tau.sh
          make -C cli test-installer

  build:
    name: Build reproducible release assets
    needs: validate
    runs-on: macos-15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Build twice and compare
        env:
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail

          COMMIT="$(git rev-parse HEAD)"
          DATE="$(git show -s --format=%cI HEAD)"
          first="$RUNNER_TEMP/tau-release-a"
          second="$RUNNER_TEMP/tau-release-b"
          make -C cli release-assets \
            VERSION="$VERSION" COMMIT="$COMMIT" DATE="$DATE" RELEASE_DIR="$first"
          make -C cli release-assets \
            VERSION="$VERSION" COMMIT="$COMMIT" DATE="$DATE" RELEASE_DIR="$second"

          expected=(
            LICENSE
            SHA256SUMS
            install.sh
            tau-darwin-amd64
            tau-darwin-arm64
            tau-gen-darwin-amd64
            tau-gen-darwin-arm64
            tau-gen-linux-amd64
            tau-gen-linux-arm64
            tau-linux-amd64
            tau-linux-arm64
          )
          printf '%s\n' "${expected[@]}" | sort > "$RUNNER_TEMP/expected-assets"
          find "$first" -maxdepth 1 -type f -exec basename {} \; | sort > "$RUNNER_TEMP/actual-assets"
          diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/actual-assets"

          diff -u "$first/SHA256SUMS" "$second/SHA256SUMS"
          (cd "$first" && shasum -a 256 --check SHA256SUMS)
          while read -r _ asset; do
            cmp "$first/$asset" "$second/$asset"
            if [[ "$asset" == tau-* ]]; then
              go version -m "$first/$asset"
            fi
          done < "$first/SHA256SUMS"

          host_arch="$(go env GOHOSTARCH)"
          test "$("$first/tau-darwin-$host_arch" version --short)" = "$VERSION"
          "$first/tau-darwin-$host_arch" --help >/dev/null
          "$first/tau-gen-darwin-$host_arch" --help >/dev/null

      - name: Upload validated release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tau-release-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/tau-release-a/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish immutable GitHub Release
    needs:
      - validate
      - gates
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - name: Download validated release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tau-release-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/tau-release

      - name: Download validated release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tau-release-notes-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/tau-release-notes

      - name: Create, verify, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail

          EXPECTED_COMMIT="$(git rev-parse HEAD)"
          verify_remote_tag() {
            remote_commit="$(
              git ls-remote origin "refs/tags/$TAG^{}" |
                awk 'NR == 1 { print $1 }'
            )"
            if [[ "$remote_commit" != "$EXPECTED_COMMIT" ]]; then
              echo "$TAG no longer points to validated commit $EXPECTED_COMMIT" >&2
              exit 1
            fi
          }

          release_dir="$RUNNER_TEMP/tau-release"
          (cd "$release_dir" && shasum -a 256 --check SHA256SUMS)

          expected=(
            LICENSE
            SHA256SUMS
            install.sh
            tau-darwin-amd64
            tau-darwin-arm64
            tau-gen-darwin-amd64
            tau-gen-darwin-arm64
            tau-gen-linux-amd64
            tau-gen-linux-arm64
            tau-linux-amd64
            tau-linux-arm64
          )
          printf '%s\n' "${expected[@]}" | sort > "$RUNNER_TEMP/expected-assets"
          find "$release_dir" -maxdepth 1 -type f -exec basename {} \; | sort > "$RUNNER_TEMP/local-assets"
          diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/local-assets"

          find_release() {
            gh api --paginate \
              "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.TAG) | [.id, .draft] | @tsv' \
              > "$RUNNER_TEMP/matching-releases.tsv"
            mapfile -t matching_releases < "$RUNNER_TEMP/matching-releases.tsv"
            if (( ${#matching_releases[@]} > 1 )); then
              echo "found multiple GitHub Releases for $TAG" >&2
              exit 1
            fi

            release_id=""
            release_is_draft=""
            if (( ${#matching_releases[@]} == 1 )); then
              IFS=$'\t' read -r release_id release_is_draft \
                <<< "${matching_releases[0]}"
            fi
          }

          find_release
          if [[ -n "$release_id" && "$release_is_draft" != "true" ]]; then
            echo "Published GitHub Release $TAG already exists; releases are never overwritten" >&2
            exit 1
          fi

          release_flags=(
            --repo "$GITHUB_REPOSITORY"
            --draft
            --verify-tag
            --title "TauGrid $TAG"
            --notes-file "$RUNNER_TEMP/tau-release-notes/release-notes.md"
          )
          release_is_prerelease=false
          version_without_build="${TAG%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            release_flags+=(--prerelease)
            release_is_prerelease=true
          fi

          if [[ -z "$release_id" ]]; then
            verify_remote_tag
            gh release create "$TAG" "${release_flags[@]}" "$release_dir"/*
            find_release
            if [[ -z "$release_id" || "$release_is_draft" != "true" ]]; then
              echo "cannot find the draft GitHub Release created for $TAG" >&2
              exit 1
            fi
          else
            echo "Resuming draft GitHub Release $release_id for $TAG"
          fi

          gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id" \
            > "$RUNNER_TEMP/draft-release.json"
          test "$(jq -r .tag_name "$RUNNER_TEMP/draft-release.json")" = "$TAG"
          test "$(jq -r .draft "$RUNNER_TEMP/draft-release.json")" = "true"
          test "$(jq -r .name "$RUNNER_TEMP/draft-release.json")" = "TauGrid $TAG"
          test "$(jq -r .prerelease "$RUNNER_TEMP/draft-release.json")" = \
            "$release_is_prerelease"
          jq -j .body "$RUNNER_TEMP/draft-release.json" \
            > "$RUNNER_TEMP/github-release-notes.md"
          diff -u \
            "$RUNNER_TEMP/tau-release-notes/release-notes.md" \
            "$RUNNER_TEMP/github-release-notes.md"

          gh api --paginate \
            "/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[].name' | sort > "$RUNNER_TEMP/github-assets"
          diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/github-assets"

          verify_dir="$RUNNER_TEMP/downloaded-release"
          mkdir -p "$verify_dir"
          gh api --paginate \
            "/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.id, .name] | @tsv' > "$RUNNER_TEMP/github-assets.tsv"
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api \
              --header "Accept: application/octet-stream" \
              "/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "$verify_dir/$asset_name"
            cmp "$release_dir/$asset_name" "$verify_dir/$asset_name"
          done < "$RUNNER_TEMP/github-assets.tsv"
          (cd "$verify_dir" && shasum -a 256 --check SHA256SUMS)

          verify_remote_tag
          gh api --method PATCH \
            "/repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false > "$RUNNER_TEMP/published-release.json"
          test "$(jq -r .draft "$RUNNER_TEMP/published-release.json")" = "false"
          published_url="$(jq -r .html_url "$RUNNER_TEMP/published-release.json")"
          echo "Published $published_url" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke test ${{ matrix.os }}-${{ matrix.arch }}
    needs:
      - validate
      - publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install tagged Python SDK
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ./sdk/python/python

      - name: Download and exercise published binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
          TAU_ARCH: ${{ matrix.arch }}
          TAU_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail

          release_dir="$RUNNER_TEMP/release"
          bin_dir="$RUNNER_TEMP/bin"
          mkdir -p "$release_dir" "$bin_dir"
          cd "$release_dir"

          tau_gen_asset="tau-gen-$TAU_OS-$TAU_ARCH"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern install.sh \
            --pattern "$tau_gen_asset" \
            --pattern SHA256SUMS

          TAU_INSTALL_DIR="$bin_dir" TAU_VERSION="$TAG" sh install.sh
          awk -v asset="$tau_gen_asset" '$2 == asset' SHA256SUMS > tau-gen.checksums
          test "$(wc -l < tau-gen.checksums)" -eq 1
          shasum -a 256 --check tau-gen.checksums

          install -m 0755 "$tau_gen_asset" "$bin_dir/tau-gen"
          export PATH="$bin_dir:$PATH"

          test "$(tau version --short)" = "$TAG"
          tau --help >/dev/null
          tau-gen --help >/dev/null
          python -m tau.cli --help >/dev/null
