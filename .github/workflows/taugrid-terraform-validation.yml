name: TauGrid Terraform Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/taugrid-terraform-validation.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/taugrid-terraform-validation.yml"
  workflow_dispatch:

concurrency:
  group: taugrid-terraform-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Validate AKS Terraform module
        run: |
          terraform -chdir=terraform/aks fmt -check -recursive
          terraform -chdir=terraform/aks init -backend=false -lockfile=readonly
          terraform -chdir=terraform/aks validate
          bash terraform/aks/test-wait-for-adx-functions-ready.sh
          pwsh -NoProfile -NonInteractive -File terraform/aks/Test-AdxClusterName.ps1
