name: TauGrid Release Preflight

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: taugrid-release-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  detect:
    name: Detect release preparation
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.scope.outputs.enabled }}
      version: ${{ steps.scope.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect release-preflight scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          enabled=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            enabled=true
          else
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            if grep -Eq '^cli/releases/v[^/]+\.md$|^\.github/workflows/(release-tau|taugrid-release-preflight)\.ya?ml$' \
              <<<"$changed_files"; then
              enabled=true
            fi
          fi

          version="$(awk '$1 == "version:" { print $2; exit }' charts/taugrid/Chart.yaml)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "charts/taugrid/Chart.yaml has invalid release version '$version'" >&2
            exit 1
          fi
          if [[ "$enabled" == "true" && ! -s "cli/releases/v${version}.md" ]]; then
            echo "cli/releases/v${version}.md is required for release preflight" >&2
            exit 1
          fi

          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  gates:
    name: Release gates
    needs: detect
    if: needs.detect.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Test Go release modules
        run: |
          set -euo pipefail
          (cd core && go test ./...)
          (cd cli && go test ./...)

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test Python SDK compatibility
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e "./sdk/python/python[dev]"
          python -m pytest sdk/python/python/tests

      - name: Test release installer
        run: |
          shellcheck cli/scripts/install-tau.sh cli/scripts/test-install-tau.sh
          make -C cli test-installer

  build:
    name: Reproduce release assets
    needs: detect
    if: needs.detect.outputs.enabled == 'true'
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install wheel build frontend
        run: python -m pip install --disable-pip-version-check build==1.5.0

      - name: Build twice and compare
        env:
          VERSION: v${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail

          COMMIT="$(git rev-parse HEAD)"
          DATE="$(git show -s --format=%cI HEAD)"
          first="$RUNNER_TEMP/tau-release-a"
          second="$RUNNER_TEMP/tau-release-b"
          wheel_first_dir="$RUNNER_TEMP/tau-python-wheel-a"
          wheel_second_dir="$RUNNER_TEMP/tau-python-wheel-b"

          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -m build --wheel --outdir "$wheel_first_dir" ./sdk/python/python
          python -m build --wheel --outdir "$wheel_second_dir" ./sdk/python/python

          shopt -s nullglob
          wheel_first=("$wheel_first_dir"/tau-*.whl)
          wheel_second=("$wheel_second_dir"/tau-*.whl)
          if (( ${#wheel_first[@]} != 1 || ${#wheel_second[@]} != 1 )); then
            echo "expected exactly one Tau SDK wheel from each build" >&2
            exit 1
          fi
          wheel_name="$(basename "${wheel_first[0]}")"
          test "$(basename "${wheel_second[0]}")" = "$wheel_name"
          cmp "${wheel_first[0]}" "${wheel_second[0]}"

          make -C cli release-assets \
            VERSION="$VERSION" COMMIT="$COMMIT" DATE="$DATE" RELEASE_DIR="$first" \
            PYTHON_WHEEL="${wheel_first[0]}"
          make -C cli release-assets \
            VERSION="$VERSION" COMMIT="$COMMIT" DATE="$DATE" RELEASE_DIR="$second" \
            PYTHON_WHEEL="${wheel_second[0]}"

          expected=(
            LICENSE
            SHA256SUMS
            install.sh
            tau-darwin-amd64
            tau-darwin-arm64
            tau-gen-darwin-amd64
            tau-gen-darwin-arm64
            tau-gen-linux-amd64
            tau-gen-linux-arm64
            tau-linux-amd64
            tau-linux-arm64
            "$wheel_name"
          )
          printf '%s\n' "${expected[@]}" | sort > "$RUNNER_TEMP/expected-assets"
          find "$first" -maxdepth 1 -type f -exec basename {} \; | sort > "$RUNNER_TEMP/actual-assets"
          diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/actual-assets"

          diff -u "$first/SHA256SUMS" "$second/SHA256SUMS"
          (cd "$first" && shasum -a 256 --check SHA256SUMS)
          while read -r _ asset; do
            cmp "$first/$asset" "$second/$asset"
            case "$asset" in
              tau-darwin-* | tau-linux-* | tau-gen-darwin-* | tau-gen-linux-*)
                go version -m "$first/$asset"
                ;;
            esac
          done < "$first/SHA256SUMS"

          host_arch="$(go env GOHOSTARCH)"
          test "$("$first/tau-darwin-$host_arch" version --short)" = "$VERSION"
          "$first/tau-darwin-$host_arch" --help >/dev/null
          "$first/tau-gen-darwin-$host_arch" --help >/dev/null

      - name: Upload preflight assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tau-release-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/tau-release-a/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  images:
    name: Image / ${{ matrix.name }}
    needs: detect
    if: needs.detect.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tau
            image: tau
            make_directory: images/tau
            dockerfile: images/tau/Dockerfile
          - name: TauGrid Portal
            image: taugrid-portal
            make_directory: images/taugrid-portal
            dockerfile: images/taugrid-portal/Dockerfile
          - name: Tau core controller
            image: tau-core-controller
            make_directory: images/tau-core-controller
            dockerfile: images/tau-core-controller/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Validate image build contract
        env:
          IMAGE: ${{ matrix.image }}
          MAKE_DIRECTORY: ${{ matrix.make_directory }}
        run: scripts/ci/validate-image-build-contract.sh "$MAKE_DIRECTORY" "$IMAGE"

      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          platforms: linux/amd64
          pull: true
          push: false
          tags: taugrid/${{ matrix.image }}:release-preflight

      - name: Smoke test image
        run: docker run --rm "taugrid/${{ matrix.image }}:release-preflight" --help

  helm:
    name: Package and test Helm charts
    needs: detect
    if: needs.detect.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.6

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.1.2

      - name: Validate and package charts
        run: scripts/ci/publish-helm-charts.sh package "$RUNNER_TEMP/helm"

      - name: Run aligned chart unit tests
        run: |
          set -euo pipefail
          for chart in charts/tau-core-controller charts/taugrid-core charts/taugrid; do
            helm unittest "$chart"
          done

  required:
    name: Release preflight required
    if: always()
    needs:
      - detect
      - gates
      - build
      - images
      - helm
    runs-on: ubuntu-latest
    steps:
      - name: Check preflight result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DETECT_RESULT: ${{ needs.detect.result }}
          GATES_RESULT: ${{ needs.gates.result }}
          HELM_RESULT: ${{ needs.helm.result }}
          IMAGE_RESULT: ${{ needs.images.result }}
          PREFLIGHT_ENABLED: ${{ needs.detect.outputs.enabled }}
        run: |
          set -euo pipefail
          test "$DETECT_RESULT" = success
          if [[ "$PREFLIGHT_ENABLED" == "true" ]]; then
            test "$GATES_RESULT" = success
            test "$BUILD_RESULT" = success
            test "$IMAGE_RESULT" = success
            test "$HELM_RESULT" = success
          fi
