name: TauGrid Image Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .dockerignore
      - cli/**
      - controllers/tau-core/**
      - core/**
      - images/tau/**
      - images/tau-core-controller/**
      - images/taugrid-portal/**
      - portal/**
      - scripts/ci/validate-image-build-contract.sh
      - .github/workflows/taugrid-image-validation.yml
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - cli/**
      - controllers/tau-core/**
      - core/**
      - images/tau/**
      - images/tau-core-controller/**
      - images/taugrid-portal/**
      - portal/**
      - scripts/ci/validate-image-build-contract.sh
      - .github/workflows/taugrid-image-validation.yml
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: taugrid-image-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

env:
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c

jobs:
  image:
    name: Image / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tau
            image: tau
            make_directory: images/tau
            context: .
            dockerfile: images/tau/Dockerfile
          - name: TauGrid Portal
            image: taugrid-portal
            make_directory: images/taugrid-portal
            context: .
            dockerfile: images/taugrid-portal/Dockerfile
          - name: Tau core controller
            image: tau-core-controller
            make_directory: images/tau-core-controller
            context: .
            dockerfile: images/tau-core-controller/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate image build contract
        env:
          IMAGE: ${{ matrix.image }}
          MAKE_DIRECTORY: ${{ matrix.make_directory }}
        run: scripts/ci/validate-image-build-contract.sh "$MAKE_DIRECTORY" "$IMAGE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          platforms: linux/amd64
          pull: true
          push: false
          tags: taugrid/${{ matrix.image }}:validation

      - name: Smoke test image
        run: docker run --rm "taugrid/${{ matrix.image }}:validation" --help

      - name: Scan image for critical vulnerabilities
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" \
            image \
            --exit-code 1 \
            --format table \
            --ignore-unfixed \
            --scanners vuln \
            --severity CRITICAL \
            "taugrid/${{ matrix.image }}:validation"

      - name: Generate Trivy SARIF report
        id: sarif
        if: always() && !cancelled() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" \
            --volume "${{ github.workspace }}:/workspace" \
            "${TRIVY_IMAGE}" \
            image \
            --format sarif \
            --ignore-unfixed \
            --output "/workspace/trivy-${{ matrix.image }}.sarif" \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            "taugrid/${{ matrix.image }}:validation"

      - name: Upload Trivy SARIF report
        if: >-
          always() && !cancelled() && steps.sarif.outcome == 'success' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  required:
    name: Required
    if: always()
    needs:
      - image
    runs-on: ubuntu-latest
    steps:
      - name: Check validation result
        env:
          IMAGE_RESULT: ${{ needs.image.result }}
        run: test "${IMAGE_RESULT}" = success
