name: TauGrid Kubernetes Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: taugrid-kubernetes-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local
  KIND_VERSION: v0.32.0
  KIND_LINUX_AMD64_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54

jobs:
  scope:
    name: Kubernetes / Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.scope.outputs.enabled }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect validation scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/validation-scope.sh kubernetes

  controller-smoke:
    name: Controller smoke
    needs: scope
    if: needs.scope.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            controllers/tau-core/go.sum
            cli/go.sum
            core/go.sum

      - name: Install Kind
        shell: bash
        run: |
          kind_path="${RUNNER_TEMP}/kind"
          curl --fail --location --retry 3 \
            --output "${kind_path}" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_LINUX_AMD64_SHA256}  ${kind_path}" | sha256sum --check --strict
          chmod +x "${kind_path}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Run controller smoke
        env:
          TAU_CORE_KIND_DELETE_CLUSTER: "1"
          TAU_CORE_KIND_RECREATE: "1"
        run: make -C controllers/tau-core test-kind-e2e

  runtime-smoke:
    name: Runtime smoke
    needs: scope
    if: needs.scope.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            cli/go.sum
            core/go.sum

      - name: Install Kind
        shell: bash
        run: |
          kind_path="${RUNNER_TEMP}/kind"
          curl --fail --location --retry 3 \
            --output "${kind_path}" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_LINUX_AMD64_SHA256}  ${kind_path}" | sha256sum --check --strict
          chmod +x "${kind_path}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Run runtime smoke
        env:
          TAU_KIND_DELETE_CLUSTER: "1"
          TAU_KIND_RAY_WAIT_FOR_COMPLETION: "1"
          TAU_KIND_RECREATE: "1"
        run: make -C cli test-kind-e2e

  required:
    name: TauGrid Kubernetes Required
    if: always()
    needs:
      - scope
      - controller-smoke
      - runtime-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check validation result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_ENABLED: ${{ needs.scope.outputs.enabled }}
          CONTROLLER_SMOKE_RESULT: ${{ needs.controller-smoke.result }}
          RUNTIME_SMOKE_RESULT: ${{ needs.runtime-smoke.result }}
        run: |
          set -euo pipefail
          test "${SCOPE_RESULT}" = success
          case "${SCOPE_ENABLED}" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          test "${CONTROLLER_SMOKE_RESULT}" = "$expected"
          test "${RUNTIME_SMOKE_RESULT}" = "$expected"
