name: TauGrid Docs Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: taugrid-docs-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Docs / Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.scope.outputs.enabled }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect validation scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/validation-scope.sh docs

  docs:
    name: Docs
    needs: scope
    if: needs.scope.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WIKI_PARITY_ARGS: --skip-review-age
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            cli/go.sum
            site/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          check-latest: true
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build and check documentation
        run: make -C site check

  required:
    name: TauGrid Docs Required
    if: always()
    needs:
      - scope
      - docs
    runs-on: ubuntu-latest
    steps:
      - name: Check validation result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_ENABLED: ${{ needs.scope.outputs.enabled }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          set -euo pipefail
          test "${SCOPE_RESULT}" = success
          case "${SCOPE_ENABLED}" in
            true) test "${DOCS_RESULT}" = success ;;
            false) test "${DOCS_RESULT}" = skipped ;;
            *) exit 1 ;;
          esac
