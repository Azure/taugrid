 font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
<defs>
 <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
 <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="900.0" y="1086" text-anchor="middle" font-size="13" fill="#6b7280">TauGrid #278: capacity-aware Kueue admission. Red marks everything the design adds.</text>
<rect x="20" y="20" width="1760" height="270" rx="12" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
<text x="36" y="44" font-size="16" font-weight="700" fill="#6b7280">1 · CONFIGURATION — once per cluster (platform engineer)</text>
<rect x="20" y="305" width="1760" height="520" rx="12" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
<text x="36" y="329" font-size="16" font-weight="700" fill="#6b7280">2 · REQUEST PATH — every run</text>
<rect x="20" y="840" width="1760" height="215" rx="12" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
<text x="36" y="864" font-size="16" font-weight="700" fill="#6b7280">3 · BOUNDING AND CLEANUP</text>
<rect x="40" y="60" width="330" height="138" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray=""/>
<text x="52" y="86" font-weight="700" fill="#111827">TauCluster</text>
<text x="52" y="105" fill="#374151" font-weight="400">managementMode: Reconcile</text>
<text x="52" y="124" fill="#374151" font-weight="400">queues.ownership: Adopt</text>
<text x="52" y="143" fill="#dc2626" font-weight="700">queues.provisioning:</text>
<text x="52" y="162" fill="#dc2626" font-weight="700">  ownership: External|Adopt|Manage</text>
<text x="52" y="181" fill="#dc2626" font-weight="700">  configs: class, validUntil, retry</text>
<rect x="400" y="60" width="350" height="119" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray=""/>
<text x="412" y="86" font-weight="700" fill="#111827">TauGrid cluster controller</text>
<text x="412" y="105" fill="#374151" font-weight="400">reconcileDiscoveredGPUFlavors</text>
<text x="412" y="124" fill="#dc2626" font-weight="700">reconcileCapacityProvisioning</text>
<text x="412" y="143" fill="#dc2626" font-weight="700">  Manage: create + repair (SSA)</text>
<text x="412" y="162" fill="#dc2626" font-weight="700">  refuses unlabeled: OwnershipConflict</text>
<rect x="820" y="60" width="300" height="119" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7 4"/>
<text x="832" y="86" font-weight="700" fill="#111827">Kueue capacity wiring</text>
<text x="832" y="105" fill="#dc2626" font-weight="700">ProvisioningRequestConfig</text>
<text x="832" y="124" fill="#dc2626" font-weight="700">  best-effort-atomic-scale-up</text>
<text x="832" y="143" fill="#dc2626" font-weight="700">AdmissionCheck taugrid-cas-gpu</text>
<text x="832" y="162" fill="#dc2626" font-weight="700">  provisioning-request controller</text>
<rect x="1190" y="60" width="230" height="100" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray=""/>
<text x="1202" y="86" font-weight="700" fill="#111827">Profile observer</text>
<text x="1202" y="105" fill="#374151" font-weight="400">ExecutionReady</text>
<text x="1202" y="124" fill="#dc2626" font-weight="700">ProvisioningReady</text>
<text x="1202" y="143" fill="#dc2626" font-weight="700">  fails Required closed</text>
<rect x="1455" y="60" width="300" height="176" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray=""/>
<text x="1467" y="86" font-weight="700" fill="#111827">Workload profile gpu-a100-8</text>
<text x="1467" y="105" fill="#374151" font-weight="400">defaultLocalQueue: gpu-a100</text>
<text x="1467" y="124" fill="#374151" font-weight="400">workerCount 4, gpusPerWorker 8</text>
<text x="1467" y="143" fill="#dc2626" font-weight="700">capacity:</text>
<text x="1467" y="162" fill="#dc2626" font-weight="700">  provisioning: Required</text>
<text x="1467" y="181" fill="#dc2626" font-weight="700">  gatedFlavors: [a100-scale]</text>
<text x="1467" y="200" fill="#dc2626" font-weight="700">  admissionDeadline: 30m</text>
<text x="1467" y="219" fill="#dc2626" font-weight="700">  onDeadline: Fail</text>
