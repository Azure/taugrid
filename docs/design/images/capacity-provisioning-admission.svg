<text x="692" y="925" fill="#7f1d1d" font-weight="400">deadline = first QuotaReserved + 30m, written once</text>
<text x="692" y="944" fill="#7f1d1d" font-weight="400">① write terminal-reason on the RayJob</text>
<text x="692" y="963" fill="#7f1d1d" font-weight="400">② Workload spec.active=false (optimistic lock)</text>
<text x="692" y="982" fill="#7f1d1d" font-weight="400">TTL: delete the suspended owner</text>
