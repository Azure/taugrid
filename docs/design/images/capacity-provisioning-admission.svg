<text x="985.0" y="314" font-size="13" fill="#dc2626" font-style="italic">attached to the ClusterQueue</text>
<rect x="1330" y="620" width="420" height="100" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7 4"/>
<text x="1342" y="646" font-weight="700" fill="#111827">ProvisioningRequest</text>
<text x="1342" y="665" fill="#374151" font-weight="400">created by Kueue, owned by Workload</text>
<text x="1342" y="684" fill="#374151" font-weight="400">workers podSet only (onFlavors)</text>
<text x="1342" y="703" fill="#374151" font-weight="400">whole gang: 4 × 8 GPU</text>
<rect x="900" y="620" width="350" height="100" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7 4"/>
<text x="912" y="646" font-weight="700" fill="#111827">AKS Cluster Autoscaler</text>
<text x="912" y="665" fill="#374151" font-weight="400">atomic: all 4 nodes or none</text>
<text x="912" y="684" fill="#374151" font-weight="400">Provisioned / Failed / BookingExpired</text>
<text x="912" y="703" fill="#374151" font-weight="400">AKS: CapacityIsNotFound forever</text>
<rect x="470" y="620" width="320" height="100" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray=""/>
<text x="482" y="646" font-weight="700" fill="#111827">Admitted → unsuspend</text>
<text x="482" y="665" fill="#374151" font-weight="400">head on system pool (ungated)</text>
<text x="482" y="684" fill="#374151" font-weight="400">workers start together</text>
<text x="482" y="703" fill="#374151" font-weight="400">on the booked GPU nodes</text>
<rect x="40" y="620" width="360" height="100" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3" stroke-dasharray=""/>
<text x="52" y="646" font-weight="700" fill="#7f1d1d">tau run status --watch</text>
<text x="52" y="665" fill="#7f1d1d" font-weight="400">phase: Capacity provisioning</text>
<text x="52" y="684" fill="#7f1d1d" font-weight="400">attempt, elapsed, time to deadline</text>
<text x="52" y="703" fill="#7f1d1d" font-weight="400">reason from owner annotations</text>
