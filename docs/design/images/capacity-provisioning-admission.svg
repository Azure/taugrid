<text x="1342" y="906" font-weight="700" fill="#111827">Native bound (layer 2)</text>
<text x="1342" y="925" fill="#374151" font-weight="400">ValidUntilSeconds: 900</text>
<text x="1342" y="944" fill="#374151" font-weight="400">retryStrategy: backoffLimitCount 1</text>
<text x="1342" y="963" fill="#374151" font-weight="400">exhausted: Kueue deactivates</text>
