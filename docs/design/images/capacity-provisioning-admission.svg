<rect x="1124" y="76" width="67.6" height="19" rx="4" fill="white" opacity="0.92"/>
<text x="1129" y="90" font-size="13" fill="#dc2626" font-style="italic">verifies</text>
<rect x="40" y="345" width="230" height="81" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray=""/>
<text x="52" y="371" font-weight="700" fill="#111827">Researcher: tau run</text>
<text x="52" y="390" fill="#374151" font-weight="400">tau.yaml: profile gpu-a100-8</text>
<text x="52" y="409" fill="#374151" font-weight="400">no new fields</text>
<rect x="305" y="345" width="270" height="119" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3" stroke-dasharray=""/>
<text x="317" y="371" font-weight="700" fill="#7f1d1d">tau CLI preflight (layer 1)</text>
<text x="317" y="390" fill="#7f1d1d" font-weight="400">profile ProvisioningReady?</text>
<text x="317" y="409" fill="#7f1d1d" font-weight="400">gang ≤ pool max_count?</text>
<text x="317" y="428" fill="#7f1d1d" font-weight="400">no: error now, no quota held</text>
<text x="317" y="447" fill="#7f1d1d" font-weight="400">--skip-capacity-preflight</text>
<rect x="610" y="345" width="340" height="119" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray=""/>
<text x="622" y="371" font-weight="700" fill="#111827">RayJob (suspended, queue label)</text>
<text x="622" y="390" fill="#374151" font-weight="400">head ×1, workers ×4</text>
<text x="622" y="409" fill="#dc2626" font-weight="700">annotations:</text>
<text x="622" y="428" fill="#dc2626" font-weight="700">  tau.azure.com/admission-deadline</text>
<text x="622" y="447" fill="#dc2626" font-weight="700">  terminal-reason / -message / -at</text>
<rect x="985" y="345" width="290" height="100" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray=""/>
<text x="997" y="371" font-weight="700" fill="#111827">Kueue Workload</text>
<text x="997" y="390" fill="#374151" font-weight="400">podSets: head ×1, workers ×4</text>
<text x="997" y="409" fill="#374151" font-weight="400">QuotaReserved → Admitted</text>
<text x="997" y="428" fill="#dc2626" font-weight="700">spec.active=false at deadline</text>
<rect x="1330" y="345" width="420" height="138" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray=""/>
<text x="1342" y="371" font-weight="700" fill="#111827">LocalQueue → ClusterQueue gpu-a100</text>
<text x="1342" y="390" fill="#374151" font-weight="400">quota: 32 GPU on a100-scale</text>
<text x="1342" y="409" fill="#374151" font-weight="400">queueingStrategy: BestEffortFIFO</text>
<text x="1342" y="428" fill="#dc2626" font-weight="700">admissionChecksStrategy:</text>
<text x="1342" y="447" fill="#dc2626" font-weight="700">  taugrid-cas-gpu</text>
<text x="1342" y="466" fill="#dc2626" font-weight="700">  onFlavors: [a100-scale]</text>
