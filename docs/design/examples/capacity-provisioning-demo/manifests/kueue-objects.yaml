# Platform-side Kueue wiring for the success-path demo.
# In the design these are what Manage mode generates (§4.3); here they're applied by setup.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: team-a
  labels:
    tau.azure.com/workspace: team-a
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: a100-scale
spec:
  nodeLabels:
    agentpool: gpupool
  tolerations:
    - key: kwok.x-k8s.io/node
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ProvisioningRequestConfig
metadata:
  name: taugrid-cas-gpu
spec:
  provisioningClassName: best-effort-atomic-scale-up.autoscaling.x-k8s.io
  managedResources: [nvidia.com/gpu]
  parameters:
    ValidUntilSeconds: "900"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata:
  name: taugrid-cas-gpu
spec:
  controllerName: kueue.x-k8s.io/provisioning-request
  parameters:
    apiGroup: kueue.x-k8s.io
    kind: ProvisioningRequestConfig
    name: taugrid-cas-gpu
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: gpu-a100
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  admissionChecksStrategy:
    admissionChecks:
      - name: taugrid-cas-gpu
        onFlavors: [a100-scale]
  resourceGroups:
    - coveredResources: [cpu, memory, nvidia.com/gpu]
      flavors:
        - name: a100-scale
          resources:
            - { name: cpu, nominalQuota: "64" }
            - { name: memory, nominalQuota: 512Gi }
            - { name: nvidia.com/gpu, nominalQuota: "16" }
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: gpu-a100
  namespace: team-a
spec:
  clusterQueue: gpu-a100
---
# The node pool the fake Cluster Autoscaler simulates (an AKS pool with min 0).
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-nodepool
  namespace: kube-system
data:
  name: gpupool
  maxNodes: "2"
  gpusPerNode: "8"
  cpuPerNode: "16"
  memoryPerNode: 128Gi
  bootSeconds: "15"
  idleSeconds: "15"
