<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Tau researcher onboarding workspace design</title>
  <desc id="desc">Platform-owned TauWorkspace policy, Kueue admission, researcher activation, status conditions, and quota request flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker>
    <style>
      .lane { fill:#f8fafc; stroke:#cbd5e1; stroke-width:2; stroke-dasharray:7 5; }
      .label { font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#334155; }
      .box-title { font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      .box-text { font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      .small { font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569; }
      .arrow { stroke:#475569; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .arrow-green { stroke:#16a34a; stroke-width:2.5; fill:none; stroke-dasharray:7 5; marker-end:url(#arrowGreen); }
      .arrow-red { stroke:#dc2626; stroke-width:2.5; fill:none; stroke-dasharray:7 5; marker-end:url(#arrowRed); }
    </style>
  </defs>
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="40" y="34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Tau researcher onboarding: workspace contract and activation flow</text>
  <rect class="lane" x="30" y="60" width="1140" height="210" rx="14"/>
  <rect class="lane" x="30" y="305" width="1140" height="210" rx="14"/>
  <rect class="lane" x="30" y="550" width="1140" height="280" rx="14"/>
  <text class="label" x="55" y="92">Platform-owned workspace policy</text>
  <text class="label" x="55" y="337">Kubernetes / Kueue runtime boundary</text>
  <text class="label" x="55" y="582">Researcher and agent activation flow</text>

  <g transform="translate(60 120)"><rect width="180" height="85" rx="10" fill="#e8f0fe" stroke="#5b7cfa" stroke-width="2"/><text class="box-title" x="90" y="28" text-anchor="middle" fill="#1f2937">Platform owner / GitOps</text><text class="box-text" x="90" y="50" text-anchor="middle" fill="#1f2937">Defines team</text><text class="box-text" x="90" y="68" text-anchor="middle" fill="#1f2937">workspace once</text></g>
  <g transform="translate(280 108)"><rect width="220" height="110" rx="10" fill="#e8f0fe" stroke="#5b7cfa" stroke-width="2"/><text class="box-title" x="110" y="25" text-anchor="middle" fill="#1f2937">principalRef</text><text class="box-text" x="110" y="48" text-anchor="middle" fill="#1f2937">entra-group:sample-researchers</text><text class="box-text" x="110" y="70" text-anchor="middle" fill="#1f2937">team identity</text><text class="box-text" x="110" y="88" text-anchor="middle" fill="#1f2937">not per-user grants</text></g>
  <g transform="translate(540 92)"><rect width="250" height="140" rx="10" fill="#e6fffa" stroke="#0f766e" stroke-width="2"/><text class="box-title" x="125" y="24" text-anchor="middle" fill="#064e3b">TauWorkspace spec</text><text class="box-text" x="125" y="48" text-anchor="middle" fill="#064e3b">tau-system/sample</text><text class="box-text" x="125" y="67" text-anchor="middle" fill="#064e3b">principalRef + k8s subject</text><text class="box-text" x="125" y="86" text-anchor="middle" fill="#064e3b">target namespace=sample</text><text class="box-text" x="125" y="105" text-anchor="middle" fill="#064e3b">role + queue + defaults</text><text class="box-text" x="125" y="124" text-anchor="middle" fill="#064e3b">tau.azure.com</text></g>
  <g transform="translate(850 100)"><rect width="260" height="125" rx="10" fill="#e8f0fe" stroke="#5b7cfa" stroke-width="2"/><text class="box-title" x="130" y="32" text-anchor="middle" fill="#1f2937">Platform implementation</text><text class="box-text" x="130" y="60" text-anchor="middle" fill="#1f2937">create namespace</text><text class="box-text" x="130" y="82" text-anchor="middle" fill="#1f2937">RBAC + LocalQueue sample</text><text class="box-text" x="130" y="104" text-anchor="middle" fill="#1f2937">Kueue quota objects</text></g>

  <g transform="translate(70 370)"><rect width="190" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text class="box-title" x="95" y="26" text-anchor="middle" fill="#78350f">Tau CLI / SDK</text><text class="box-text" x="95" y="51" text-anchor="middle" fill="#78350f">Renders Job or RayJob</text><text class="box-text" x="95" y="70" text-anchor="middle" fill="#78350f">Does not grant access</text></g>
  <g transform="translate(330 365)"><rect width="220" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text class="box-title" x="110" y="27" text-anchor="middle" fill="#78350f">Kueue admission</text><text class="box-text" x="110" y="54" text-anchor="middle" fill="#78350f">queue=sample</text><text class="box-text" x="110" y="75" text-anchor="middle" fill="#78350f">quota is real boundary</text></g>
  <g transform="translate(620 365)"><rect width="220" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text class="box-title" x="110" y="27" text-anchor="middle" fill="#78350f">Workload pods</text><text class="box-text" x="110" y="54" text-anchor="middle" fill="#78350f">Run selected shape</text><text class="box-text" x="110" y="75" text-anchor="middle" fill="#78350f">write artifacts</text></g>
  <g transform="translate(910 365)"><rect width="220" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text class="box-title" x="110" y="27" text-anchor="middle" fill="#78350f">Output defaults</text><text class="box-text" x="110" y="52" text-anchor="middle" fill="#78350f">outputRoot=/data/projects/sample/runs</text><text class="box-text" x="110" y="74" text-anchor="middle" fill="#78350f">scratch=/mnt</text></g>

  <g transform="translate(65 625)"><rect width="175" height="90" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text class="box-title" x="87.5" y="27" text-anchor="middle" fill="#581c87">Researcher / agent</text><text class="box-text" x="87.5" y="55" text-anchor="middle" fill="#581c87">Member of</text><text class="box-text" x="87.5" y="73" text-anchor="middle" fill="#581c87">workspace group</text></g>
  <g transform="translate(275 620)"><rect width="200" height="105" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text class="box-title" x="100" y="25" text-anchor="middle" fill="#581c87">Day-one packet</text><text class="box-text" x="100" y="49" text-anchor="middle" fill="#581c87">workspace sample</text><text class="box-text" x="100" y="68" text-anchor="middle" fill="#581c87">context</text><text class="box-text" x="100" y="87" text-anchor="middle" fill="#581c87">defaults</text></g>
  <g transform="translate(515 625)"><rect width="180" height="95" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text class="box-title" x="90" y="27" text-anchor="middle" fill="#581c87">Local readiness</text><text class="box-text" x="90" y="54" text-anchor="middle" fill="#581c87">tau python doctor</text><text class="box-text" x="90" y="74" text-anchor="middle" fill="#581c87">auth/context</text></g>
  <g transform="translate(735 625)"><rect width="190" height="95" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text class="box-title" x="95" y="27" text-anchor="middle" fill="#581c87">Smoke/starter run</text><text class="box-text" x="95" y="54" text-anchor="middle" fill="#581c87">submit, admit, logs</text><text class="box-text" x="95" y="74" text-anchor="middle" fill="#581c87">storage write</text></g>
  <g transform="translate(965 615)"><rect width="155" height="115" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text class="box-title" x="77.5" y="24" text-anchor="middle" fill="#581c87">Real experiments</text><text class="box-text" x="77.5" y="49" text-anchor="middle" fill="#581c87">shape, image</text><text class="box-text" x="77.5" y="68" text-anchor="middle" fill="#581c87">runtime deps</text><text class="box-text" x="77.5" y="87" text-anchor="middle" fill="#581c87">dataset refs</text><text class="box-text" x="77.5" y="106" text-anchor="middle" fill="#581c87">artifacts</text></g>
  <g transform="translate(525 760)"><rect width="340" height="105" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text class="box-title" x="170" y="24" text-anchor="middle" fill="#14532d">TauWorkspace status</text><text class="box-text" x="170" y="48" text-anchor="middle" fill="#14532d">phase + conditions</text><text class="box-text" x="170" y="67" text-anchor="middle" fill="#14532d">RBACReady, QueueReady</text><text class="box-text" x="170" y="86" text-anchor="middle" fill="#14532d">WorkloadIdentityReady, DriftDetected</text></g>
  <g transform="translate(930 765)"><rect width="195" height="85" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text class="box-title" x="97.5" y="27" text-anchor="middle" fill="#7f1d1d">TauQuotaRequest</text><text class="box-text" x="97.5" y="54" text-anchor="middle" fill="#7f1d1d">separate approval</text><text class="box-text" x="97.5" y="72" text-anchor="middle" fill="#7f1d1d">for burst quota</text></g>

  <path class="arrow" d="M240 162 L280 162"/><path class="arrow" d="M500 162 L540 162"/><path class="arrow" d="M790 162 L850 162"/>
  <path class="arrow" d="M980 225 L460 365"/><path class="arrow" d="M1030 225 L1020 365"/>
  <path class="arrow" d="M240 670 L275 670"/><path class="arrow" d="M475 670 L515 670"/><path class="arrow" d="M695 670 L735 670"/><path class="arrow" d="M925 670 L965 670"/>
  <path class="arrow" d="M605 625 L200 460"/><path class="arrow" d="M260 415 L330 415"/><path class="arrow" d="M550 415 L620 415"/><path class="arrow" d="M840 415 L910 415"/>
  <path class="arrow-green" d="M980 225 C970 520 840 690 760 760"/><path class="arrow-green" d="M525 812 C310 815 190 740 155 715"/>
  <path class="arrow-red" d="M1040 730 L1030 765"/><text class="small" x="1005" y="750">if quota pressure persists</text>
  <path class="arrow-red" d="M930 807 C720 875 200 870 150 205"/><text class="small" x="585" y="875">approval updates Kueue/GitOps quota</text>
</svg>
