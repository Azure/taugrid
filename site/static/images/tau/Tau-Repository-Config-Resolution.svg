<ellipse cx="148" cy="750" rx="28" ry="28" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text x="148" y="754" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000"><tspan x="148" dy="0">SRC</tspan></text>
<text x="192" y="740" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="192" dy="0">PROJECT CONTENT</tspan></text>
<text x="192" y="780" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="192" dy="0">Code + image contract</tspan></text>
<text x="124" y="826" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#000000"><tspan x="124" dy="0">Project owns source, dependencies,</tspan><tspan x="124" dy="19">image, and model behavior</tspan></text>
