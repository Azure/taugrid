<text x="712" y="482" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="712" dy="0">PARSE</tspan></text>
<text x="712" y="523" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#000000"><tspan x="712" dy="0">Direct run config or generated managed manifest</tspan></text>
