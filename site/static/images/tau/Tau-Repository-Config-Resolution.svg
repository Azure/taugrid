<text x="668" y="720" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000"><tspan x="668" dy="0">4</tspan></text>
<text x="712" y="706" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="712" dy="0">RESOLVE</tspan></text>
