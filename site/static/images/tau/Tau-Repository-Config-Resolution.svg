<text x="192" y="900" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="192" dy="0">OPTIONAL</tspan></text>
<text x="192" y="939" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#000000"><tspan x="192" dy="0">Generated managed</tspan><tspan x="192" dy="23">manifest</tspan></text>
<text x="124" y="986" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#000000"><tspan x="124" dy="0">Python SDK / advanced</tspan><tspan x="124" dy="19">workflow handoff</tspan></text>
