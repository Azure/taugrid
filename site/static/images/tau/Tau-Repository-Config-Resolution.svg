<text x="1100" y="1245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#000000"><tspan x="1100" dy="0">The checked-in direct config is the normal researcher contract; managed manifests are SDK-generated or advanced renderer handoffs.</tspan></text>
