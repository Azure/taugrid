<text x="1658" y="884" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000"><tspan x="1658" dy="0">LIVE</tspan></text>
<text x="1702" y="870" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="1702" dy="0">LIFECYCLE</tspan></text>
<text x="1702" y="919" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#000000"><tspan x="1702" dy="0">Tau observation surface</tspan></text>
<text x="1634" y="979" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#000000"><tspan x="1634" dy="0">status · logs · list · get · cancel</tspan></text>
<polyline points="496,640 566,640" fill="none" stroke="#0078D4" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="1486,640 1556,640" fill="none" stroke="#F7630C" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
