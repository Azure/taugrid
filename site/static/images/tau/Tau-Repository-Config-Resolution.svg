  <rect width="2200" height="1300" fill="#FFFFFF"/>
  <text x="56" y="72" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#000000"><tspan x="56" dy="0">How repository intent becomes a workload</tspan></text>
<text x="58" y="122" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#4B5A70"><tspan x="58" dy="0">Tau keeps user-authored intent reviewable, resolves platform defaults, then renders open Kubernetes resources</tspan></text>
<polyline points="56,164 2144,164" fill="none" stroke="#0078D4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="56" y="230" width="440" height="820" rx="22" fill="transparent" stroke="#0078D4" stroke-width="4"/>
<text x="276" y="278" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#000000"><tspan x="276" dy="0">PROJECT REPOSITORY</tspan></text>
<rect x="96" y="340" width="360" height="150" rx="22" fill="#CFE4FA" stroke="#0078D4" stroke-width="3" filter="url(#shadow)"/>
<ellipse cx="148" cy="390" rx="28" ry="28" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text x="148" y="394" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000"><tspan x="148" dy="0">WS</tspan></text>
<text x="192" y="380" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="192" dy="0">CONNECTION</tspan></text>
<text x="192" y="420" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="192" dy="0">workspace.connection.</tspan><tspan x="192" dy="25">yaml</tspan></text>
<text x="124" y="466" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#000000"><tspan x="124" dy="0">Cluster/workspace metadata;</tspan><tspan x="124" dy="19">no credentials</tspan></text>
<rect x="96" y="520" width="360" height="150" rx="22" fill="#CFE4FA" stroke="#0078D4" stroke-width="3" filter="url(#shadow)"/>
<ellipse cx="148" cy="570" rx="28" ry="28" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text x="148" y="574" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000"><tspan x="148" dy="0">CFG</tspan></text>
<text x="192" y="560" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="192" dy="0">RUN INTENT</tspan></text>
<text x="192" y="600" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="192" dy="0">tau.yaml / named config</tspan></text>
<text x="124" y="646" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#000000"><tspan x="124" dy="0">Engine · entrypoint · runtime</tspan><tspan x="124" dy="19">compute · storage · resilience</tspan></text>
