<ellipse cx="1658" cy="400" rx="28" ry="28" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
<text x="1658" y="404" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000"><tspan x="1658" dy="0">YAML</tspan></text>
<text x="1702" y="390" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="1702" dy="0">DRY RUN</tspan></text>
