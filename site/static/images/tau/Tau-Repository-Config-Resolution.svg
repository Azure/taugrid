<text x="668" y="608" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000"><tspan x="668" dy="0">3</tspan></text>
<text x="712" y="594" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="712" dy="0">VALIDATE</tspan></text>
<text x="712" y="635" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#000000"><tspan x="712" dy="0">Schema, names, resources, mounts, secrets</tspan></text>
