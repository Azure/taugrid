<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1300" viewBox="0 0 2200 1300">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#172033" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#4B5A70"/>
    </marker>
  </defs>
  <rect width="2200" height="1300" fill="#FFFFFF"/>
  <text x="56" y="72" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#000000"><tspan x="56" dy="0">Who uses Tau?</tspan></text>
<text x="58" y="122" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#4B5A70"><tspan x="58" dy="0">One shared contract, different jobs to be done</tspan></text>
<polyline points="56,164 2144,164" fill="none" stroke="#0078D4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="1100" cy="590" rx="220" ry="150" fill="#FFF4CE" stroke="#F7630C" stroke-width="5" filter="url(#shadow)"/>
<text x="1100" y="528" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#000000"><tspan x="1100" dy="0">TAU</tspan></text>
<text x="1100" y="578" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#000000"><tspan x="1100" dy="0">Repository intent</tspan><tspan x="1100" dy="33">→ governed execution</tspan><tspan x="1100" dy="33">→ durable evidence</tspan></text>
<rect x="56" y="240" width="520" height="260" rx="22" fill="#CFE4FA" stroke="#0078D4" stroke-width="3" filter="url(#shadow)"/>
<ellipse cx="108" cy="290" rx="28" ry="28" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text x="108" y="294" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000"><tspan x="108" dy="0">DEV</tspan></text>
<text x="152" y="280" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="152" dy="0">RESEARCHER / DATA SCIENTIST</tspan></text>
<text x="152" y="329" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#000000"><tspan x="152" dy="0">Run and iterate</tspan></text>
<text x="84" y="391" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000"><tspan x="84" dy="0">Wants: less platform glue</tspan><tspan x="84" dy="26">Uses: run · status · logs · get</tspan><tspan x="84" dy="26">Owns: code, config, scientific result</tspan></text>
<rect x="56" y="760" width="520" height="260" rx="22" fill="#E8DAEF" stroke="#5C2D91" stroke-width="3" filter="url(#shadow)"/>
<ellipse cx="108" cy="810" rx="28" ry="28" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
<text x="108" y="814" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000"><tspan x="108" dy="0">PLAT</tspan></text>
<text x="152" y="800" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="152" dy="0">PLATFORM ENGINEER</tspan></text>
<text x="152" y="849" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#000000"><tspan x="152" dy="0">Provide a safe paved road</tspan></text>
<text x="84" y="911" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000"><tspan x="84" dy="0">Wants: policy without ticket-driven YAML</tspan><tspan x="84" dy="26">Uses: workspace, queue, topology validation</tspan><tspan x="84" dy="26">Owns: access, quota, storage, identity</tspan></text>
<rect x="1624" y="240" width="520" height="260" rx="22" fill="#DFF6DD" stroke="#107C10" stroke-width="3" filter="url(#shadow)"/>
<ellipse cx="1676" cy="290" rx="28" ry="28" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
<text x="1676" y="294" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000"><tspan x="1676" dy="0">ML</tspan></text>
<text x="1720" y="280" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="1720" dy="0">ML INFRA ENGINEER</tspan></text>
<text x="1720" y="329" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#000000"><tspan x="1720" dy="0">Build reusable workload contracts</tspan></text>
<text x="1652" y="391" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000"><tspan x="1652" dy="0">Wants: portable Ray/Job rendering</tspan><tspan x="1652" dy="26">Uses: profiles, renderers, SDK integration</tspan><tspan x="1652" dy="26">Owns: images, runtime and framework patterns</tspan></text>
<rect x="1624" y="760" width="520" height="260" rx="22" fill="#FDE7E9" stroke="#D13438" stroke-width="3" filter="url(#shadow)"/>
<ellipse cx="1676" cy="810" rx="28" ry="28" fill="#FDE7E9" stroke="#D13438" stroke-width="2"/>
<text x="1676" y="814" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000"><tspan x="1676" dy="0">OPS</tspan></text>
<text x="1720" y="800" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="1720" dy="0">OPERATOR / ON-CALL</tspan></text>
<text x="1720" y="849" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#000000"><tspan x="1720" dy="0">Find the blocked layer</tspan></text>
<text x="1652" y="911" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000"><tspan x="1652" dy="0">Wants: actionable lifecycle evidence</tspan><tspan x="1652" dy="26">Uses: queue status, events, logs, metrics</tspan><tspan x="1652" dy="26">Owns: recovery and platform health</tspan></text>
<rect x="730" y="810" width="740" height="250" rx="22" fill="#D8F3F2" stroke="#038387" stroke-width="3" filter="url(#shadow)"/>
<ellipse cx="782" cy="860" rx="28" ry="28" fill="#D8F3F2" stroke="#038387" stroke-width="2"/>
<text x="782" y="864" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000"><tspan x="782" dy="0">OSS</tspan></text>
<text x="826" y="850" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="826" dy="0">OPEN-SOURCE CONTRIBUTOR</tspan></text>
<text x="826" y="899" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#000000"><tspan x="826" dy="0">Extend the contract</tspan></text>
<text x="758" y="961" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000"><tspan x="758" dy="0">Wants: clear package and provider boundaries</tspan><tspan x="758" dy="26">Uses: Go CLI, Python SDK, expstore, renderers</tspan><tspan x="758" dy="26">Owns: compatibility, tests, docs and release evidence</tspan></text>
<polyline points="576,370 880,520" fill="none" stroke="#0078D4" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="576,870 880,660" fill="none" stroke="#5C2D91" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="1624,370 1320,520" fill="none" stroke="#107C10" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="1624,870 1320,660" fill="none" stroke="#D13438" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="1100,810 1100,740" fill="none" stroke="#038387" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="56" y="1214" width="2088" height="54" rx="15" fill="#F3F2F1" stroke="#5B6573" stroke-width="2"/>
<text x="1100" y="1245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#000000"><tspan x="1100" dy="0">The shared boundary: projects declare intent, Tau resolves and observes it, and the platform retains infrastructure policy.</tspan></text>
</svg>