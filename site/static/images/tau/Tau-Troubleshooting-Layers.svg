<text x="1100" y="1084" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#000000"><tspan x="1100" dy="0">SUCCESS REQUIRES ALL FIVE: RESOLVED → ADMITTED → SCHEDULED → GPU READY → MODEL PROGRESS</tspan></text>
