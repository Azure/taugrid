<text x="1100" y="1245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#000000"><tspan x="1100" dy="0">Do not describe `tau serve deploy` flags in the design document as generally available until the CLI contract and quickstart are released and validated.</tspan></text>
