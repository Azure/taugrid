<text x="852" y="330" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="852" dy="0">LOCAL GATES</tspan></text>
<text x="852" y="372" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000"><tspan x="852" dy="0">Test the component</tspan></text>
<text x="784" y="436" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#000000"><tspan x="784" dy="0">Focused tests · full Go tests</tspan><tspan x="784" dy="19">Python tests · vet / formatting</tspan></text>
