<text x="1552" y="372" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000"><tspan x="1552" dy="0">Tag and reproduce</tspan></text>
<text x="1484" y="436" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#000000"><tspan x="1484" dy="0">Annotated vX.Y.Z on main</tspan><tspan x="1484" dy="19">version parity · double build</tspan></text>
<polyline points="1746,455 1806,455" fill="none" stroke="#4B5A70" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
