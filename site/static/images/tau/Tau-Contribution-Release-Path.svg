<text x="1202" y="330" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="1202" dy="0">SYSTEM GATES</tspan></text>
<text x="1202" y="372" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000"><tspan x="1202" dy="0">Validate integration</tspan></text>
<text x="1134" y="436" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#000000"><tspan x="1134" dy="0">Kind smoke for workload changes</tspan><tspan x="1134" dy="19">live cluster for runtime/telemetry</tspan></text>
