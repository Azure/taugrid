<ellipse cx="168" cy="870" rx="28" ry="28" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
<text x="168" y="874" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000"><tspan x="168" dy="0">UNIT</tspan></text>
<text x="212" y="860" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="212" dy="0">PORTABLE INTERNAL PACKAGE</tspan></text>
<text x="212" y="901" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#000000"><tspan x="212" dy="0">Local tests can be sufficient</tspan></text>
<text x="144" y="937" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000"><tspan x="144" dy="0">fileutil · jsonlutil · expstore · importer logic</tspan><tspan x="144" dy="17">when no external contract changes</tspan></text>
<rect x="806" y="820" width="590" height="150" rx="22" fill="#FFF4CE" stroke="#F7630C" stroke-width="3" filter="url(#shadow)"/>
<ellipse cx="858" cy="870" rx="28" ry="28" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
<text x="858" y="874" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000"><tspan x="858" dy="0">E2E</tspan></text>
<text x="902" y="860" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="902" dy="0">MANIFEST / RUNTIME / TELEMETRY</tspan></text>
<text x="902" y="901" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#000000"><tspan x="902" dy="0">End-to-end evidence required</tspan></text>
<text x="834" y="937" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000"><tspan x="834" dy="0">Exercise the smallest safe Kind or live-cluster path</tspan><tspan x="834" dy="17">and preserve durable evidence</tspan></text>
<rect x="1496" y="820" width="590" height="150" rx="22" fill="#CFE4FA" stroke="#0078D4" stroke-width="3" filter="url(#shadow)"/>
<ellipse cx="1548" cy="870" rx="28" ry="28" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text x="1548" y="874" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000"><tspan x="1548" dy="0">DOC</tspan></text>
<text x="1592" y="860" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="1592" dy="0">EVERY USER-FACING CHANGE</tspan></text>
<text x="1592" y="901" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#000000"><tspan x="1592" dy="0">Docs and compatibility review</tspan></text>
<text x="1524" y="937" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000"><tspan x="1524" dy="0">Update examples, maturity labels, release notes,</tspan><tspan x="1524" dy="17">and the visual contract when behavior moves</tspan></text>
<rect x="56" y="1214" width="2088" height="54" rx="15" fill="#F3F2F1" stroke="#5B6573" stroke-width="2"/>
<text x="1100" y="1245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#000000"><tspan x="1100" dy="0">A green unit test is not release evidence for a change whose claim depends on Kubernetes, GPU runtime, telemetry, or cross-language packaging.</tspan></text>
