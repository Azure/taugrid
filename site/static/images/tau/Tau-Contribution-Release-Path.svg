<text x="1902" y="330" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="1902" dy="0">PUBLISH + PROVE</tspan></text>
<text x="1902" y="372" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000"><tspan x="1902" dy="0">Release artifacts</tspan></text>
<text x="1834" y="436" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#000000"><tspan x="1834" dy="0">Checksums · GitHub Release</tspan><tspan x="1834" dy="19">clean bootstrap smoke</tspan></text>
<rect x="56" y="700" width="2088" height="320" rx="22" fill="transparent" stroke="#5B6573" stroke-width="4"/>
<text x="86" y="747" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#000000"><tspan x="86" dy="0">VALIDATION DEPTH BY CHANGE</tspan></text>
