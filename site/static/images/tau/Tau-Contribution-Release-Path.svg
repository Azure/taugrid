<text x="152" y="330" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="152" dy="0">CONTRACT</tspan></text>
<text x="152" y="372" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000"><tspan x="152" dy="0">Name the user path</tspan></text>
<text x="84" y="436" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#000000"><tspan x="84" dy="0">Behavior · compatibility</tspan><tspan x="84" dy="19">stable outputs · retry semantics</tspan></text>
