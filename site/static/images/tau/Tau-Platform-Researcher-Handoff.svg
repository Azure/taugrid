<text x="192" y="366" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="192" dy="0">CLOUD / IAC</tspan></text>
<text x="192" y="411" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#000000"><tspan x="192" dy="0">Provision infrastructure</tspan></text>
<text x="124" y="476" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#000000"><tspan x="124" dy="0">Cluster · network · node pools</tspan><tspan x="124" dy="25">identity · storage · registry</tspan></text>
