<text x="148" y="770" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000"><tspan x="148" dy="0">GO</tspan></text>
<text x="192" y="756" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#000000"><tspan x="192" dy="0">WHAT THE RESEARCHER RECEIVES</tspan></text>
<text x="192" y="803" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#000000"><tspan x="192" dy="0">A usable contract, not cluster-admin work</tspan></text>
<text x="124" y="867" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000"><tspan x="124" dy="0">Normal cluster-user access · Ready workspace</tspan><tspan x="124" dy="26">Default queue/storage contract · runnable named configs</tspan></text>
<rect x="760" y="1070" width="650" height="44" rx="22" fill="#FDE7E9" stroke="#D13438" stroke-width="2"/>
<text x="1085" y="1094" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#000000"><tspan x="1085" dy="0">CURRENT: CLUSTER-WIDE USER ACCESS IS NOT ISOLATION</tspan></text>
