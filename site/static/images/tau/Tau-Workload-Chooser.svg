<polyline points="476,375 550,375 550,610 600,610" fill="none" stroke="#4B5A70" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="476,375 550,375 550,890 600,890" fill="none" stroke="#4B5A70" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="1030,610 1090,610 1090,330 1170,330" fill="none" stroke="#5C2D91" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="1030,610 1170,610" fill="none" stroke="#107C10" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="1030,890 1170,890" fill="none" stroke="#5C2D91" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 9" marker-end="url(#arrow)"/>
<polyline points="1600,330 1680,330 1680,610 1740,610" fill="none" stroke="#038387" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="1600,610 1680,610 1680,610 1740,610" fill="none" stroke="#038387" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="1600,890 1680,890 1680,610 1740,610" fill="none" stroke="#038387" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="520" y="1060" width="980" height="44" rx="22" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text x="1010" y="1084" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#000000"><tspan x="1010" dy="0">SMOKE IS A SMALL VALIDATION RUN, NOT A DISTINCT WORKLOAD ENGINE</tspan></text>
<rect x="56" y="1214" width="2088" height="54" rx="15" fill="#F3F2F1" stroke="#5B6573" stroke-width="2"/>
<text x="1100" y="1245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#000000"><tspan x="1100" dy="0">Serving remains future UX; do not infer that every target flag or lifecycle command is shipped from the design contract alone.</tspan></text>
</svg>