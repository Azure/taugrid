<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="560" viewBox="0 0 2000 560" role="img" aria-labelledby="title desc">
  <title id="title">TauGrid quickstart flow</title>
  <desc id="desc">Four stages: create AKS, install TauGrid, create a workspace, and run a GPU workload.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#172033" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#4B5A70"/>
    </marker>
  </defs>

  <rect width="2000" height="560" fill="#FFFFFF"/>
  <text x="80" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#172033">TauGrid quickstart</text>
  <line x1="80" y1="125" x2="1920" y2="125" stroke="#0078D4" stroke-width="3"/>

  <rect x="80" y="180" width="400" height="250" rx="24" fill="#F3F2F1" stroke="#5B6573" stroke-width="3" filter="url(#shadow)"/>
  <text x="280" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#172033">AKS setup</text>
  <rect x="125" y="305" width="310" height="76" rx="16" fill="#FFFFFF" stroke="#5B6573" stroke-width="2"/>
  <text x="280" y="353" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="25" fill="#172033">az aks create</text>

  <line x1="480" y1="305" x2="540" y2="305" stroke="#4B5A70" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="560" y="180" width="400" height="250" rx="24" fill="#E8DAEF" stroke="#5C2D91" stroke-width="3" filter="url(#shadow)"/>
  <text x="760" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#5C2D91">TauGrid setup</text>
  <rect x="605" y="305" width="310" height="76" rx="16" fill="#FFFFFF" stroke="#5C2D91" stroke-width="2"/>
  <text x="760" y="353" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="24" fill="#172033">tau cluster install</text>

  <line x1="960" y1="305" x2="1020" y2="305" stroke="#4B5A70" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="1040" y="180" width="400" height="250" rx="24" fill="#FFF4CE" stroke="#F7630C" stroke-width="3" filter="url(#shadow)"/>
  <text x="1240" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#C84B00">Workspace setup</text>
  <rect x="1085" y="305" width="310" height="76" rx="16" fill="#FFFFFF" stroke="#F7630C" stroke-width="2"/>
  <text x="1240" y="353" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="22" fill="#172033">tau workspace create</text>

  <line x1="1440" y1="305" x2="1500" y2="305" stroke="#4B5A70" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="1520" y="180" width="400" height="250" rx="24" fill="#DFF6DD" stroke="#107C10" stroke-width="3" filter="url(#shadow)"/>
  <text x="1720" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#107C10">GPU workload</text>
  <rect x="1565" y="305" width="310" height="76" rx="16" fill="#FFFFFF" stroke="#107C10" stroke-width="2"/>
  <text x="1720" y="353" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="25" fill="#172033">tau run</text>
</svg>
