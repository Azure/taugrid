{{- $status := .Get "status" | default "shipped" -}}
{{- $reviewed := .Get "reviewed" | default "unknown" -}}
<aside class="tau-maturity tau-maturity--{{ $status | anchorize }}" aria-label="Documentation maturity">
  <strong>{{ $status | upper }}</strong>
  <span>Last reviewed {{ $reviewed }}</span>
</aside>
